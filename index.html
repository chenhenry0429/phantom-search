<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PHANTOM SEARCH</title>

<style>
:root{
    --red:#ef1023;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffc928;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;
}

/* =========================================================
   MAIN STAGE
========================================================= */

.stage{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#000;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:absolute;

    inset:-2%;

    background-image:
        url("assets/home-bg.png?v=4");

    background-size:cover;
    background-position:center 48%;
    background-repeat:no-repeat;

    transform:scale(1.025);

    transition:
        transform .55s cubic-bezier(.2,.8,.2,1),
        filter .4s ease;
}

/* 轻微暗角 */

.background::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 55% 48%,
            transparent 42%,
            rgba(0,0,0,.12) 72%,
            rgba(0,0,0,.28) 100%
        );
}

/* =========================================================
   TOP NAV
========================================================= */

.top-nav{
    position:absolute;

    top:22px;
    right:32px;

    z-index:30;

    display:flex;
    align-items:center;

    gap:7px;

    padding:5px 9px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(3px);

    clip-path:
        polygon(
            5% 0,
            100% 0,
            97% 100%,
            0 85%
        );
}

.nav-divider{
    width:1px;
    height:26px;

    margin:0 4px;

    background:
        rgba(255,255,255,.45);
}

.nav-link{
    position:relative;

    display:flex;
    align-items:center;

    gap:8px;

    padding:9px 13px;

    color:#fff;

    text-decoration:none;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:14px;
    font-weight:900;

    transition:
        color .15s ease,
        transform .15s ease;
}

.nav-link:hover{
    color:var(--yellow);

    transform:
        translateY(-3px);
}

.nav-link::after{
    content:"";

    position:absolute;

    left:10px;
    right:10px;
    bottom:2px;

    height:3px;

    background:var(--red);

    transform:scaleX(0);

    transform-origin:left;

    transition:
        transform .17s ease;
}

.nav-link:hover::after{
    transform:scaleX(1);
}

.nav-icon{
    color:var(--red);

    font-size:17px;
}

/* =========================================================
   SEARCH AREA
========================================================= */

.search-area{
    position:absolute;

    left:5.4%;
    top:54%;

    width:min(720px,47vw);

    z-index:25;
}

/* =========================================================
   SEARCH FORM
========================================================= */

.search-form{
    position:relative;

    display:flex;

    width:100%;
    height:62px;

    background:#fff;

    border:
        4px solid
        var(--black);

    box-shadow:
        0 0 0 2px #fff,
        8px 8px 0 rgba(0,0,0,.82);

    clip-path:
        polygon(
            1% 4%,
            100% 0,
            96% 95%,
            0 100%
        );

    transform:
        rotate(-.5deg);

    transition:
        transform .17s ease,
        filter .17s ease;
}

.search-form:focus-within{
    transform:
        rotate(-.5deg)
        translateY(-3px);

    filter:
        drop-shadow(
            0 0 9px
            rgba(255,230,0,.65)
        );
}

/* 搜索框扫描光 */

.search-form::after{
    content:"";

    position:absolute;

    top:0;
    left:-40%;

    width:24%;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,230,0,.16),
            rgba(255,255,255,.72),
            transparent
        );

    transform:
        skewX(-20deg);

    opacity:0;
}

.search-form:focus-within::after{
    animation:
        searchScan .75s ease-out;
}

@keyframes searchScan{

    0%{
        left:-40%;
        opacity:0;
    }

    18%{
        opacity:1;
    }

    100%{
        left:120%;
        opacity:0;
    }
}

/* =========================================================
   SEARCH INPUT
========================================================= */

.search-input{
    flex:1;

    min-width:0;

    border:0;
    outline:0;

    padding:
        0 25px;

    color:#181818;
    background:#fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:16px;
    font-weight:700;
}

.search-input::placeholder{
    color:#999;
}

/* =========================================================
   SEARCH BUTTON
========================================================= */

.search-button{
    position:relative;

    width:100px;

    border:0;

    color:#fff;

    background:
        var(--red);

    cursor:pointer;

    clip-path:
        polygon(
            20% 0,
            100% 0,
            100% 100%,
            0 100%
        );

    transition:
        color .15s ease,
        background .15s ease;
}

.search-button:hover{
    color:#050505;

    background:
        var(--yellow);
}

.search-icon{
    position:absolute;

    left:56%;
    top:47%;

    width:24px;
    height:24px;

    border:
        4px solid
        currentColor;

    border-radius:50%;

    transform:
        translate(-50%,-50%);
}

.search-icon::after{
    content:"";

    position:absolute;

    right:-9px;
    bottom:-5px;

    width:12px;
    height:4px;

    border-radius:3px;

    background:
        currentColor;

    transform:
        rotate(45deg);
}

/* =========================================================
   ENGINE SELECTOR
========================================================= */

.engine-section{
    display:flex;

    align-items:center;

    gap:15px;

    margin-top:22px;
}

.engine-title{
    flex:none;

    color:#fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;
    font-weight:900;

    white-space:nowrap;

    text-shadow:
        2px 2px 0 #000;
}

.engine-buttons{
    flex:1;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.engine{
    position:relative;

    height:46px;

    border:
        2px solid
        rgba(255,255,255,.8);

    color:#fff;

    background:
        rgba(5,5,5,.92);

    box-shadow:
        4px 4px 0 #000;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;
    font-weight:800;

    cursor:pointer;

    transition:
        transform .14s ease,
        border-color .14s ease,
        color .14s ease,
        background .14s ease;
}

.engine:hover{
    border-color:
        var(--yellow);

    transform:
        translateY(-3px);
}

.engine.active{
    color:#050505;

    background:
        var(--yellow);

    border-color:#050505;

    box-shadow:
        5px 5px 0
        var(--red);
}

/* =========================================================
   NOTE
========================================================= */

.search-note{
    margin:
        16px 0 0 12px;

    color:
        rgba(255,255,255,.67);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:11px;

    text-shadow:
        2px 2px 0 #000;
}

/* =========================================================
   SUBTLE HAND ENERGY
========================================================= */

.hand-energy{
    position:absolute;

    left:84.2%;
    top:60.8%;

    width:72px;
    height:72px;

    z-index:14;

    pointer-events:none;

    opacity:.58;

    transform:
        translate(-50%,-50%);
}

.energy-ring{
    position:absolute;

    inset:0;

    border:
        1.5px solid
        rgba(255,214,40,.48);

    border-radius:50%;

    animation:
        energyIdle
        3s ease-in-out infinite;
}

.energy-ring:nth-child(2){
    inset:16px;

    animation-delay:
        -.8s;
}

.energy-core{
    position:absolute;

    left:50%;
    top:50%;

    width:6px;
    height:6px;

    border-radius:50%;

    background:
        var(--yellow);

    box-shadow:
        0 0 10px var(--yellow),
        0 0 18px var(--red);

    transform:
        translate(-50%,-50%);
}

@keyframes energyIdle{

    0%,
    100%{
        opacity:.12;

        transform:
            scale(.65)
            rotate(0deg);
    }

    50%{
        opacity:.48;

        transform:
            scale(1.08)
            rotate(90deg);
    }
}

/* =========================================================
   CURSOR
========================================================= */

.cursor{
    position:fixed;

    left:-100px;
    top:-100px;

    width:28px;
    height:28px;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}

.cursor::before{
    content:"";

    position:absolute;

    inset:2px;

    border:
        2px solid
        var(--yellow);

    border-radius:50%;

    box-shadow:
        0 0 8px
        rgba(255,230,0,.8);
}

.cursor::after{
    content:"✦";

    position:absolute;

    inset:0;

    display:grid;
    place-items:center;

    color:
        var(--red);

    font-size:14px;
}

.trail{
    position:fixed;

    width:6px;
    height:6px;

    z-index:9998;

    pointer-events:none;

    background:
        var(--yellow);

    clip-path:
        polygon(
            50% 0,
            65% 35%,
            100% 50%,
            65% 65%,
            50% 100%,
            35% 65%,
            0 50%,
            35% 35%
        );

    animation:
        trailFade .5s
        forwards;
}

.trail.red{
    background:
        var(--red);
}

@keyframes trailFade{

    from{
        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    to{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.1)
            rotate(150deg);
    }
}

/* =========================================================
   TRANSITION
========================================================= */

.transition{
    position:fixed;

    inset:0;

    z-index:5000;

    overflow:hidden;

    pointer-events:none;

    visibility:hidden;
}

.transition-red{
    position:absolute;

    inset:-25%;

    background:
        var(--red);

    opacity:0;

    transform:
        translateX(-130%)
        rotate(-7deg);
}

.transition-black{
    position:absolute;

    inset:-25%;

    background:#000;

    opacity:0;

    transform:
        translateX(130%)
        rotate(6deg);
}

.transition-flash{
    position:absolute;

    inset:0;

    background:#fff;

    opacity:0;
}

/* =========================================================
   CREATOR TRANSITION
========================================================= */

body.to-creator
.transition{
    visibility:visible;
}

body.to-creator
.background{
    transform:
        scale(1.09)
        translate(-2%,1%);

    filter:
        contrast(1.08)
        saturate(1.1);
}

body.to-creator
.hand-energy{
    animation:
        creatorEnergy .45s
        ease-out forwards;
}

body.to-creator
.transition-flash{
    animation:
        flash .20s
        .23s forwards;
}

body.to-creator
.transition-red{
    animation:
        creatorRed .42s
        .25s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

body.to-creator
.transition-black{
    animation:
        creatorBlack .38s
        .37s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

@keyframes creatorEnergy{

    45%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(2.2);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(4);
    }
}

@keyframes creatorRed{

    to{
        opacity:1;

        transform:
            translateX(-22%)
            rotate(-7deg);
    }
}

@keyframes creatorBlack{

    to{
        opacity:1;

        transform:
            translateX(22%)
            rotate(6deg);
    }
}

/* =========================================================
   FEEDBACK TRANSITION
========================================================= */

body.to-feedback
.transition{
    visibility:visible;
}

body.to-feedback
.background{
    transform:
        scale(1.11)
        translate(-3%,1%);

    filter:
        contrast(1.1)
        saturate(1.13);
}

body.to-feedback
.hand-energy{
    animation:
        feedbackEnergy .36s
        ease-out forwards;
}

body.to-feedback
.transition-flash{
    animation:
        flash .18s
        .16s forwards;
}

body.to-feedback
.transition-red{
    animation:
        feedbackRed .38s
        .18s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

body.to-feedback
.transition-black{
    animation:
        feedbackBlack .35s
        .30s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

@keyframes feedbackEnergy{

    45%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(2.8);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(5);
    }
}

@keyframes feedbackRed{

    0%{
        opacity:1;

        transform:
            translateX(125%)
            rotate(-7deg);
    }

    100%{
        opacity:1;

        transform:
            translateX(-20%)
            rotate(-7deg);
    }
}

@keyframes feedbackBlack{

    0%{
        opacity:1;

        transform:
            translateX(-125%)
            rotate(6deg);
    }

    100%{
        opacity:1;

        transform:
            translateX(20%)
            rotate(6deg);
    }
}

@keyframes flash{

    0%,
    100%{
        opacity:0;
    }

    50%{
        opacity:.85;
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

    .search-area{
        width:52vw;

        left:4.5%;
    }
}

@media(max-width:800px){

    .background{
        background-position:
            65% center;

        filter:
            brightness(.72);
    }

    .search-area{
        left:5%;
        top:auto;
        bottom:6%;

        width:90%;

        padding:
            13px;

        background:
            rgba(0,0,0,.73);

        border-left:
            5px solid
            var(--red);

        clip-path:
            polygon(
                0 5%,
                98% 0,
                100% 94%,
                2% 100%
            );
    }

    .search-form{
        height:55px;
    }

    .engine-section{
        display:block;

        margin-top:14px;
    }

    .engine-title{
        display:none;
    }

    .engine-buttons{
        gap:6px;
    }

    .engine{
        height:42px;

        font-size:10px;
    }

    .search-note{
        display:none;
    }

    .top-nav{
        top:10px;
        right:8px;
    }

    .nav-link{
        padding:
            7px 9px;

        font-size:11px;
    }

    .hand-energy{
        display:none;
    }
}

/* =========================================================
   POINTER
========================================================= */

@media(pointer:fine){

    body,
    input,
    button,
    a{
        cursor:none;
    }
}

@media(pointer:coarse){

    .cursor{
        display:none;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }
}

</style>
</head>

<body>

<div class="stage">

    <!-- FINAL CLEAN BACKGROUND -->

    <div
        class="background"
        id="background">
    </div>


    <!-- NAV -->

    <nav class="top-nav">

        <a
            href="feedback.html"
            class="nav-link"
            id="feedbackLink">

            <span class="nav-icon">
                ✉
            </span>

            <span>
                反馈
            </span>

        </a>


        <div class="nav-divider"></div>


        <a
            href="creator.html"
            class="nav-link"
            id="creatorLink">

            <span class="nav-icon">
                ♟
            </span>

            <span>
                创作者信息
            </span>

        </a>

    </nav>


    <!-- SEARCH -->

    <main class="search-area">

        <form
            class="search-form"
            id="searchForm">

            <input
                class="search-input"
                id="searchInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="搜索任何内容..."
            >


            <button
                class="search-button"
                type="submit"
                aria-label="搜索">

                <span class="search-icon"></span>

            </button>

        </form>


        <!-- SEARCH ENGINES -->

        <div class="engine-section">

            <span class="engine-title">
                快捷搜索：
            </span>


            <div class="engine-buttons">

                <button
                    type="button"
                    class="engine active"
                    data-engine="bing">
                    Bing
                </button>

                <button
                    type="button"
                    class="engine"
                    data-engine="google">
                    Google
                </button>

                <button
                    type="button"
                    class="engine"
                    data-engine="youtube">
                    YouTube
                </button>

                <button
                    type="button"
                    class="engine"
                    data-engine="wikipedia">
                    Wikipedia
                </button>

            </div>

        </div>


        <div class="search-note">
            默认使用 Bing；可以切换搜索引擎，也可以直接输入网址访问。
        </div>

    </main>


    <!-- SUBTLE HAND ENERGY -->

    <div class="hand-energy">

        <div class="energy-ring"></div>

        <div class="energy-ring"></div>

        <div class="energy-core"></div>

    </div>

</div>


<!-- TRANSITION -->

<div class="transition">

    <div class="transition-flash"></div>

    <div class="transition-red"></div>

    <div class="transition-black"></div>

</div>


<!-- CURSOR -->

<div
    class="cursor"
    id="cursor">
</div>


<script>

/* =========================================================
   SEARCH
========================================================= */

const searchForm =
    document.getElementById(
        "searchForm"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const engineButtons =
    document.querySelectorAll(
        ".engine"
    );


let currentEngine =
    "bing";


const engines = {

    bing:
        "https://www.bing.com/search?q=",

    google:
        "https://www.google.com/search?q=",

    youtube:
        "https://www.youtube.com/results?search_query=",

    wikipedia:
        "https://zh.wikipedia.org/w/index.php?search="

};


/* ENGINE SWITCH */

engineButtons.forEach(button=>{

    button.addEventListener(
        "click",
        function(){

            engineButtons.forEach(
                item =>
                    item.classList.remove(
                        "active"
                    )
            );


            this.classList.add(
                "active"
            );


            currentEngine =
                this.dataset.engine;


            searchInput.focus();

        }
    );

});


/* SEARCH SUBMIT */

searchForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        performSearch();

    }
);


function performSearch(){

    const value =
        searchInput.value.trim();


    if(!value){

        searchInput.focus();

        return;
    }


    /* https://example.com */

    if(
        /^https?:\/\//i
        .test(value)
    ){

        location.href =
            value;

        return;
    }


    /* example.com */

    if(
        !/\s/.test(value)
        &&
        /^[a-z0-9-]+(\.[a-z0-9-]+)+([/?#].*)?$/i
        .test(value)
    ){

        location.href =
            "https://" + value;

        return;
    }


    /* normal search */

    location.href =
        engines[currentEngine]
        +
        encodeURIComponent(value);

}


/* =========================================================
   TRANSITIONS
========================================================= */

let leaving =
    false;


const creatorLink =
    document.getElementById(
        "creatorLink"
    );

const feedbackLink =
    document.getElementById(
        "feedbackLink"
    );


creatorLink.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        leavePage(
            this.href,
            "creator"
        );

    }
);


feedbackLink.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        leavePage(
            this.href,
            "feedback"
        );

    }
);


function leavePage(
    url,
    type
){

    if(leaving){
        return;
    }


    leaving =
        true;


    document.body
        .classList
        .add(
            type === "creator"
            ?
            "to-creator"
            :
            "to-feedback"
        );


    setTimeout(
        function(){

            location.href =
                url;

        },
        680
    );

}


/* =========================================================
   PARALLAX
========================================================= */

const background =
    document.getElementById(
        "background"
    );


document.addEventListener(
    "mousemove",
    function(event){

        if(leaving){
            return;
        }


        const x =
            event.clientX
            /
            innerWidth
            -
            .5;


        const y =
            event.clientY
            /
            innerHeight
            -
            .5;


        background.style.transform =
            `
            scale(1.03)
            translate(
                ${x * -5}px,
                ${y * -3}px
            )
            `;

    }
);


/* =========================================================
   CURSOR
========================================================= */

const cursor =
    document.getElementById(
        "cursor"
    );


let mouseX =
    -100;

let mouseY =
    -100;

let cursorX =
    -100;

let cursorY =
    -100;

let lastTrail =
    0;


document.addEventListener(
    "mousemove",
    function(event){

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;


        createTrail(
            mouseX,
            mouseY
        );

    }
);


function cursorLoop(){

    cursorX +=
        (
            mouseX
            -
            cursorX
        )
        *
        .3;


    cursorY +=
        (
            mouseY
            -
            cursorY
        )
        *
        .3;


    cursor.style.left =
        cursorX + "px";

    cursor.style.top =
        cursorY + "px";


    requestAnimationFrame(
        cursorLoop
    );

}


cursorLoop();


function createTrail(
    x,
    y
){

    if(
        !matchMedia(
            "(pointer:fine)"
        ).matches
    ){
        return;
    }


    const now =
        performance.now();


    if(
        now
        -
        lastTrail
        <
        45
    ){
        return;
    }


    lastTrail =
        now;


    const particle =
        document.createElement(
            "span"
        );


    particle.className =
        Math.random() > .58
        ?
        "trail red"
        :
        "trail";


    particle.style.left =
        (
            x
            +
            (
                Math.random()
                -
                .5
            )
            *
            10
        )
        +
        "px";


    particle.style.top =
        (
            y
            +
            (
                Math.random()
                -
                .5
            )
            *
            10
        )
        +
        "px";


    document.body.appendChild(
        particle
    );


    setTimeout(
        function(){

            particle.remove();

        },
        520
    );

}

</script>

</body>
</html>
