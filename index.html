<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHANTOM SEARCH</title><style>:root{--r:#ef1023;--b:#070707;--w:#fffdf2;--y:#ffe600}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--w);font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;background:radial-gradient(circle,rgba(0,0,0,.72) 0 1.3px,transparent 1.5px) 0 0/10px 10px,linear-gradient(118deg,var(--b) 0 22%,transparent 22.2% 73%,var(--b) 73.2% 89%,transparent 89.2%),var(--r);overflow:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(105deg,transparent 0 34px,#fff 35px 37px,transparent 38px 72px)}a{text-decoration:none;color:inherit}.top{position:absolute;top:25px;right:4vw;display:flex;gap:14px;z-index:5}.top a{color:var(--b);background:var(--w);border:3px solid var(--b);padding:9px 16px;box-shadow:4px 4px 0 var(--b);transform:skew(-7deg);font-size:14px}.top a:first-child{background:var(--y)}main{min-height:100vh;display:grid;place-items:center;padding:90px 20px}.stage{width:min(980px,100%);text-align:center}.stamp{display:inline-block;color:var(--b);background:var(--y);border:4px solid var(--b);padding:7px 15px;box-shadow:5px 5px 0 var(--b);transform:rotate(-2deg)}h1{font-size:clamp(68px,13vw,145px);line-height:.82;margin:28px 0 34px;letter-spacing:-.06em;text-shadow:8px 8px 0 var(--b);-webkit-text-stroke:3px var(--b);transform:rotate(-3deg)}h1 span{display:inline-block;color:var(--r);background:var(--w);padding:0 .08em;clip-path:polygon(2% 4%,100% 0,97% 93%,0 100%)}.sub{font-family:"Microsoft YaHei",sans-serif;font-weight:700;margin:0 auto 28px;max-width:620px;padding:10px 14px;background:var(--b)}.search{display:flex;max-width:820px;margin:auto;transform:rotate(-1deg)}.search input{flex:1;min-width:0;height:62px;padding:0 20px;font-size:18px;font-family:"Microsoft YaHei",sans-serif;font-weight:700;border:5px solid var(--b);outline:0;background:var(--w);color:var(--b);box-shadow:8px 8px 0 var(--b)}.search button{width:145px;border:5px solid var(--b);border-left:0;background:var(--r);color:var(--w);font:900 19px Impact,"Arial Black",sans-serif;cursor:pointer;box-shadow:8px 8px 0 var(--b)}.search button:hover{background:var(--y);color:var(--b)}.quick{margin-top:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.quick button{font-family:"Microsoft YaHei",sans-serif;font-weight:700;border:3px solid var(--b);background:var(--w);padding:7px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--b)}.note{margin-top:48px;font-family:"Microsoft YaHei",sans-serif;font-size:12px}.corner{position:fixed;left:25px;bottom:25px;background:var(--b);padding:10px 14px;transform:rotate(-8deg);font-size:13px}.phantom{position:fixed;left:25px;bottom:68px;width:70px;height:112px;z-index:30;pointer-events:none;filter:drop-shadow(5px 5px 0 var(--b));animation:f 2.8s ease-in-out infinite}.phantom i{position:absolute;background:var(--b);display:block}.phantom .h{left:25px;top:0;width:24px;height:24px;border:5px solid var(--b);background:var(--w);border-radius:50%}.phantom .bd{left:14px;top:28px;width:44px;height:60px;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}.phantom .a{top:35px;width:32px;height:8px;border-radius:8px}.phantom .a1{left:0;transform:rotate(25deg)}.phantom .a2{left:39px;transform:rotate(-25deg);transform-origin:left}.phantom .l{top:84px;width:10px;height:28px}.phantom .l1{left:20px;transform:rotate(7deg)}.phantom .l2{left:44px;transform:rotate(-7deg)}@keyframes f{50%{transform:translateY(-7px) rotate(3deg)}}.transition{position:fixed;inset:0;background:var(--r);z-index:100;opacity:0;pointer-events:none;clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%);transition:opacity .15s,clip-path .42s cubic-bezier(.77,0,.18,1)}body.leaving .transition{opacity:1;clip-path:polygon(0 0,100% 8%,100% 100%,0 92%)}body.leaving .phantom{animation:none;transform:translate(55vw,-45vh) rotate(360deg) scale(1.3);transition:transform .45s cubic-bezier(.2,.8,.2,1)}@media(max-width:650px){.top{right:15px}.top a{font-size:12px;padding:8px 11px}.search{display:block;transform:none}.search input,.search button{width:100%;height:56px}.search button{border:5px solid var(--b);margin-top:10px}.corner{display:none}.phantom{left:8px;bottom:12px;transform:scale(.8);transform-origin:bottom left}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="transition"></div><div class="phantom" aria-hidden="true"><i class="h"></i><i class="bd"></i><i class="a a1"></i><i class="a a2"></i><i class="l l1"></i><i class="l l2"></i></div><header class="top"><a href="#">反馈</a><a href="creator.html" data-transition>创作者信息</a></header><main><div class="stage"><div class="stamp">SEARCH THE WEB / TAKE YOUR TIME</div><h1>PHANTOM<br><span>SEARCH</span></h1><p class="sub">输入关键词，前往你选择的搜索引擎。一个具有怪盗团视觉气质的极简搜索入口。</p><form class="search" id="form"><input id="q" autocomplete="off" placeholder="想搜索什么？"><button>搜索 ↗</button></form><div class="quick"><button data-q="人工智能">人工智能</button><button data-q="设计灵感">设计灵感</button><button data-q="网页开发">网页开发</button><button data-q="今日新闻">今日新闻</button></div><div class="note">默认使用 Bing 搜索；也可以直接输入网址访问。</div><div class="corner">CREATED BY 陈植轩</div></div></main><script>const f=document.getElementById('form'),q=document.getElementById('q');f.addEventListener('submit',e=>{e.preventDefault();let x=q.value.trim();if(!x){q.focus();return}location.href=/^https?:\/\//i.test(x)?x:'https://www.bing.com/search?q='+encodeURIComponent(x)});document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;f.requestSubmit()});document.querySelectorAll('[data-transition]').forEach(a=>a.onclick=e=>{e.preventDefault();document.body.classList.add('leaving');setTimeout(()=>location.href=a.href,430)});</script></body></html>
