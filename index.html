<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="P5 风格搜索主页"><title>PHANTOM SEARCH</title><style>
:root{--red:#ef1023;--black:#070707;--white:#fffdf2;--yellow:#ffe600}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--red)}
body{font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;color:var(--white);overflow-x:hidden;background:radial-gradient(circle,rgba(0,0,0,.72) 0 1.3px,transparent 1.5px) 0 0/10px 10px,linear-gradient(118deg,var(--black) 0 22%,transparent 22.2% 73%,var(--black) 73.2% 89%,transparent 89.2%),var(--red)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(105deg,transparent 0 34px,#fff 35px 37px,transparent 38px 72px)}
a{text-decoration:none;color:inherit}.top{position:absolute;top:25px;left:0;right:0;z-index:5;display:flex;justify-content:flex-end;gap:14px;padding:0 4vw}.top a{color:var(--black);background:var(--white);border:3px solid var(--black);padding:9px 16px;box-shadow:4px 4px 0 var(--black);transform:skew(-7deg);font-size:14px}.top a:first-child{background:var(--yellow)}
main{min-height:100vh;display:grid;place-items:center;padding:110px 20px 70px}.stage{width:min(980px,100%);text-align:center;position:relative}.stamp{display:inline-block;color:var(--black);background:var(--yellow);border:4px solid var(--black);padding:7px 15px;box-shadow:5px 5px 0 var(--black);transform:rotate(-2deg)}
h1{font-size:clamp(68px,13vw,145px);line-height:.82;margin:28px 0 34px;letter-spacing:-.06em;text-shadow:8px 8px 0 var(--black);-webkit-text-stroke:3px var(--black);transform:rotate(-3deg)}h1 span{display:inline-block;color:var(--red);background:var(--white);padding:0 .08em;clip-path:polygon(2% 4%,100% 0,97% 93%,0 100%);text-shadow:5px 5px 0 var(--black)}
.sub{font-family:"Microsoft YaHei",sans-serif;font-weight:700;margin:0 auto 28px;max-width:620px;padding:10px 14px;background:var(--black)}.search{display:flex;max-width:820px;margin:auto;gap:0;transform:rotate(-1deg)}.search input{flex:1;min-width:0;height:62px;padding:0 20px;font-size:18px;font-family:"Microsoft YaHei",sans-serif;font-weight:700;border:5px solid var(--black);outline:none;background:var(--white);color:var(--black);box-shadow:8px 8px 0 var(--black)}.search button{width:145px;border:5px solid var(--black);border-left:0;background:var(--red);color:var(--white);font:900 19px Impact,"Arial Black",sans-serif;cursor:pointer;box-shadow:8px 8px 0 var(--black)}.search button:hover{background:var(--yellow);color:var(--black)}
.quick{margin-top:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.quick button{font-family:"Microsoft YaHei",sans-serif;font-weight:700;border:3px solid var(--black);background:var(--white);padding:7px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--black)}.note{margin-top:48px;font-family:"Microsoft YaHei",sans-serif;font-size:12px}.corner{position:absolute;left:-30px;bottom:-50px;background:var(--black);padding:10px 14px;transform:rotate(-8deg);font-size:13px}
@media(max-width:650px){.top{padding:0 15px}.top a{font-size:12px;padding:8px 11px}.search{display:block;transform:none}.search input,.search button{width:100%;height:56px}.search button{border:5px solid var(--black);margin-top:10px}.corner{display:none}}
</style></head><body><header class="top"><a href="feedback.html">反馈</a><a href="creator.html">创作者信息</a></header><main><div class="stage"><div class="stamp">SEARCH THE WEB / TAKE YOUR TIME</div><h1>PHANTOM<br><span>SEARCH</span></h1><p class="sub">输入关键词，前往你选择的搜索引擎。一个具有怪盗团视觉气质的极简搜索入口。</p><form class="search" id="searchForm"><input id="q" name="q" autocomplete="off" placeholder="想搜索什么？" aria-label="搜索关键词"><button type="submit">搜索 ↗</button></form><div class="quick"><button data-q="人工智能">人工智能</button><button data-q="设计灵感">设计灵感</button><button data-q="网页开发">网页开发</button><button data-q="今日新闻">今日新闻</button></div><div class="note">默认使用 Bing 搜索；也可以直接输入网址访问。</div><div class="corner">CREATED BY 陈植轩</div></div></main><script>const form=document.getElementById('searchForm'),input=document.getElementById('q');form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q){input.focus();return}if(/^https?:\/\//i.test(q)){location.href=q;return}location.href='https://www.bing.com/search?q='+encodeURIComponent(q)});document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.q;form.requestSubmit()}));</script></body></html>
