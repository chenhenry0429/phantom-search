<!doctype html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PHANTOM SEARCH</title>

<style>

:root{
    --red:#ed1024;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffc928;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;
}

/* =========================================================
   FULL SCREEN
========================================================= */

.stage{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================================================
   BACKGROUND

   不再限制 3:2
   直接铺满整个浏览器
========================================================= */

.background{
    position:absolute;
    inset:-2%;

    background-image:
        url("assets/home-bg.png");

    background-repeat:no-repeat;
    background-position:center 51%;
    background-size:cover;

    transform:scale(1.025);

    transition:
        transform .6s cubic-bezier(.2,.75,.2,1),
        filter .4s ease;
}

/* 暗角 */

.background::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 55% 45%,
            transparent 35%,
            rgba(0,0,0,.10) 65%,
            rgba(0,0,0,.35) 100%
        );
}

/* =========================================================
   COVER ORIGINAL FAKE UI

   原图片已经画有搜索框和按钮。
   这里把那一部分自然遮住，
   再放真正可以操作的 HTML。
========================================================= */

.search-mask{
    position:absolute;

    left:0;
    top:48%;

    width:61%;
    height:27%;

    z-index:5;

    pointer-events:none;

    background:
        linear-gradient(
            105deg,
            rgba(2,2,2,.98) 0%,
            rgba(2,2,2,.97) 80%,
            rgba(2,2,2,.82) 92%,
            transparent 100%
        );

    clip-path:
        polygon(
            0 7%,
            96% 0,
            100% 89%,
            7% 100%,
            0 88%
        );
}

/* 红色漫画切片 */

.search-mask::before{
    content:"";

    position:absolute;

    left:-5%;
    bottom:-14px;

    width:62%;
    height:9px;

    background:var(--red);

    transform:rotate(-2deg);
}

/* =========================================================
   TOP NAV MASK
========================================================= */

.nav-mask{
    position:absolute;

    right:0;
    top:0;

    width:30%;
    height:10%;

    z-index:8;

    pointer-events:none;

    background:
        linear-gradient(
            100deg,
            transparent 0%,
            rgba(0,0,0,.80) 18%,
            rgba(0,0,0,.96) 35%
        );

    clip-path:
        polygon(
            12% 0,
            100% 0,
            100% 100%,
            0 78%
        );
}

/* =========================================================
   NAVIGATION
========================================================= */

.top-nav{
    position:absolute;

    top:20px;
    right:32px;

    z-index:30;

    display:flex;
    align-items:center;

    gap:10px;
}

.nav-link{
    position:relative;

    display:flex;
    align-items:center;

    gap:9px;

    padding:
        9px 14px;

    color:#fff;

    text-decoration:none;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:14px;
    font-weight:900;

    transition:
        transform .16s ease,
        color .16s ease;
}

.nav-link:hover{
    color:var(--yellow);

    transform:
        translateY(-3px);
}

.nav-link::after{
    content:"";

    position:absolute;

    left:10px;
    right:10px;

    bottom:2px;

    height:3px;

    background:var(--red);

    transform:scaleX(0);

    transform-origin:left;

    transition:
        transform .18s ease;
}

.nav-link:hover::after{
    transform:scaleX(1);
}

.nav-icon{
    color:var(--red);
    font-size:18px;
}

.nav-divider{
    width:1px;
    height:25px;

    background:
        rgba(255,255,255,.45);
}

/* =========================================================
   REAL SEARCH AREA
========================================================= */

.search-area{
    position:absolute;

    left:5.2%;
    top:52%;

    width:min(760px,51vw);

    z-index:20;
}

/* =========================================================
   SEARCH BAR
========================================================= */

.search-form{
    position:relative;

    display:flex;

    width:100%;
    height:62px;

    background:#fff;

    border:4px solid #050505;

    box-shadow:
        0 0 0 2px #fff,
        8px 8px 0 rgba(0,0,0,.85);

    clip-path:
        polygon(
            1% 5%,
            100% 0,
            96% 95%,
            0 100%
        );

    transform:rotate(-.4deg);

    transition:
        transform .18s ease,
        filter .18s ease;
}

.search-form:focus-within{
    transform:
        rotate(-.4deg)
        translateY(-3px);

    filter:
        drop-shadow(
            0 0 9px
            rgba(255,230,0,.6)
        );
}

/* 输入扫描光 */

.search-form::after{
    content:"";

    position:absolute;

    left:-35%;
    top:0;

    width:22%;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,230,0,.15),
            rgba(255,255,255,.75),
            transparent
        );

    transform:skewX(-20deg);

    opacity:0;
}

.search-form:focus-within::after{
    animation:
        searchScan .8s ease-out;
}

@keyframes searchScan{

    0%{
        left:-35%;
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        left:120%;
        opacity:0;
    }

}

/* =========================================================
   INPUT
========================================================= */

.search-input{
    flex:1;

    min-width:0;

    border:0;
    outline:0;

    padding:
        0 25px;

    background:#fff;
    color:#191919;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:16px;
    font-weight:700;
}

.search-input::placeholder{
    color:#999;
}

/* =========================================================
   SEARCH BUTTON
========================================================= */

.search-button{
    position:relative;

    width:100px;

    border:0;

    background:var(--red);
    color:white;

    cursor:pointer;

    clip-path:
        polygon(
            20% 0,
            100% 0,
            100% 100%,
            0 100%
        );

    transition:
        background .15s ease,
        color .15s ease;
}

.search-button:hover{
    color:#050505;
    background:var(--yellow);
}

.search-icon{
    position:absolute;

    left:56%;
    top:47%;

    width:24px;
    height:24px;

    border:
        4px solid
        currentColor;

    border-radius:50%;

    transform:
        translate(-50%,-50%);
}

.search-icon::after{
    content:"";

    position:absolute;

    width:12px;
    height:4px;

    right:-9px;
    bottom:-5px;

    background:
        currentColor;

    border-radius:4px;

    transform:
        rotate(45deg);
}

/* =========================================================
   ENGINE SELECTOR
========================================================= */

.engine-section{
    display:flex;

    align-items:center;

    margin-top:22px;

    gap:16px;

    transform:
        rotate(-.5deg);
}

.engine-title{
    flex:none;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:14px;
    font-weight:900;

    white-space:nowrap;

    text-shadow:
        2px 2px #000;
}

.engine-buttons{
    flex:1;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;
}

.engine{
    position:relative;

    height:48px;

    border:
        2px solid
        rgba(255,255,255,.8);

    color:white;

    background:
        rgba(7,7,7,.95);

    box-shadow:
        4px 4px 0 #000;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;
    font-weight:800;

    cursor:pointer;

    transition:
        transform .14s ease,
        background .14s ease,
        color .14s ease,
        border-color .14s ease;
}

.engine:hover{
    border-color:
        var(--yellow);

    transform:
        translateY(-3px);
}

.engine.active{
    color:#050505;

    background:
        var(--yellow);

    border-color:
        #050505;

    box-shadow:
        5px 5px 0
        var(--red);
}

/* =========================================================
   SEARCH TIP
========================================================= */

.search-note{
    margin:
        17px 0 0 13px;

    color:
        rgba(255,255,255,.65);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:11px;
}

/* =========================================================
   HAND ENERGY

   人物右手附近的小型动画
========================================================= */

.hand-energy{
    position:absolute;

    left:83.5%;
    top:60%;

    width:85px;
    height:85px;

    z-index:12;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}

.ring{
    position:absolute;

    inset:0;

    border:
        2px solid
        rgba(255,211,36,.55);

    border-radius:50%;

    animation:
        ringPulse 2.8s
        ease-in-out infinite;
}

.ring:nth-child(2){
    inset:18px;

    animation-delay:
        -.6s;
}

.energy-dot{
    position:absolute;

    left:50%;
    top:50%;

    width:7px;
    height:7px;

    border-radius:50%;

    background:
        var(--yellow);

    box-shadow:
        0 0 12px
        var(--yellow),
        0 0 22px
        var(--red);

    transform:
        translate(-50%,-50%);
}

@keyframes ringPulse{

    0%,
    100%{
        opacity:.15;

        transform:
            scale(.6)
            rotate(0);
    }

    50%{
        opacity:.6;

        transform:
            scale(1.15)
            rotate(80deg);
    }

}

/* =========================================================
   CURSOR
========================================================= */

.cursor{
    position:fixed;

    left:-50px;
    top:-50px;

    width:28px;
    height:28px;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}

.cursor::before{
    content:"";

    position:absolute;

    inset:2px;

    border:
        2px solid
        var(--yellow);

    border-radius:50%;

    box-shadow:
        0 0 8px
        var(--yellow);
}

.cursor::after{
    content:"✦";

    position:absolute;

    inset:0;

    display:grid;
    place-items:center;

    color:var(--red);

    font-size:15px;
}

.trail{
    position:fixed;

    width:6px;
    height:6px;

    z-index:9998;

    pointer-events:none;

    background:
        var(--yellow);

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    animation:
        trailFade .5s
        forwards;
}

@keyframes trailFade{

    to{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(150deg)
            scale(.1);
    }

}

/* =========================================================
   TRANSITION

   重点修复：
   默认状态完全隐藏！
========================================================= */

.transition{
    position:fixed;

    inset:0;

    z-index:5000;

    overflow:hidden;

    pointer-events:none;

    visibility:hidden;
}

/* 默认完全在屏幕外 */

.red-slice{
    position:absolute;

    inset:-20%;

    background:
        var(--red);

    transform:
        translateX(-120%)
        rotate(-7deg);

    opacity:0;
}

.black-slice{
    position:absolute;

    inset:-20%;

    background:#000;

    transform:
        translateX(120%)
        rotate(6deg);

    opacity:0;
}

.white-flash{
    position:absolute;

    inset:0;

    background:#fff;

    opacity:0;
}

/* =========================================================
   CREATOR
========================================================= */

body.creator-leave
.transition{
    visibility:visible;
}

body.creator-leave
.background{
    transform:
        scale(1.09)
        translate(-2%,1%);
}

body.creator-leave
.hand-energy{
    animation:
        creatorPower
        .48s ease-out forwards;
}

body.creator-leave
.red-slice{
    animation:
        redCreator
        .45s .27s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

body.creator-leave
.black-slice{
    animation:
        blackCreator
        .42s .39s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

body.creator-leave
.white-flash{
    animation:
        flash
        .23s .25s
        forwards;
}

@keyframes creatorPower{

    50%{
        filter:
            drop-shadow(
                0 0 30px
                var(--yellow)
            );

        transform:
            translate(-50%,-50%)
            scale(3);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(5);
    }

}

@keyframes redCreator{

    to{
        opacity:1;

        transform:
            translateX(-28%)
            rotate(-7deg);
    }

}

@keyframes blackCreator{

    to{
        opacity:1;

        transform:
            translateX(23%)
            rotate(6deg);
    }

}

/* =========================================================
   FEEDBACK
========================================================= */

body.feedback-leave
.transition{
    visibility:visible;
}

body.feedback-leave
.background{
    transform:
        scale(1.12)
        translate(-3%,1%);
}

body.feedback-leave
.hand-energy{
    animation:
        feedbackPower
        .38s
        ease-out
        forwards;
}

body.feedback-leave
.red-slice{
    animation:
        redFeedback
        .40s .18s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

body.feedback-leave
.black-slice{
    animation:
        blackFeedback
        .38s .30s
        cubic-bezier(.75,0,.2,1)
        forwards;
}

body.feedback-leave
.white-flash{
    animation:
        flash
        .2s .17s
        forwards;
}

@keyframes feedbackPower{

    45%{
        filter:
            drop-shadow(
                0 0 35px
                var(--red)
            );

        transform:
            translate(-50%,-50%)
            scale(3.5);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(6);
    }

}

@keyframes redFeedback{

    0%{
        opacity:1;

        transform:
            translateX(120%)
            rotate(-7deg);
    }

    100%{
        opacity:1;

        transform:
            translateX(-25%)
            rotate(-7deg);
    }

}

@keyframes blackFeedback{

    0%{
        opacity:1;

        transform:
            translateX(-120%)
            rotate(6deg);
    }

    100%{
        opacity:1;

        transform:
            translateX(22%)
            rotate(6deg);
    }

}

@keyframes flash{

    0%,
    100%{
        opacity:0;
    }

    45%{
        opacity:.88;
    }

}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){

    .search-area{
        width:57vw;
    }

    .search-mask{
        width:66%;
    }

}

@media(max-width:760px){

    body{
        overflow:hidden;
    }

    .background{
        background-position:
            66% center;

        filter:
            brightness(.72);
    }

    .search-mask{
        left:0;
        top:auto;
        bottom:0;

        width:100%;
        height:38%;

        background:
            rgba(0,0,0,.86);

        clip-path:
            polygon(
                0 10%,
                100% 0,
                100% 100%,
                0 100%
            );
    }

    .search-area{
        left:5%;
        top:auto;
        bottom:5%;

        width:90%;
    }

    .search-form{
        height:55px;
    }

    .engine-section{
        display:block;
    }

    .engine-title{
        display:none;
    }

    .engine-buttons{
        margin-top:13px;
    }

    .engine{
        font-size:10px;
        height:42px;
    }

    .top-nav{
        top:10px;
        right:8px;
    }

    .nav-mask{
        width:60%;
    }

    .hand-energy{
        display:none;
    }

}

/* =========================================================
   POINTER
========================================================= */

@media(pointer:fine){

    body,
    button,
    input,
    a{
        cursor:none;
    }

}

@media(pointer:coarse){

    .cursor{
        display:none;
    }

}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }

}

</style>

</head>


<body>

<div class="stage">

    <!-- BACKGROUND -->

    <div
        class="background"
        id="background">
    </div>


    <!-- MASK ORIGINAL UI -->

    <div class="search-mask"></div>

    <div class="nav-mask"></div>


    <!-- =============================================
         NAV
    ============================================== -->

    <nav class="top-nav">

        <a
            href="feedback.html"
            class="nav-link"
            id="feedbackLink"
        >

            <span class="nav-icon">
                ✉
            </span>

            <span>
                反馈
            </span>

        </a>


        <div class="nav-divider"></div>


        <a
            href="creator.html"
            class="nav-link"
            id="creatorLink"
        >

            <span class="nav-icon">
                ♟
            </span>

            <span>
                创作者信息
            </span>

        </a>

    </nav>


    <!-- =============================================
         REAL SEARCH
    ============================================== -->

    <main class="search-area">

        <form
            class="search-form"
            id="searchForm"
        >

            <input
                class="search-input"
                id="searchInput"
                type="text"
                autocomplete="off"
                placeholder="搜索任何内容..."
            >


            <button
                class="search-button"
                type="submit"
                aria-label="搜索"
            >

                <span class="search-icon"></span>

            </button>

        </form>


        <!-- ENGINE -->

        <div class="engine-section">

            <div class="engine-title">
                快捷搜索：
            </div>


            <div class="engine-buttons">

                <button
                    class="engine active"
                    type="button"
                    data-engine="bing">
                    Bing
                </button>

                <button
                    class="engine"
                    type="button"
                    data-engine="google">
                    Google
                </button>

                <button
                    class="engine"
                    type="button"
                    data-engine="youtube">
                    YouTube
                </button>

                <button
                    class="engine"
                    type="button"
                    data-engine="wikipedia">
                    Wikipedia
                </button>

            </div>

        </div>


        <div class="search-note">
            默认使用 Bing；点击按钮可以切换搜索引擎，也可以直接输入网址访问。
        </div>

    </main>


    <!-- =============================================
         HAND ENERGY
    ============================================== -->

    <div class="hand-energy">

        <div class="ring"></div>

        <div class="ring"></div>

        <div class="energy-dot"></div>

    </div>

</div>


<!-- =============================================
     TRANSITION
============================================== -->

<div class="transition">

    <div class="white-flash"></div>

    <div class="red-slice"></div>

    <div class="black-slice"></div>

</div>


<!-- CURSOR -->

<div
    class="cursor"
    id="cursor">
</div>


<script>

/* =========================================================
   SEARCH
========================================================= */

const searchForm =
    document.getElementById(
        "searchForm"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const engines =
    document.querySelectorAll(
        ".engine"
    );


let currentEngine =
    "bing";


const searchURLs = {

    bing:
        "https://www.bing.com/search?q=",

    google:
        "https://www.google.com/search?q=",

    youtube:
        "https://www.youtube.com/results?search_query=",

    wikipedia:
        "https://zh.wikipedia.org/w/index.php?search="

};


engines.forEach(button=>{

    button.addEventListener(
        "click",
        function(){

            engines.forEach(
                b =>
                    b.classList.remove(
                        "active"
                    )
            );


            this.classList.add(
                "active"
            );


            currentEngine =
                this.dataset.engine;


            searchInput.focus();

        }
    );

});


searchForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        search();

    }
);


function search(){

    const value =
        searchInput.value.trim();


    if(!value){

        searchInput.focus();

        return;

    }


    /* 完整 URL */

    if(
        /^https?:\/\//i.test(value)
    ){

        location.href =
            value;

        return;

    }


    /* example.com */

    if(
        !/\s/.test(value)
        &&
        /^[a-z0-9-]+(\.[a-z0-9-]+)+([/?#].*)?$/i
        .test(value)
    ){

        location.href =
            "https://" + value;

        return;

    }


    location.href =
        searchURLs[currentEngine]
        +
        encodeURIComponent(value);

}


/* =========================================================
   PAGE TRANSITION
========================================================= */

let leaving =
    false;


document
.getElementById(
    "creatorLink"
)
.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        leave(
            this.href,
            "creator"
        );

    }
);


document
.getElementById(
    "feedbackLink"
)
.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        leave(
            this.href,
            "feedback"
        );

    }
);


function leave(
    url,
    type
){

    if(leaving){
        return;
    }

    leaving = true;


    document.body
        .classList
        .add(
            type === "creator"
            ?
            "creator-leave"
            :
            "feedback-leave"
        );


    setTimeout(
        function(){

            location.href =
                url;

        },
        700
    );

}


/* =========================================================
   PARALLAX
========================================================= */

const background =
    document.getElementById(
        "background"
    );


document.addEventListener(
    "mousemove",
    function(event){

        if(leaving){
            return;
        }


        const x =
            event.clientX
            /
            window.innerWidth
            -
            .5;


        const y =
            event.clientY
            /
            window.innerHeight
            -
            .5;


        background.style.transform =
            `
            scale(1.035)
            translate(
                ${x * -5}px,
                ${y * -3}px
            )
            `;

    }
);


/* =========================================================
   CURSOR
========================================================= */

const cursor =
    document.getElementById(
        "cursor"
    );


let mouseX =
    -100;

let mouseY =
    -100;

let cursorX =
    -100;

let cursorY =
    -100;

let lastTrail =
    0;


document.addEventListener(
    "mousemove",
    function(event){

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;


        makeTrail(
            mouseX,
            mouseY
        );

    }
);


function cursorLoop(){

    cursorX +=
        (
            mouseX
            -
            cursorX
        )
        *
        .3;


    cursorY +=
        (
            mouseY
            -
            cursorY
        )
        *
        .3;


    cursor.style.left =
        cursorX + "px";

    cursor.style.top =
        cursorY + "px";


    requestAnimationFrame(
        cursorLoop
    );

}


cursorLoop();


function makeTrail(
    x,
    y
){

    if(
        !matchMedia(
            "(pointer:fine)"
        ).matches
    ){
        return;
    }


    const now =
        performance.now();


    if(
        now
        -
        lastTrail
        <
        45
    ){
        return;
    }


    lastTrail =
        now;


    const particle =
        document.createElement(
            "span"
        );


    particle.className =
        "trail";


    particle.style.left =
        (
            x
            +
            (
                Math.random()
                -
                .5
            )
            *
            10
        )
        +
        "px";


    particle.style.top =
        (
            y
            +
            (
                Math.random()
                -
                .5
            )
            *
            10
        )
        +
        "px";


    document.body.appendChild(
        particle
    );


    setTimeout(
        () =>
            particle.remove(),
        520
    );

}

</script>
