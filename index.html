<!doctype html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FEEDBACK | PHANTOM SEARCH</title>

<style>
:root{
    --red:#ef1023;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffc928;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;

    background:#000;

    color:#fff;

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;
}

/* =====================================================
   BACKGROUND
===================================================== */

.feedback-bg{
    position:fixed;

    inset:-2%;

    background:
        url("assets/feedback-bg.png?v=6")
        center / cover
        no-repeat;

    transform:scale(1.025);
}

.feedback-bg::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.16),
            transparent 58%
        ),
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.2)
        );
}

/* =====================================================
   PAGE ENTER
===================================================== */

.feedback-content{
    opacity:0;

    transform:
        translateX(-25px);

    animation:
        contentEnter
        .58s .1s
        forwards;
}

@keyframes contentEnter{
    to{
        opacity:1;
        transform:none;
    }
}

.entry-shock{
    position:fixed;

    left:82%;
    top:58%;

    z-index:300;

    width:80px;
    height:80px;

    border:
        6px solid
        var(--yellow);

    border-radius:50%;

    pointer-events:none;

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.1);
}

body.from-home
.entry-shock{
    animation:
        entryShock
        .58s ease-out;
}

@keyframes entryShock{
    0%{
        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(11);
    }
}

/* =====================================================
   NAV
===================================================== */

.top-nav{
    position:fixed;

    top:22px;
    right:30px;

    z-index:100;

    display:flex;

    gap:10px;
}

.top-nav a{
    padding:9px 15px;

    color:#050505;
    background:#fff;

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px
        #050505;

    text-decoration:none;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;
    font-weight:900;

    transform:
        skew(-7deg);

    transition:.15s ease;
}

.top-nav a:first-child{
    background:
        var(--yellow);
}

.top-nav a:hover{
    transform:
        skew(-7deg)
        translate(-3px,-3px);
}

/* =====================================================
   LEFT PANEL
===================================================== */

.feedback-panel{
    position:relative;

    z-index:30;

    width:min(690px,45vw);

    margin-left:4.5vw;

    padding-top:4vh;
}

/* =====================================================
   TITLE
===================================================== */

.feedback-title{
    display:inline-block;
}

.feedback-title h1{
    margin:0;

    font-size:
        clamp(
            50px,
            5vw,
            86px
        );

    line-height:.82;

    color:#fff;

    -webkit-text-stroke:
        3px #050505;

    text-shadow:
        7px 7px #050505;

    transform:
        rotate(-2deg);
}

.feedback-title h1 span{
    color:var(--red);
}

.feedback-title .english{
    display:inline-block;

    margin:
        -4px 0 0 110px;

    padding:
        3px 14px;

    color:#050505;

    background:
        var(--yellow);

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px
        #050505;

    font-size:
        clamp(
            18px,
            1.9vw,
            32px
        );

    transform:
        rotate(-3deg);
}

.slogan{
    display:inline-block;

    margin:
        5px 0 12px 80px;

    padding:
        6px 13px;

    color:#050505;

    background:
        var(--yellow);

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;
    font-weight:900;
}

/* =====================================================
   FORM
===================================================== */

.feedback-form{
    position:relative;

    padding:
        16px 20px 18px;

    background:
        rgba(3,3,3,.91);

    border:
        4px solid
        var(--red);

    box-shadow:
        9px 9px
        rgba(0,0,0,.8);

    clip-path:
        polygon(
            1% 0,
            98% 2%,
            100% 95%,
            96% 100%,
            2% 98%,
            0 5%
        );
}

.field{
    margin-bottom:12px;
}

.field-label{
    display:flex;
    align-items:center;

    gap:8px;

    margin-bottom:7px;
}

.cn-label{
    padding:
        4px 10px;

    color:#050505;

    background:#fff;

    border:
        2px solid
        #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:11px;
    font-weight:900;
}

.en-label{
    color:var(--red);

    font-size:10px;
}

/* =====================================================
   TYPES
===================================================== */

.type-options{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;
}

.type-option{
    position:relative;
}

.type-option input{
    position:absolute;

    opacity:0;
}

.type-option label{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:41px;

    color:#fff;

    background:#111;

    border:
        3px solid
        #fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;
    font-weight:900;

    transition:.14s ease;
}

.type-option label:hover{
    border-color:
        var(--yellow);

    transform:
        translateY(-3px);
}

.type-option input:checked
+
label{
    color:#050505;

    background:
        var(--yellow);

    border-color:
        var(--red);

    box-shadow:
        5px 5px
        var(--red);
}

/* =====================================================
   TEXT
===================================================== */

.textarea-wrap{
    position:relative;

    overflow:hidden;
}

textarea{
    display:block;

    width:100%;
    height:103px;

    resize:none;

    padding:
        12px 14px 25px;

    outline:0;

    color:#fff;
    background:#101010;

    border:
        3px solid #fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;

    line-height:1.6;

    transition:.18s ease;
}

textarea:focus{
    border-color:
        var(--yellow);

    box-shadow:
        0 0 0 3px
        var(--red);
}

.char-count{
    position:absolute;

    right:9px;
    bottom:6px;

    color:
        rgba(255,255,255,.58);

    font-family:Arial,sans-serif;
    font-size:10px;
}

/* =====================================================
   RATING
===================================================== */

.rating-row{
    display:flex;
    align-items:center;

    gap:5px;

    min-height:40px;
}

.star{
    padding:0;

    border:0;

    background:none;

    color:#fff;

    font-size:34px;

    line-height:1;

    -webkit-text-stroke:
        2px #050505;

    text-shadow:
        2px 2px #050505;

    transition:.14s ease;
}

.star:hover{
    transform:
        scale(1.2)
        rotate(-8deg);
}

.star.active{
    color:var(--yellow);

    text-shadow:
        0 0 12px
        var(--yellow);
}

.rating-text{
    margin-left:8px;

    color:
        rgba(255,255,255,.65);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:10px;
}

/* =====================================================
   CONTACT
===================================================== */

.contact-input{
    width:100%;
    height:39px;

    padding:
        0 12px;

    outline:0;

    color:#fff;
    background:#101010;

    border:
        3px solid #fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:11px;
}

.contact-input:focus{
    border-color:
        var(--yellow);

    box-shadow:
        0 0 0 3px
        var(--red);
}

/* =====================================================
   SUBMIT
===================================================== */

.submit-wrap{
    display:flex;

    justify-content:center;

    margin-top:14px;
}

.submit-button{
    min-width:280px;

    padding:
        11px 34px;

    color:#050505;

    background:
        var(--yellow);

    border:
        4px solid
        #050505;

    box-shadow:
        8px 8px
        var(--red),
        12px 12px
        #050505;

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;

    font-size:22px;

    transform:
        skew(-8deg);

    transition:.14s ease;
}

.submit-button span{
    display:inline-block;

    transform:
        skew(8deg);
}

.submit-button:hover{
    transform:
        skew(-8deg)
        translate(-4px,-4px);
}

.submit-button:disabled{
    opacity:.6;
}

.form-status{
    min-height:17px;

    margin-top:12px;

    text-align:center;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:10px;
    font-weight:900;
}

.form-status.error{
    color:#ff5362;
}

.form-status.sending{
    color:var(--yellow);
}

/* =====================================================
   SUCCESS
===================================================== */

.success-screen{
    position:fixed;
    inset:0;

    z-index:7000;

    display:grid;
    place-items:center;

    visibility:hidden;
    opacity:0;

    background:
        rgba(0,0,0,.75);

    transition:.22s ease;
}

.success-screen.show{
    visibility:visible;
    opacity:1;
}

.success-card{
    padding:
        48px 65px;

    text-align:center;

    background:
        var(--red);

    border:
        6px solid
        #050505;

    box-shadow:
        15px 15px
        var(--yellow),
        22px 22px
        #050505;

    transform:
        rotate(-3deg)
        scale(.72);
}

.success-screen.show
.success-card{
    animation:
        successPop
        .5s
        cubic-bezier(.2,1.45,.3,1)
        forwards;
}

@keyframes successPop{
    to{
        transform:
            rotate(-3deg)
            scale(1);
    }
}

.success-card h2{
    margin:0;

    font-size:
        clamp(
            44px,
            5vw,
            85px
        );

    line-height:.82;

    color:#fff;

    -webkit-text-stroke:
        3px #050505;

    text-shadow:
        7px 7px #050505;
}

.success-card h2 span{
    color:var(--yellow);
}

.success-card p{
    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;
    font-weight:900;
}

.success-close{
    margin-top:15px;

    padding:
        9px 22px;

    color:#050505;

    background:
        var(--yellow);

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-weight:900;
}

/* =====================================================
   EXIT
===================================================== */

.exit{
    position:fixed;
    inset:0;

    z-index:5000;

    pointer-events:none;

    visibility:hidden;
}

.exit::before{
    content:"";

    position:absolute;
    inset:-20%;

    background:var(--red);

    transform:
        translateX(-130%)
        rotate(-7deg);
}

.exit::after{
    content:"";

    position:absolute;
    inset:-20%;

    background:#000;

    transform:
        translateX(130%)
        rotate(6deg);
}

body.leaving .exit{
    visibility:visible;
}

body.leaving .exit::before{
    animation:
        exitA
        .4s forwards;
}

body.leaving .exit::after{
    animation:
        exitB
        .4s .1s forwards;
}

@keyframes exitA{
    to{
        transform:
            translateX(-20%)
            rotate(-7deg);
    }
}

@keyframes exitB{
    to{
        transform:
            translateX(20%)
            rotate(6deg);
    }
}

/* =====================================================
   CURSOR
===================================================== */

.cursor{
    position:fixed;

    left:-100px;
    top:-100px;

    width:28px;
    height:28px;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}

.cursor::before{
    content:"";

    position:absolute;
    inset:2px;

    border:
        2px solid
        var(--yellow);

    border-radius:50%;

    box-shadow:
        0 0 8px
        var(--yellow);
}

.cursor::after{
    content:"✦";

    position:absolute;
    inset:0;

    display:grid;
    place-items:center;

    color:var(--red);

    font-size:14px;
}

.trail{
    position:fixed;

    width:6px;
    height:6px;

    z-index:9998;

    pointer-events:none;

    background:
        var(--yellow);

    animation:
        trailFade
        .5s forwards;
}

@keyframes trailFade{
    to{
        opacity:0;

        transform:
            rotate(150deg)
            scale(.1);
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    body{
        overflow:auto;
    }

    .feedback-bg{
        background-position:
            66% center;

        filter:
            brightness(.55);
    }

    .feedback-panel{
        width:90%;

        margin:
            95px auto 50px;

        padding:0;
    }

    .type-options{
        grid-template-columns:1fr;
    }

    .top-nav{
        top:10px;
        right:8px;
    }

    .success-card{
        width:86%;
        padding:
            40px 20px;
    }
}

@media(pointer:fine){
    body,input,textarea,button,a,label{
        cursor:none;
    }
}

@media(pointer:coarse){
    .cursor{
        display:none;
    }
}

</style>
</head>

<body>


<div class="feedback-bg"></div>

<div class="entry-shock"></div>


<div class="feedback-content">

    <nav class="top-nav">

        <a
            href="index.html"
            data-page>
            返回搜索
        </a>

        <a
            href="creator.html"
            data-page>
            创作者信息
        </a>

    </nav>


    <main class="feedback-panel">

        <header class="feedback-title">

            <h1>
                意见<span>反馈</span>
            </h1>

            <div class="english">
                FEEDBACK
            </div>

        </header>


        <div class="slogan">
            你的反馈，是我们的行动力！
        </div>


        <form
            class="feedback-form"
            id="feedbackForm">


            <div class="field">

                <div class="field-label">

                    <span class="cn-label">
                        反馈类型
                    </span>

                    <span class="en-label">
                        TYPE
                    </span>

                </div>


                <div class="type-options">


                    <div class="type-option">

                        <input
                            id="feature"
                            type="radio"
                            name="feedback_type"
                            value="功能建议"
                            checked>

                        <label for="feature">
                            ✦ 功能建议
                        </label>

                    </div>


                    <div class="type-option">

                        <input
                            id="bug"
                            type="radio"
                            name="feedback_type"
                            value="问题反馈">

                        <label for="bug">
                            ⚠ 问题反馈
                        </label>

                    </div>


                    <div class="type-option">

                        <input
                            id="other"
                            type="radio"
                            name="feedback_type"
                            value="其他">

                        <label for="other">
                            ◆ 其他
                        </label>

                    </div>


                </div>

            </div>


            <div class="field">

                <div class="field-label">

                    <span class="cn-label">
                        详细描述
                    </span>

                    <span class="en-label">
                        DETAIL
                    </span>

                </div>


                <div class="textarea-wrap">

                    <textarea
                        id="message"
                        name="message"
                        maxlength="500"
                        required
                        placeholder="告诉我你对 PHANTOM SEARCH 的想法……"></textarea>


                    <div class="char-count">

                        <span id="charCount">
                            0
                        </span>

                        / 500

                    </div>

                </div>

            </div>


            <div class="field">

                <div class="field-label">

                    <span class="cn-label">
                        满意度
                    </span>

                    <span class="en-label">
                        RATING
                    </span>

                </div>


                <div class="rating-row">

                    <button
                        class="star"
                        type="button"
                        data-value="1">
                        ★
                    </button>

                    <button
                        class="star"
                        type="button"
                        data-value="2">
                        ★
                    </button>

                    <button
                        class="star"
                        type="button"
                        data-value="3">
                        ★
                    </button>

                    <button
                        class="star"
                        type="button"
                        data-value="4">
                        ★
                    </button>

                    <button
                        class="star"
                        type="button"
                        data-value="5">
                        ★
                    </button>


                    <span
                        class="rating-text"
                        id="ratingText">

                        点击星星评分

                    </span>


                    <input
                        type="hidden"
                        name="rating"
                        id="ratingInput">

                </div>

            </div>


            <div class="field">

                <div class="field-label">

                    <span class="cn-label">
                        联系方式
                    </span>

                    <span class="en-label">
                        CONTACT / OPTIONAL
                    </span>

                </div>


                <input
                    class="contact-input"
                    type="text"
                    name="contact"
                    maxlength="120"
                    placeholder="邮箱 / 社交账号（可选）">

            </div>


            <div class="submit-wrap">

                <button
                    class="submit-button"
                    id="submitButton"
                    type="submit">

                    <span>
                        提交反馈 ➤
                    </span>

                </button>

            </div>


            <div
                class="form-status"
                id="formStatus">
            </div>

        </form>

    </main>

</div>


<div
    class="success-screen"
    id="successScreen">

    <div class="success-card">

        <h2>

            THANKS
            <br>

            <span>
                FOR YOUR
            </span>

            <br>

            FEEDBACK!

        </h2>


        <p>
            反馈已成功送达。
            <br>
            感谢你帮助 PHANTOM SEARCH 变得更好。
        </p>


        <button
            class="success-close"
            id="successClose"
            type="button">

            RETURN ↩

        </button>

    </div>

</div>


<div class="exit"></div>


<div
    class="cursor"
    id="cursor">
</div>


<script>

/* =====================================================
   ENTRY
===================================================== */

if(
    sessionStorage.getItem(
        "phantomTransition"
    )
    ===
    "feedback"
){

    document.body.classList.add(
        "from-home"
    );

    sessionStorage.removeItem(
        "phantomTransition"
    );
}


/* =====================================================
   CHAR COUNT
===================================================== */

const message =
    document.getElementById(
        "message"
    );

const charCount =
    document.getElementById(
        "charCount"
    );


message.addEventListener(
    "input",
    ()=>{

        charCount.textContent =
            message.value.length;

    }
);


/* =====================================================
   RATING
===================================================== */

const stars =
    document.querySelectorAll(
        ".star"
    );

const ratingInput =
    document.getElementById(
        "ratingInput"
    );

const ratingText =
    document.getElementById(
        "ratingText"
    );

let rating=0;


stars.forEach(star=>{

    star.addEventListener(
        "click",
        ()=>{

            rating =
                Number(
                    star.dataset.value
                );

            ratingInput.value =
                rating;

            updateStars();

        }
    );

});


function updateStars(){

    stars.forEach(star=>{

        star.classList.toggle(
            "active",
            Number(
                star.dataset.value
            )
            <=
            rating
        );

    });


    ratingText.textContent =
        rating
        ?
        rating + " / 5"
        :
        "点击星星评分";

}


/* =====================================================
   FORM SUBMIT
===================================================== */

const form =
    document.getElementById(
        "feedbackForm"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const formStatus =
    document.getElementById(
        "formStatus"
    );

const successScreen =
    document.getElementById(
        "successScreen"
    );


form.addEventListener(
    "submit",
    async event=>{

        event.preventDefault();


        if(
            message.value
            .trim()
            .length < 3
        ){

            error(
                "请至少写下几个字的反馈内容。"
            );

            return;
        }


        if(
            rating === 0
        ){

            error(
                "请先选择 1–5 星满意度。"
            );

            return;
        }


        submitButton.disabled =
            true;


        submitButton
            .querySelector("span")
            .textContent =
            "正在发送……";


        formStatus.className =
            "form-status sending";


        formStatus.textContent =
            "正在发送反馈……";


        const data =
            new FormData(form);


        data.append(
            "_subject",
            "PHANTOM SEARCH - New Feedback"
        );


        data.append(
            "_template",
            "table"
        );


        try{

            const response =
                await fetch(
                    "https://formsubmit.co/ajax/Henrychen2008@hotmail.com",
                    {
                        method:"POST",

                        headers:{
                            "Accept":
                            "application/json"
                        },

                        body:data
                    }
                );


            if(
                !response.ok
            ){

                throw new Error();

            }


            const result =
                await response.json();


            if(
                result.success === true
                ||
                result.success === "true"
            ){

                success();

            }else{

                throw new Error();

            }

        }
        catch(err){

            console.error(err);


            error(
                "暂时没有发送成功，请稍后再试。"
            );


            resetButton();

        }

    }
);


function success(){

    successScreen
        .classList
        .add("show");


    form.reset();


    rating=0;

    ratingInput.value="";

    updateStars();


    charCount.textContent="0";


    formStatus.textContent="";

    formStatus.className=
        "form-status";


    resetButton();

}


function error(text){

    formStatus.className =
        "form-status error";

    formStatus.textContent =
        text;

}


function resetButton(){

    submitButton.disabled=
        false;


    submitButton
        .querySelector("span")
        .textContent =
        "提交反馈 ➤";

}


/* SUCCESS CLOSE */

document
.getElementById(
    "successClose"
)
.addEventListener(
    "click",
    ()=>{

        successScreen
            .classList
            .remove("show");

    }
);


/* =====================================================
   PAGE EXIT
===================================================== */

let leaving=false;


document
.querySelectorAll(
    "[data-page]"
)
.forEach(link=>{

    link.addEventListener(
        "click",
        event=>{

            event.preventDefault();

            if(leaving)return;

            leaving=true;


            document.body
                .classList
                .add("leaving");


            const target=
                link.href;


            setTimeout(
                ()=>{

                    location.href=
                        target;

                },
                470
            );

        }
    );

});


/* =====================================================
   CURSOR
===================================================== */

const cursor =
    document.getElementById(
        "cursor"
    );

let mx=-100;
let my=-100;
let cx=-100;
let cy=-100;
let last=0;


document.addEventListener(
    "mousemove",
    event=>{

        mx=event.clientX;
        my=event.clientY;


        const now=
            performance.now();


        if(
            now-last > 48
            &&
            matchMedia(
                "(pointer:fine)"
            ).matches
        ){

            last=now;


            const p=
                document.createElement(
                    "span"
                );


            p.className=
                "trail";


            p.style.left=
                mx+"px";


            p.style.top=
                my+"px";


            document.body.appendChild(
                p
            );


            setTimeout(
                ()=>p.remove(),
                520
            );

        }

    }
);


function cursorLoop(){

    cx+=(mx-cx)*.3;
    cy+=(my-cy)*.3;


    cursor.style.left=
        cx+"px";


    cursor.style.top=
        cy+"px";


    requestAnimationFrame(
        cursorLoop
    );

}


cursorLoop();

</script>
