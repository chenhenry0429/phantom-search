<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHANTOM SEARCH</title>

<style>
:root{
    --red:#ef1023;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffc928;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;
}

.stage{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =====================================================
   HOME BACKGROUND
===================================================== */

.background{
    position:absolute;
    inset:-2%;

    background:
        url("assets/home-bg.png?v=6")
        center 48% / cover
        no-repeat;

    transform:scale(1.025);

    transition:
        transform .6s cubic-bezier(.2,.8,.2,1),
        filter .4s ease;
}

.background::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at 55% 48%,
            transparent 42%,
            rgba(0,0,0,.12) 74%,
            rgba(0,0,0,.3) 100%
        );

    pointer-events:none;
}

/* =====================================================
   NAV
===================================================== */

.top-nav{
    position:absolute;
    top:21px;
    right:30px;
    z-index:40;

    display:flex;
    align-items:center;
    gap:6px;

    padding:5px 9px;

    background:rgba(0,0,0,.63);
    backdrop-filter:blur(3px);

    clip-path:
        polygon(
            5% 0,
            100% 0,
            97% 100%,
            0 85%
        );
}

.nav-link{
    position:relative;

    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 13px;

    color:#fff;
    text-decoration:none;

    font-family:"Microsoft YaHei",sans-serif;
    font-size:14px;
    font-weight:900;

    transition:.16s ease;
}

.nav-link:hover{
    color:var(--yellow);
    transform:translateY(-3px);
}

.nav-link::after{
    content:"";

    position:absolute;
    left:10px;
    right:10px;
    bottom:2px;

    height:3px;

    background:var(--red);

    transform:scaleX(0);
    transform-origin:left;

    transition:.17s ease;
}

.nav-link:hover::after{
    transform:scaleX(1);
}

.nav-icon{
    color:var(--red);
    font-size:17px;
}

.nav-divider{
    width:1px;
    height:26px;

    background:rgba(255,255,255,.4);
}

/* =====================================================
   SEARCH AREA
===================================================== */

.search-area{
    position:absolute;

    left:5.4%;
    top:54%;

    width:min(720px,47vw);

    z-index:25;
}

.search-form{
    position:relative;

    display:flex;

    width:100%;
    height:62px;

    background:#fff;

    border:4px solid #050505;

    box-shadow:
        0 0 0 2px #fff,
        8px 8px 0 rgba(0,0,0,.82);

    clip-path:
        polygon(
            1% 4%,
            100% 0,
            96% 95%,
            0 100%
        );

    transform:rotate(-.5deg);

    transition:
        transform .17s ease,
        filter .17s ease;
}

.search-form:focus-within{
    transform:
        rotate(-.5deg)
        translateY(-3px);

    filter:
        drop-shadow(
            0 0 9px
            rgba(255,230,0,.65)
        );
}

/* scan light */

.search-form::after{
    content:"";

    position:absolute;

    top:0;
    left:-40%;

    width:24%;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,230,0,.15),
            rgba(255,255,255,.7),
            transparent
        );

    transform:skewX(-20deg);
    opacity:0;
}

.search-form:focus-within::after{
    animation:searchScan .75s ease-out;
}

@keyframes searchScan{
    0%{
        left:-40%;
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        left:120%;
        opacity:0;
    }
}

.search-input{
    flex:1;
    min-width:0;

    border:0;
    outline:0;

    padding:0 25px;

    background:#fff;
    color:#181818;

    font-family:"Microsoft YaHei",sans-serif;
    font-size:16px;
    font-weight:700;
}

.search-input::placeholder{
    color:#999;
}

.search-button{
    position:relative;

    width:100px;

    border:0;

    color:#fff;
    background:var(--red);

    cursor:pointer;

    clip-path:
        polygon(
            20% 0,
            100% 0,
            100% 100%,
            0 100%
        );

    transition:.15s ease;
}

.search-button:hover{
    color:#050505;
    background:var(--yellow);
}

.search-icon{
    position:absolute;

    left:56%;
    top:47%;

    width:24px;
    height:24px;

    border:4px solid currentColor;
    border-radius:50%;

    transform:translate(-50%,-50%);
}

.search-icon::after{
    content:"";

    position:absolute;

    right:-9px;
    bottom:-5px;

    width:12px;
    height:4px;

    border-radius:3px;

    background:currentColor;

    transform:rotate(45deg);
}

/* =====================================================
   ENGINES
===================================================== */

.engine-section{
    display:flex;
    align-items:center;

    gap:15px;

    margin-top:22px;
}

.engine-title{
    flex:none;

    font-family:"Microsoft YaHei",sans-serif;
    font-size:13px;
    font-weight:900;

    text-shadow:2px 2px #000;
}

.engine-buttons{
    flex:1;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:9px;
}

.engine{
    height:46px;

    border:2px solid rgba(255,255,255,.8);

    color:#fff;
    background:rgba(5,5,5,.92);

    box-shadow:4px 4px 0 #000;

    font-family:Arial,"Microsoft YaHei",sans-serif;
    font-size:12px;
    font-weight:800;

    cursor:pointer;

    transition:.14s ease;
}

.engine:hover{
    border-color:var(--yellow);

    transform:translateY(-3px);
}

.engine.active{
    color:#050505;

    background:var(--yellow);

    border-color:#050505;

    box-shadow:
        5px 5px 0
        var(--red);
}

.search-note{
    margin:16px 0 0 12px;

    color:rgba(255,255,255,.67);

    font-family:"Microsoft YaHei",sans-serif;
    font-size:11px;

    text-shadow:2px 2px #000;
}

/* =====================================================
   HAND ENERGY
===================================================== */

.hand-energy{
    position:absolute;

    left:84.2%;
    top:60.8%;

    width:70px;
    height:70px;

    z-index:16;

    pointer-events:none;

    opacity:.42;

    transform:translate(-50%,-50%);
}

.energy-ring{
    position:absolute;
    inset:0;

    border:
        1.5px solid
        rgba(255,210,40,.48);

    border-radius:50%;

    animation:
        energyIdle
        3s ease-in-out infinite;
}

.energy-ring:nth-child(2){
    inset:16px;
    animation-delay:-.8s;
}

.energy-core{
    position:absolute;

    left:50%;
    top:50%;

    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--yellow);

    box-shadow:
        0 0 10px var(--yellow),
        0 0 18px var(--red);

    transform:translate(-50%,-50%);
}

@keyframes energyIdle{
    0%,100%{
        opacity:.1;
        transform:scale(.65);
    }

    50%{
        opacity:.5;
        transform:
            scale(1.08)
            rotate(90deg);
    }
}

/* =====================================================
   TRANSITION SYSTEM
===================================================== */

.transition{
    position:fixed;

    inset:0;

    z-index:5000;

    visibility:hidden;
    pointer-events:none;

    overflow:hidden;

    background:#000;
}

.target{
    position:absolute;
    inset:-2%;

    opacity:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    transform:scale(1.1);
}

/* final page imagery */

.creator-target{
    background-image:
        url("assets/creator-bg.png?v=6");

    clip-path:
        circle(0% at 84% 61%);
}

.feedback-target{
    background-image:
        url("assets/feedback-bg.png?v=6");

    clip-path:
        circle(0% at 84% 61%);
}

/* =====================================================
   TAROT
===================================================== */

.transition-tarot{
    position:absolute;

    left:84%;
    top:61%;

    width:72px;
    aspect-ratio:2/3;

    z-index:20;

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.2)
        rotate(-25deg);

    background:
        radial-gradient(
            circle at center,
            var(--gold) 0 4%,
            transparent 5%
        ),
        conic-gradient(
            #050505,
            #42070c,
            #050505,
            #310609,
            #050505
        );

    border:4px solid var(--gold);

    box-shadow:
        0 0 0 3px #000,
        0 0 25px rgba(255,202,40,.65);
}

.transition-tarot::before{
    content:"✦";

    position:absolute;
    inset:0;

    display:grid;
    place-items:center;

    color:var(--gold);

    font-size:34px;

    text-shadow:
        0 0 10px var(--gold);
}

.transition-tarot::after{
    content:"";

    position:absolute;
    inset:8px;

    border:
        1px solid
        rgba(255,202,40,.7);
}

/* =====================================================
   SHOCK WAVE
===================================================== */

.transition-shock{
    position:absolute;

    left:84%;
    top:61%;

    width:60px;
    height:60px;

    z-index:20;

    border:
        8px solid
        var(--yellow);

    border-radius:50%;

    opacity:0;

    box-shadow:
        0 0 0 12px
        rgba(239,16,35,.85),
        0 0 50px
        var(--yellow);

    transform:
        translate(-50%,-50%)
        scale(.1);
}

.transition-flash{
    position:absolute;
    inset:0;

    z-index:30;

    background:#fff;

    opacity:0;
}

/* =====================================================
   CREATOR TRANSITION
===================================================== */

body.to-creator .transition{
    visibility:visible;
}

body.to-creator .background{
    animation:
        homeCreator
        1.15s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

body.to-creator .creator-target{
    animation:
        creatorReveal
        1.08s .14s
        cubic-bezier(.65,0,.2,1)
        forwards;
}

body.to-creator .transition-tarot{
    animation:
        tarotMove
        1.05s .08s
        cubic-bezier(.2,.85,.2,1)
        forwards;
}

body.to-creator .transition-flash{
    animation:
        flashFX
        .18s .78s
        ease-out forwards;
}

@keyframes homeCreator{
    0%{
        transform:scale(1.025);
    }

    55%{
        transform:
            scale(1.065)
            translate(-1.8%,.5%);
    }

    100%{
        transform:
            scale(1.1)
            translate(-3%,1%);
    }
}

@keyframes creatorReveal{
    0%{
        opacity:0;

        clip-path:
            circle(
                0% at 84% 61%
            );

        transform:scale(1.12);
    }

    28%{
        opacity:.45;
    }

    72%{
        opacity:1;

        clip-path:
            circle(
                90% at 84% 61%
            );
    }

    100%{
        opacity:1;

        clip-path:
            circle(
                170% at 84% 61%
            );

        transform:scale(1);
    }
}

@keyframes tarotMove{
    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(-25deg);
    }

    18%{
        opacity:1;

        transform:
            translate(-50%,-65%)
            scale(.9)
            rotate(10deg);
    }

    52%{
        opacity:1;

        left:69%;
        top:47%;

        transform:
            translate(-50%,-50%)
            scale(1.6)
            rotate(180deg);
    }

    76%{
        opacity:1;

        left:57%;
        top:50%;

        transform:
            translate(-50%,-50%)
            scale(3)
            rotate(350deg);
    }

    100%{
        opacity:0;

        left:50%;
        top:50%;

        transform:
            translate(-50%,-50%)
            scale(9)
            rotate(375deg);
    }
}

/* =====================================================
   FEEDBACK TRANSITION
===================================================== */

body.to-feedback .transition{
    visibility:visible;
}

body.to-feedback .background{
    animation:
        homeFeedback
        .95s
        cubic-bezier(.2,.85,.2,1)
        forwards;
}

body.to-feedback .feedback-target{
    animation:
        feedbackReveal
        .92s .08s
        cubic-bezier(.65,0,.2,1)
        forwards;
}

body.to-feedback .transition-shock{
    animation:
        shockMove
        .55s .05s
        ease-out
        forwards;
}

body.to-feedback .transition-flash{
    animation:
        flashFX
        .16s .38s
        ease-out forwards;
}

@keyframes homeFeedback{
    0%{
        transform:scale(1.025);
    }

    50%{
        transform:
            scale(1.09)
            translate(-2%,1%);
    }

    100%{
        transform:
            scale(1.14)
            translate(-4%,1.5%);
    }
}

@keyframes feedbackReveal{
    0%{
        opacity:0;

        clip-path:
            circle(
                0% at 84% 61%
            );

        transform:scale(1.12);
    }

    30%{
        opacity:.45;
    }

    70%{
        opacity:1;

        clip-path:
            circle(
                95% at 84% 61%
            );
    }

    100%{
        opacity:1;

        clip-path:
            circle(
                170% at 84% 61%
            );

        transform:scale(1);
    }
}

@keyframes shockMove{
    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    18%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(12);
    }
}

@keyframes flashFX{
    0%,100%{
        opacity:0;
    }

    48%{
        opacity:.8;
    }
}

/* =====================================================
   CURSOR
===================================================== */

.cursor{
    position:fixed;

    left:-100px;
    top:-100px;

    width:28px;
    height:28px;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}

.cursor::before{
    content:"";

    position:absolute;
    inset:2px;

    border:
        2px solid
        var(--yellow);

    border-radius:50%;

    box-shadow:
        0 0 8px
        var(--yellow);
}

.cursor::after{
    content:"✦";

    position:absolute;
    inset:0;

    display:grid;
    place-items:center;

    color:var(--red);

    font-size:14px;
}

.trail{
    position:fixed;

    width:6px;
    height:6px;

    z-index:9998;

    pointer-events:none;

    background:var(--yellow);

    clip-path:
        polygon(
            50% 0,
            65% 35%,
            100% 50%,
            65% 65%,
            50% 100%,
            35% 65%,
            0 50%,
            35% 35%
        );

    animation:
        trailFade
        .5s forwards;
}

.trail.red{
    background:var(--red);
}

@keyframes trailFade{
    to{
        opacity:0;

        transform:
            rotate(150deg)
            scale(.1);
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .background{
        background-position:
            65% center;

        filter:brightness(.72);
    }

    .search-area{
        left:5%;
        top:auto;
        bottom:6%;

        width:90%;

        padding:13px;

        background:
            rgba(0,0,0,.72);

        border-left:
            5px solid
            var(--red);
    }

    .search-form{
        height:55px;
    }

    .engine-section{
        display:block;

        margin-top:14px;
    }

    .engine-title{
        display:none;
    }

    .engine-buttons{
        gap:6px;
    }

    .engine{
        height:42px;
        font-size:10px;
    }

    .search-note{
        display:none;
    }

    .top-nav{
        top:10px;
        right:8px;
    }

    .nav-link{
        padding:7px 9px;
        font-size:11px;
    }

    .hand-energy{
        display:none;
    }
}

@media(pointer:fine){
    body,input,button,a{
        cursor:none;
    }
}

@media(pointer:coarse){
    .cursor{
        display:none;
    }
}

</style>
</head>

<body>

<div class="stage">

    <div
        class="background"
        id="background">
    </div>

    <nav class="top-nav">

        <a
            href="feedback.html"
            class="nav-link"
            id="feedbackLink">

            <span class="nav-icon">✉</span>
            <span>反馈</span>

        </a>

        <div class="nav-divider"></div>

        <a
            href="creator.html"
            class="nav-link"
            id="creatorLink">

            <span class="nav-icon">♟</span>
            <span>创作者信息</span>

        </a>

    </nav>


    <main class="search-area">

        <form
            class="search-form"
            id="searchForm">

            <input
                class="search-input"
                id="searchInput"
                type="text"
                autocomplete="off"
                placeholder="搜索任何内容..."
            >

            <button
                class="search-button"
                type="submit"
                aria-label="搜索">

                <span class="search-icon"></span>

            </button>

        </form>


        <div class="engine-section">

            <span class="engine-title">
                快捷搜索：
            </span>

            <div class="engine-buttons">

                <button
                    class="engine active"
                    type="button"
                    data-engine="bing">
                    Bing
                </button>

                <button
                    class="engine"
                    type="button"
                    data-engine="google">
                    Google
                </button>

                <button
                    class="engine"
                    type="button"
                    data-engine="youtube">
                    YouTube
                </button>

                <button
                    class="engine"
                    type="button"
                    data-engine="wikipedia">
                    Wikipedia
                </button>

            </div>

        </div>

        <div class="search-note">
            默认使用 Bing；也可以切换搜索引擎或直接输入网址。
        </div>

    </main>


    <div class="hand-energy">
        <div class="energy-ring"></div>
        <div class="energy-ring"></div>
        <div class="energy-core"></div>
    </div>

</div>


<div class="transition">

    <div class="target creator-target"></div>

    <div class="target feedback-target"></div>

    <div class="transition-tarot"></div>

    <div class="transition-shock"></div>

    <div class="transition-flash"></div>

</div>


<div
    class="cursor"
    id="cursor">
</div>


<script>

/* =====================================================
   SEARCH
===================================================== */

const searchForm =
    document.getElementById("searchForm");

const searchInput =
    document.getElementById("searchInput");

const engineButtons =
    document.querySelectorAll(".engine");

let currentEngine =
    "bing";

const engines = {

    bing:
        "https://www.bing.com/search?q=",

    google:
        "https://www.google.com/search?q=",

    youtube:
        "https://www.youtube.com/results?search_query=",

    wikipedia:
        "https://zh.wikipedia.org/w/index.php?search="
};


engineButtons.forEach(button=>{

    button.addEventListener(
        "click",
        function(){

            engineButtons.forEach(
                item =>
                    item.classList.remove(
                        "active"
                    )
            );

            this.classList.add(
                "active"
            );

            currentEngine =
                this.dataset.engine;

            searchInput.focus();

        }
    );

});


searchForm.addEventListener(
    "submit",
    event=>{

        event.preventDefault();

        const value =
            searchInput.value.trim();

        if(!value){

            searchInput.focus();

            return;
        }

        if(
            /^https?:\/\//i
            .test(value)
        ){

            location.href =
                value;

            return;
        }

        if(
            !/\s/.test(value)
            &&
            /^[a-z0-9-]+(\.[a-z0-9-]+)+([/?#].*)?$/i
            .test(value)
        ){

            location.href =
                "https://" + value;

            return;
        }

        location.href =
            engines[currentEngine]
            +
            encodeURIComponent(value);

    }
);


/* =====================================================
   PAGE TRANSITION
===================================================== */

let leaving =
    false;


document
.getElementById("creatorLink")
.addEventListener(
    "click",
    event=>{

        event.preventDefault();

        if(leaving)return;

        leaving = true;

        sessionStorage.setItem(
            "phantomTransition",
            "creator"
        );

        document.body
            .classList
            .add("to-creator");

        setTimeout(()=>{

            location.href =
                "creator.html";

        },1180);

    }
);


document
.getElementById("feedbackLink")
.addEventListener(
    "click",
    event=>{

        event.preventDefault();

        if(leaving)return;

        leaving = true;

        sessionStorage.setItem(
            "phantomTransition",
            "feedback"
        );

        document.body
            .classList
            .add("to-feedback");

        setTimeout(()=>{

            location.href =
                "feedback.html";

        },1010);

    }
);


/* =====================================================
   PARALLAX
===================================================== */

const background =
    document.getElementById("background");


document.addEventListener(
    "mousemove",
    event=>{

        if(leaving)return;

        const x =
            event.clientX /
            innerWidth - .5;

        const y =
            event.clientY /
            innerHeight - .5;

        background.style.transform =
            `
            scale(1.03)
            translate(
                ${x * -5}px,
                ${y * -3}px
            )
            `;

    }
);


/* =====================================================
   CURSOR
===================================================== */

const cursor =
    document.getElementById("cursor");

let mx=-100;
let my=-100;
let cx=-100;
let cy=-100;
let lastTrail=0;


document.addEventListener(
    "mousemove",
    event=>{

        mx=event.clientX;
        my=event.clientY;

        trail(
            mx,
            my
        );

    }
);


function cursorLoop(){

    cx+=(mx-cx)*.3;
    cy+=(my-cy)*.3;

    cursor.style.left=
        cx+"px";

    cursor.style.top=
        cy+"px";

    requestAnimationFrame(
        cursorLoop
    );
}

cursorLoop();


function trail(x,y){

    if(
        !matchMedia(
            "(pointer:fine)"
        ).matches
    )return;

    const now =
        performance.now();

    if(
        now-lastTrail < 45
    )return;

    lastTrail=now;

    const p =
        document.createElement("span");

    p.className =
        Math.random()>.58
        ?
        "trail red"
        :
        "trail";

    p.style.left =
        x +
        (Math.random()-.5)*10 +
        "px";

    p.style.top =
        y +
        (Math.random()-.5)*10 +
        "px";

    document.body.appendChild(p);

    setTimeout(
        ()=>p.remove(),
        520
    );
}

</script>
