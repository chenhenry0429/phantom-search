<!doctype html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PHANTOM SEARCH</title>

<style>

/* =========================================================
   COLORS
========================================================= */

:root{
    --red:#ef1023;
    --red-dark:#8b0711;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffca28;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;
}


/* =========================================================
   ACCESSIBILITY
========================================================= */

.sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}


/* =========================================================
   OUTER SCREEN
========================================================= */

.screen{
    position:fixed;
    inset:0;

    display:grid;
    place-items:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #181818 0,
            #050505 55%,
            #000 100%
        );
}


/* =========================================================
   3:2 ART STAGE

   背景图本身是 1536 × 1024（3:2）
   保持这个比例可以让所有按钮位置与背景稳定对应
========================================================= */

.stage{
    position:relative;

    width:min(100vw,150vh);
    aspect-ratio:3 / 2;

    overflow:hidden;

    background:#000;

    box-shadow:
        0 0 70px rgba(239,16,35,.18);
}


/* =========================================================
   BACKGROUND ART
========================================================= */

.art{
    position:absolute;
    inset:-1.5%;

    background-image:
        url("assets/home-bg.png");

    background-size:
        100% 100%;

    background-position:
        center;

    background-repeat:
        no-repeat;

    transform:
        scale(1.03);

    transition:
        transform .7s
        cubic-bezier(.2,.75,.15,1),
        filter .45s ease;
}


/* 轻微暗角 */

.art::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.18) 100%
        );
}


/* =========================================================
   TOP NAVIGATION
========================================================= */

.top-nav{
    position:absolute;

    top:2.1%;
    right:2.6%;

    z-index:30;

    display:flex;
    align-items:center;

    gap:8px;

    background:
        rgba(0,0,0,.78);

    padding:
        .6% 1.1%;

    border-bottom:
        2px solid rgba(255,255,255,.12);
}


.nav-divider{
    width:1px;
    height:24px;

    margin:0 8px;

    background:
        rgba(255,255,255,.55);
}


.nav-link{
    position:relative;

    display:flex;
    align-items:center;

    gap:9px;

    padding:
        7px 11px;

    border:0;

    color:#fff;

    background:
        transparent;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:
        clamp(12px,1vw,17px);

    font-weight:900;

    text-decoration:none;

    cursor:pointer;

    transition:
        transform .16s ease,
        color .16s ease;
}


.nav-link:hover{
    color:var(--yellow);

    transform:
        translateY(-2px);
}


.nav-icon{
    display:grid;
    place-items:center;

    width:26px;
    height:26px;

    color:var(--red);

    font-size:19px;
}


.nav-link::after{
    content:"";

    position:absolute;

    left:10px;
    right:10px;

    bottom:1px;

    height:3px;

    background:
        var(--red);

    transform:
        scaleX(0);

    transform-origin:
        left;

    transition:
        transform .18s ease;
}


.nav-link:hover::after{
    transform:
        scaleX(1);
}


/* =========================================================
   SEARCH AREA

   位置对应背景图片中的搜索栏
========================================================= */

.search-area{
    position:absolute;

    left:3.25%;
    top:51.35%;

    width:54.1%;
    height:18%;

    z-index:25;
}


/* =========================================================
   SEARCH FORM
========================================================= */

.search-form{
    position:relative;

    display:flex;

    width:100%;
    height:45%;

    min-height:48px;

    background:
        #fff;

    border:
        clamp(3px,.28vw,5px)
        solid
        #050505;

    box-shadow:
        0 0 0
        clamp(2px,.14vw,3px)
        #fff;

    clip-path:
        polygon(
            1% 5%,
            99% 0,
            96.8% 94%,
            0 100%
        );

    transition:
        filter .2s ease,
        transform .2s ease;
}


.search-form:focus-within{
    filter:
        drop-shadow(
            0 0 10px
            rgba(255,230,0,.72)
        );

    transform:
        translateY(-2px);
}


/* 扫描光 */

.search-form::after{
    content:"";

    position:absolute;

    left:-40%;
    top:0;

    width:24%;
    height:100%;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,230,0,.2),
            rgba(255,255,255,.75),
            transparent
        );

    transform:
        skewX(-20deg);

    opacity:0;
}


.search-form:focus-within::after{
    animation:
        inputScan .75s ease-out;
}


@keyframes inputScan{

    0%{
        left:-40%;
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        left:120%;
        opacity:0;
    }

}


/* =========================================================
   SEARCH INPUT
========================================================= */

.search-input{
    position:relative;

    z-index:2;

    flex:1;

    min-width:0;

    border:0;
    outline:0;

    padding:
        0 4.5%;

    color:#222;

    background:#fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:
        clamp(13px,1.2vw,20px);

    font-weight:700;
}


.search-input::placeholder{
    color:#999;
}


/* =========================================================
   SEARCH BUTTON
========================================================= */

.search-button{
    position:relative;

    z-index:3;

    width:14%;

    min-width:70px;

    border:0;

    color:#fff;

    background:
        var(--red);

    cursor:pointer;

    clip-path:
        polygon(
            18% 0,
            100% 0,
            100% 100%,
            0 100%
        );

    transition:
        background .16s ease,
        color .16s ease;
}


.search-button:hover{
    color:#050505;
    background:
        var(--yellow);
}


.search-icon{
    position:absolute;

    left:54%;
    top:50%;

    width:28%;
    aspect-ratio:1;

    border:
        clamp(2px,.22vw,4px)
        solid
        currentColor;

    border-radius:50%;

    transform:
        translate(-50%,-55%);
}


.search-icon::after{
    content:"";

    position:absolute;

    width:45%;
    height:12%;

    right:-31%;
    bottom:-14%;

    border-radius:3px;

    background:
        currentColor;

    transform:
        rotate(45deg);
}


/* =========================================================
   SEARCH ENGINE ROW
========================================================= */

.engine-row{
    display:flex;

    align-items:center;

    gap:2%;

    height:47%;

    padding-top:2.5%;
}


.engine-label{
    color:#fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:
        clamp(11px,.95vw,16px);

    font-weight:900;

    white-space:nowrap;

    text-shadow:
        2px 2px 0 #000;
}


.engine-buttons{
    flex:1;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:2%;
}


.engine-button{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    height:
        clamp(38px,4.1vw,58px);

    border:
        2px solid
        rgba(255,255,255,.82);

    color:#fff;

    background:
        rgba(3,3,3,.88);

    box-shadow:
        4px 4px 0
        rgba(0,0,0,.8);

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    font-size:
        clamp(10px,.85vw,15px);

    font-weight:700;

    cursor:pointer;

    transition:
        transform .16s ease,
        border-color .16s ease,
        color .16s ease,
        background .16s ease;
}


.engine-button:hover{
    border-color:
        var(--yellow);

    transform:
        translateY(-3px);
}


.engine-button.active{
    color:#050505;

    background:
        var(--yellow);

    border-color:
        #050505;

    box-shadow:
        5px 5px 0
        var(--red);
}


.engine-symbol{
    display:grid;

    place-items:center;

    width:
        clamp(22px,2vw,31px);

    height:
        clamp(22px,2vw,31px);

    font-family:
        Impact,
        Arial,
        sans-serif;

    font-size:
        clamp(14px,1.5vw,23px);
}


.bing{
    color:#00b7ff;
}


.google{
    color:#4285f4;
}


.youtube{
    color:#ff1f2d;
}


.wikipedia{
    color:#fff;
}


/* active 时图标变黑 */

.engine-button.active
.engine-symbol{
    color:#050505;
}


/* =========================================================
   HAND ENERGY

   放在人物前方手掌附近
========================================================= */

.hand-energy{
    position:absolute;

    left:84.1%;
    top:53.7%;

    width:8%;
    aspect-ratio:1;

    z-index:18;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}


.energy-ring{
    position:absolute;

    inset:0;

    border:
        2px solid
        rgba(255,202,40,.75);

    border-radius:50%;

    opacity:.35;

    animation:
        ringIdle 3s
        ease-in-out
        infinite;
}


.energy-ring:nth-child(2){
    inset:20%;

    animation-delay:
        -.7s;
}


.energy-core{
    position:absolute;

    left:50%;
    top:50%;

    width:8px;
    height:8px;

    border-radius:50%;

    background:
        var(--yellow);

    box-shadow:
        0 0 14px var(--yellow),
        0 0 24px var(--red);

    transform:
        translate(-50%,-50%);
}


@keyframes ringIdle{

    0%,
    100%{
        opacity:.18;
        transform:
            scale(.7)
            rotate(0deg);
    }

    50%{
        opacity:.55;
        transform:
            scale(1.15)
            rotate(100deg);
    }

}


/* =========================================================
   PAGE TRANSITION FX
========================================================= */

.transition-fx{
    position:fixed;

    inset:0;

    z-index:500;

    pointer-events:none;

    overflow:hidden;
}


.transition-flash{
    position:absolute;

    inset:0;

    background:#fff;

    opacity:0;
}


.transition-red{
    position:absolute;

    left:-130%;
    top:-20%;

    width:160%;
    height:150%;

    background:
        var(--red);

    transform:
        rotate(-8deg);
}


.transition-black{
    position:absolute;

    right:-140%;
    top:-25%;

    width:165%;
    height:160%;

    background:#000;

    transform:
        rotate(7deg);
}


/* =========================================================
   CREATOR TRANSITION
========================================================= */

body.to-creator
.art{
    transform:
        scale(1.09)
        translate(-2%,1%);

    filter:
        contrast(1.08)
        saturate(1.12);
}


body.to-creator
.hand-energy{
    animation:
        creatorEnergy
        .48s
        ease-out
        forwards;
}


@keyframes creatorEnergy{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.8);
    }

    55%{
        filter:
            drop-shadow(
                0 0 25px
                var(--yellow)
            );

        transform:
            translate(-50%,-50%)
            scale(2.5)
            rotate(80deg);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(4);
    }

}


body.to-creator
.transition-flash{
    animation:
        pageFlash
        .25s
        .31s
        ease-out
        forwards;
}


body.to-creator
.transition-red{
    animation:
        creatorRed
        .45s
        .32s
        cubic-bezier(.7,0,.2,1)
        forwards;
}


body.to-creator
.transition-black{
    animation:
        creatorBlack
        .45s
        .43s
        cubic-bezier(.7,0,.2,1)
        forwards;
}


@keyframes creatorRed{

    to{
        left:-10%;
    }

}


@keyframes creatorBlack{

    to{
        right:-8%;
    }

}


/* =========================================================
   FEEDBACK TRANSITION
========================================================= */

body.to-feedback
.art{
    transform:
        scale(1.12)
        translate(-3%,1.5%);

    filter:
        contrast(1.14)
        saturate(1.18);
}


body.to-feedback
.hand-energy{
    animation:
        feedbackBurst
        .42s
        ease-out
        forwards;
}


@keyframes feedbackBurst{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.6);
    }

    50%{
        opacity:1;

        filter:
            drop-shadow(
                0 0 30px
                var(--red)
            );

        transform:
            translate(-50%,-50%)
            scale(3.5);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(6);
    }

}


body.to-feedback
.transition-flash{
    animation:
        pageFlash
        .22s
        .2s
        ease-out
        forwards;
}


body.to-feedback
.transition-red{
    animation:
        feedbackRed
        .42s
        .21s
        cubic-bezier(.7,0,.2,1)
        forwards;
}


body.to-feedback
.transition-black{
    animation:
        feedbackBlack
        .38s
        .33s
        cubic-bezier(.7,0,.2,1)
        forwards;
}


@keyframes feedbackRed{

    from{
        left:110%;
    }

    to{
        left:-10%;
    }

}


@keyframes feedbackBlack{

    from{
        right:120%;
    }

    to{
        right:-5%;
    }

}


@keyframes pageFlash{

    0%{
        opacity:0;
    }

    40%{
        opacity:.85;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   CURSOR
========================================================= */

.custom-cursor{
    position:fixed;

    left:-100px;
    top:-100px;

    width:30px;
    height:30px;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}


.custom-cursor::before{
    content:"";

    position:absolute;

    inset:2px;

    border:
        2px solid
        var(--yellow);

    border-radius:50%;

    box-shadow:
        0 0 9px
        rgba(255,230,0,.8);
}


.custom-cursor::after{
    content:"✦";

    position:absolute;

    left:50%;
    top:50%;

    color:
        var(--red);

    font-size:15px;

    transform:
        translate(-50%,-53%);
}


.cursor-dot{
    position:fixed;

    width:7px;
    height:7px;

    z-index:9998;

    pointer-events:none;

    background:
        var(--yellow);

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    animation:
        dotFade .45s
        linear
        forwards;
}


@keyframes dotFade{

    to{
        opacity:0;
        transform:
            translate(-50%,-50%)
            rotate(160deg)
            scale(.1);
    }

}


/* =========================================================
   WIDE-SCREEN DECORATIVE SIDES
========================================================= */

.side-decoration{
    position:fixed;

    top:0;
    bottom:0;

    width:14vw;

    pointer-events:none;

    opacity:.5;

    background:
        repeating-linear-gradient(
            -17deg,
            transparent 0 60px,
            rgba(239,16,35,.18) 61px 64px,
            transparent 65px 110px
        );
}


.side-left{
    left:0;
}


.side-right{
    right:0;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

    body{
        overflow:auto;
    }


    .screen{
        display:block;

        min-height:100vh;

        background:#050505;
    }


    .stage{
        width:100vw;
        height:100vh;

        aspect-ratio:auto;
    }


    .art{
        inset:0;

        background-size:
            cover;

        background-position:
            67% center;

        filter:
            brightness(.72);

        transform:none;
    }


    .top-nav{
        top:14px;
        right:10px;

        padding:3px 5px;

        gap:1px;
    }


    .nav-divider{
        margin:0 2px;
    }


    .nav-link{
        padding:7px 8px;

        font-size:11px;
    }


    .nav-icon{
        width:18px;
        height:18px;

        font-size:14px;
    }


    .search-area{
        left:5%;
        top:auto;
        bottom:7%;

        width:90%;
        height:auto;

        padding:
            13px;

        background:
            rgba(0,0,0,.83);

        border-left:
            5px solid
            var(--red);

        clip-path:
            polygon(
                0 3%,
                98% 0,
                100% 95%,
                2% 100%
            );
    }


    .search-form{
        height:56px;
    }


    .engine-row{
        height:auto;

        padding-top:
            13px;
    }


    .engine-label{
        display:none;
    }


    .engine-buttons{
        gap:6px;
    }


    .engine-button{
        height:44px;

        padding:
            0 4px;

        font-size:10px;
    }


    .engine-button span:last-child{
        display:none;
    }


    .hand-energy{
        display:none;
    }


    .side-decoration{
        display:none;
    }

}


/* =========================================================
   TOUCH DEVICES
========================================================= */

@media(pointer:fine){

    body,
    button,
    input,
    a{
        cursor:none;
    }

}


@media(pointer:coarse){

    .custom-cursor{
        display:none;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }

}

</style>

</head>


<body>

<div class="side-decoration side-left"></div>
<div class="side-decoration side-right"></div>


<div class="screen">

    <div class="stage"
         id="stage">


        <!-- =============================================
             FINAL HOMEPAGE ART
        ============================================== -->

        <div class="art"
             id="art">
        </div>


        <!-- =============================================
             SEO / ACCESSIBILITY TITLE
        ============================================== -->

        <h1 class="sr-only">
            PHANTOM SEARCH
        </h1>


        <!-- =============================================
             TOP NAVIGATION
        ============================================== -->

        <nav class="top-nav">

            <a
                href="feedback.html"
                class="nav-link"
                id="feedbackLink"
                aria-label="前往反馈页面"
            >

                <span class="nav-icon">
                    ✉
                </span>

                <span>
                    反馈
                </span>

            </a>


            <span class="nav-divider"></span>


            <a
                href="creator.html"
                class="nav-link"
                id="creatorLink"
                aria-label="前往创作者信息页面"
            >

                <span class="nav-icon">
                    ♟
                </span>

                <span>
                    创作者信息
                </span>

            </a>

        </nav>


        <!-- =============================================
             REAL SEARCH UI
        ============================================== -->

        <section
            class="search-area"
            aria-label="搜索区域"
        >

            <form
                class="search-form"
                id="searchForm"
            >

                <input
                    class="search-input"
                    id="searchInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="搜索任何内容..."
                    aria-label="搜索内容"
                >


                <button
                    class="search-button"
                    type="submit"
                    aria-label="搜索"
                >

                    <span
                        class="search-icon"
                        aria-hidden="true">
                    </span>

                </button>

            </form>


            <!-- SEARCH ENGINES -->

            <div class="engine-row">

                <span class="engine-label">
                    快捷搜索：
                </span>


                <div class="engine-buttons">


                    <button
                        type="button"
                        class="engine-button active"
                        data-engine="bing"
                    >

                        <span class="engine-symbol bing">
                            B
                        </span>

                        <span>
                            Bing
                        </span>

                    </button>


                    <button
                        type="button"
                        class="engine-button"
                        data-engine="google"
                    >

                        <span class="engine-symbol google">
                            G
                        </span>

                        <span>
                            Google
                        </span>

                    </button>


                    <button
                        type="button"
                        class="engine-button"
                        data-engine="youtube"
                    >

                        <span class="engine-symbol youtube">
                            ▶
                        </span>

                        <span>
                            YouTube
                        </span>

                    </button>


                    <button
                        type="button"
                        class="engine-button"
                        data-engine="wikipedia"
                    >

                        <span class="engine-symbol wikipedia">
                            W
                        </span>

                        <span>
                            Wikipedia
                        </span>

                    </button>


                </div>

            </div>

        </section>


        <!-- =============================================
             HAND ENERGY
        ============================================== -->

        <div
            class="hand-energy"
            aria-hidden="true"
        >

            <div class="energy-ring"></div>
            <div class="energy-ring"></div>
            <div class="energy-core"></div>

        </div>

    </div>

</div>


<!-- =============================================
     PAGE TRANSITION
============================================== -->

<div
    class="transition-fx"
    aria-hidden="true"
>

    <div class="transition-flash"></div>
    <div class="transition-red"></div>
    <div class="transition-black"></div>

</div>


<!-- =============================================
     CUSTOM CURSOR
============================================== -->

<div
    class="custom-cursor"
    id="customCursor"
    aria-hidden="true"
></div>


<script>

/* =========================================================
   SEARCH ENGINE
========================================================= */

const searchForm =
    document.getElementById(
        "searchForm"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const engineButtons =
    document.querySelectorAll(
        ".engine-button"
    );


let currentEngine =
    "bing";


const engines = {

    bing:
        "https://www.bing.com/search?q=",

    google:
        "https://www.google.com/search?q=",

    youtube:
        "https://www.youtube.com/results?search_query=",

    wikipedia:
        "https://zh.wikipedia.org/w/index.php?search="

};



/* =========================================================
   CHANGE ENGINE
========================================================= */

engineButtons.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            engineButtons.forEach(
                item => {

                    item.classList.remove(
                        "active"
                    );

                }
            );


            this.classList.add(
                "active"
            );


            currentEngine =
                this.dataset.engine;


            /*
               如果输入框已经有内容，
               点击搜索引擎按钮直接执行搜索。
            */

            if(
                searchInput.value
                .trim()
            ){

                performSearch();

            }else{

                searchInput.focus();

            }

        }
    );

});



/* =========================================================
   SEARCH FORM
========================================================= */

searchForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        performSearch();

    }
);



/* =========================================================
   SEARCH FUNCTION
========================================================= */

function performSearch(){

    const value =
        searchInput.value.trim();


    if(!value){

        searchInput.focus();

        return;

    }


    /*
       完整 URL：
       https://example.com
    */

    if(
        /^https?:\/\//i
        .test(value)
    ){

        window.location.href =
            value;

        return;

    }


    /*
       类似：
       github.com
       openai.com
       wikipedia.org/wiki/...
    */

    if(
        !/\s/.test(value)
        &&
        /^[a-z0-9-]+(\.[a-z0-9-]+)+([/?#].*)?$/i
        .test(value)
    ){

        window.location.href =
            "https://" + value;

        return;

    }


    /*
       普通关键词搜索
    */

    const target =
        engines[currentEngine]
        +
        encodeURIComponent(value);


    window.location.href =
        target;

}



/* =========================================================
   NAVIGATION TRANSITIONS
========================================================= */

const creatorLink =
    document.getElementById(
        "creatorLink"
    );

const feedbackLink =
    document.getElementById(
        "feedbackLink"
    );


creatorLink.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        goToPage(
            this.href,
            "creator"
        );

    }
);


feedbackLink.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        goToPage(
            this.href,
            "feedback"
        );

    }
);



/* =========================================================
   PAGE TRANSITION FUNCTION
========================================================= */

let changingPage =
    false;


function goToPage(
    target,
    type
){

    if(changingPage){
        return;
    }


    changingPage =
        true;


    if(
        type ===
        "creator"
    ){

        document.body
            .classList
            .add(
                "to-creator"
            );

    }else{

        document.body
            .classList
            .add(
                "to-feedback"
            );

    }


    /*
       当前版本：
       使用网页动态过渡。

       以后如果我们制作出真正连续人物动画，
       就可以在这里接入动画，
       整个首页其他代码都不用推翻。
    */

    setTimeout(
        function(){

            window.location.href =
                target;

        },
        720
    );

}



/* =========================================================
   BACKGROUND PARALLAX
========================================================= */

const art =
    document.getElementById(
        "art"
    );

const stage =
    document.getElementById(
        "stage"
    );


let pointerX =
    0;

let pointerY =
    0;


stage.addEventListener(
    "mousemove",
    function(event){

        if(
            changingPage
        ){
            return;
        }


        const rect =
            stage.getBoundingClientRect();


        const x =
            (
                event.clientX
                -
                rect.left
            )
            /
            rect.width
            -
            .5;


        const y =
            (
                event.clientY
                -
                rect.top
            )
            /
            rect.height
            -
            .5;


        pointerX =
            x * -5;

        pointerY =
            y * -3;


        art.style.transform =
            `scale(1.035)
             translate(
                 ${pointerX}px,
                 ${pointerY}px
             )`;

    }
);


stage.addEventListener(
    "mouseleave",
    function(){

        if(
            changingPage
        ){
            return;
        }


        art.style.transform =
            "scale(1.03)";

    }
);



/* =========================================================
   CUSTOM CURSOR
========================================================= */

const cursor =
    document.getElementById(
        "customCursor"
    );


let mouseX =
    -100;

let mouseY =
    -100;

let cursorX =
    -100;

let cursorY =
    -100;

let lastTrail =
    0;



document.addEventListener(
    "mousemove",
    function(event){

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;


        createCursorTrail(
            mouseX,
            mouseY
        );

    }
);



function animateCursor(){

    cursorX +=
        (
            mouseX
            -
            cursorX
        )
        *
        .28;


    cursorY +=
        (
            mouseY
            -
            cursorY
        )
        *
        .28;


    cursor.style.left =
        cursorX + "px";

    cursor.style.top =
        cursorY + "px";


    requestAnimationFrame(
        animateCursor
    );

}


animateCursor();



/* =========================================================
   CURSOR TRAIL
========================================================= */

function createCursorTrail(
    x,
    y
){

    if(
        !window.matchMedia(
            "(pointer:fine)"
        ).matches
    ){
        return;
    }


    const now =
        performance.now();


    if(
        now
        -
        lastTrail
        <
        45
    ){
        return;
    }


    lastTrail =
        now;


    const particle =
        document.createElement(
            "span"
        );


    particle.className =
        "cursor-dot";


    particle.style.left =
        (
            x
            +
            (
                Math.random()
                -
                .5
            )
            *
            10
        )
        +
        "px";


    particle.style.top =
        (
            y
            +
            (
                Math.random()
                -
                .5
            )
            *
            10
        )
        +
        "px";


    document.body.appendChild(
        particle
    );


    setTimeout(
        function(){

            particle.remove();

        },
        470
    );

}

</script>
