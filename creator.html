<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CREATOR / 陈植轩</title>

<style>

:root{
    --red:#ef1023;
    --black:#070707;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffcf28;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;

    background:
        #070707;

    color:var(--white);

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;
}


/* =========================================================
   背景
========================================================= */

.bg{
    position:fixed;
    inset:0;

    background-image:url("assets/creator-bg.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    z-index:0;
}


/* 黑色渐变保护层 */

.bg::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.08),
            rgba(0,0,0,.02) 55%,
            rgba(0,0,0,.2)
        );

    pointer-events:none;
}


/* =========================================================
   顶部按钮
========================================================= */

.top{
    position:fixed;

    top:20px;
    right:30px;

    display:flex;
    gap:14px;

    z-index:50;
}

.top a{
    display:block;

    padding:9px 17px;

    color:var(--black);

    background:var(--white);

    border:3px solid var(--black);

    box-shadow:
        5px 5px 0 var(--black);

    text-decoration:none;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;
    font-weight:900;

    transform:skew(-7deg);

    transition:
        transform .18s ease,
        background .18s ease;
}

.top a:first-child{
    background:var(--yellow);
}

.top a:hover{
    transform:
        skew(-7deg)
        translate(-3px,-3px);

    background:var(--yellow);
}


/* =========================================================
   主要内容
========================================================= */

.content{
    position:relative;

    width:100%;
    min-height:100vh;

    z-index:5;
}


/* =========================================================
   卡片区域
========================================================= */

.card-zone{

    position:absolute;

    /*
       卡片中心位置。
       这一版故意放在人物手掌上方，
       而不是页面正中央。
    */

    left:43%;
    top:43%;

    width:270px;
    height:390px;

    transform:
        translate(-50%,-50%);

    perspective:1400px;

    z-index:20;

    pointer-events:none;
}


/* =========================================================
   波状光圈
========================================================= */

.ring{
    position:absolute;

    left:50%;
    top:50%;

    width:330px;
    height:330px;

    border:3px solid rgba(255,207,40,.8);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        scale(.45);

    opacity:0;

    pointer-events:none;

    box-shadow:
        0 0 15px rgba(255,207,40,.7),
        inset 0 0 15px rgba(255,207,40,.35);

    animation:
        wave 3.2s infinite;
}

.ring:nth-child(2){
    animation-delay:1.05s;
}

.ring:nth-child(3){
    animation-delay:2.1s;
}

@keyframes wave{

    0%{
        opacity:.75;

        transform:
            translate(-50%,-50%)
            scale(.4);
    }

    70%{
        opacity:.15;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.65);
    }
}


/* =========================================================
   中心光
========================================================= */

.card-glow{
    position:absolute;

    left:50%;
    top:50%;

    width:270px;
    height:390px;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(255,207,40,.3),
            rgba(255,207,40,.08) 40%,
            transparent 72%
        );

    filter:blur(18px);

    animation:
        glowPulse 2.8s ease-in-out infinite;

    pointer-events:none;
}

@keyframes glowPulse{

    0%,
    100%{
        opacity:.55;
        transform:
            translate(-50%,-50%)
            scale(.92);
    }

    50%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}


/* =========================================================
   真正的翻牌容器
========================================================= */

.card-wrap{

    position:absolute;

    left:50%;
    top:50%;

    width:235px;
    height:350px;

    transform:
        translate(-50%,-50%);

    pointer-events:auto;

    cursor:pointer;

    transition:
        transform .22s ease;

    transform-style:preserve-3d;
}


/* 鼠标靠近时 */

.card-wrap.hovering{
    filter:
        drop-shadow(0 0 16px rgba(255,207,40,.8));
}


/* =========================================================
   卡片本体
========================================================= */

.card{

    position:relative;

    width:100%;
    height:100%;

    transform-style:preserve-3d;

    transition:
        transform .85s cubic-bezier(.2,.75,.2,1);

    will-change:transform;
}


/* 翻转 */

.card.flipped{

    transform:
        rotateY(180deg);
}


/* =========================================================
   卡片正反面
========================================================= */

.face{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    backface-visibility:hidden;

    -webkit-backface-visibility:hidden;

    transform-style:preserve-3d;

    overflow:hidden;

    border:5px solid var(--black);

    box-shadow:
        0 0 0 3px var(--yellow),
        10px 12px 0 rgba(0,0,0,.75);

    background:#080808;
}


/* =========================================================
   正面：你的照片
========================================================= */

.front{

    transform:
        rotateY(0deg);

    background:#080808;
}


/*
   这里直接使用你的原始照片。
   不裁剪、不修改、不滤镜。
*/

.front img{

    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center center;
}


/* 照片上的暗色渐变 */

.front::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 60%,
            rgba(0,0,0,.75) 100%
        );

    pointer-events:none;
}


/* 卡片底部姓名 */

.card-name{

    position:absolute;

    left:15px;
    bottom:15px;

    z-index:3;

    padding:7px 10px;

    background:var(--yellow);

    color:var(--black);

    border:3px solid var(--black);

    box-shadow:
        4px 4px 0 var(--black);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;

    font-weight:900;

    transform:rotate(-2deg);
}


/* =========================================================
   背面：塔罗牌
========================================================= */

.back{

    transform:
        rotateY(180deg);

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255,207,40,.22),
            transparent 25%
        ),

        repeating-linear-gradient(
            45deg,
            transparent 0 9px,
            rgba(255,207,40,.09) 10px 11px
        ),

        linear-gradient(
            135deg,
            #090909,
            #31090d 45%,
            #090909
        );

    display:flex;

    align-items:center;
    justify-content:center;
}


/* 塔罗牌内框 */

.back::before{

    content:"";

    position:absolute;

    inset:15px;

    border:3px solid var(--gold);

    box-shadow:
        inset 0 0 0 5px #120b08,
        inset 0 0 0 8px var(--gold);
}


/* 第二层装饰 */

.back::after{

    content:"";

    position:absolute;

    inset:29px;

    border:1px solid rgba(255,207,40,.75);

    background:
        radial-gradient(
            circle,
            transparent 0 42px,
            rgba(255,207,40,.12) 43px 45px,
            transparent 46px
        );

}


/* 塔罗中心 */

.tarot-symbol{

    position:relative;

    z-index:3;

    width:125px;
    height:125px;

    border:3px solid var(--gold);

    transform:rotate(45deg);

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 18px rgba(255,207,40,.35);
}


/* 中心圆 */

.tarot-symbol::before{

    content:"";

    width:70px;
    height:70px;

    border:3px solid var(--gold);

    border-radius:50%;

    box-shadow:
        inset 0 0 0 7px #170a0b;
}


/* 星星 */

.tarot-star{

    position:absolute;

    z-index:5;

    color:var(--gold);

    font-size:52px;

    line-height:1;

    transform:
        rotate(-45deg);

    text-shadow:
        0 0 12px rgba(255,207,40,.75);
}


/* 罗马数字 */

.tarot-number{

    position:absolute;

    top:24px;

    z-index:5;

    color:var(--gold);

    font-family:
        Georgia,
        serif;

    font-size:24px;

    font-weight:bold;
}


/* =========================================================
   卡片悬浮动画
========================================================= */

.card-wrap{

    animation:
        floatingCard 4s ease-in-out infinite;
}

@keyframes floatingCard{

    0%,
    100%{
        margin-top:0;
    }

    50%{
        margin-top:-13px;
    }
}


/* 翻牌以后仍然保留漂浮 */


/* =========================================================
   点击提示
========================================================= */

.flip-hint{

    position:absolute;

    left:50%;
    top:calc(100% + 25px);

    transform:
        translateX(-50%)
        rotate(-2deg);

    padding:9px 15px;

    white-space:nowrap;

    background:var(--yellow);

    color:var(--black);

    border:3px solid var(--black);

    box-shadow:
        5px 5px 0 var(--black);

    font-size:13px;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-weight:900;

    z-index:30;

    pointer-events:none;

    animation:
        hintFloat 1.8s ease-in-out infinite;
}

@keyframes hintFloat{

    0%,
    100%{
        transform:
            translateX(-50%)
            rotate(-2deg)
            translateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            rotate(-2deg)
            translateY(-5px);
    }
}


/* =========================================================
   鼠标光标
========================================================= */

.cursor-dot{

    position:fixed;

    width:14px;
    height:14px;

    border-radius:50%;

    background:var(--yellow);

    border:3px solid var(--black);

    box-shadow:
        0 0 0 5px rgba(239,16,35,.55),
        0 0 15px rgba(255,230,0,.8);

    pointer-events:none;

    z-index:999;

    transform:
        translate(-50%,-50%);

    transition:
        width .15s ease,
        height .15s ease;
}


/* 外圈 */

.cursor-ring{

    position:fixed;

    width:42px;
    height:42px;

    border:2px solid rgba(255,230,0,.7);

    border-radius:50%;

    pointer-events:none;

    z-index:998;

    transform:
        translate(-50%,-50%);

    transition:
        width .2s ease,
        height .2s ease,
        border-color .2s ease;
}


/* =========================================================
   点击冲击波
========================================================= */

.click-wave{

    position:fixed;

    width:15px;
    height:15px;

    border:4px solid var(--yellow);

    border-radius:50%;

    pointer-events:none;

    z-index:997;

    transform:
        translate(-50%,-50%)
        scale(.3);

    animation:
        clickWave .55s ease-out forwards;
}

@keyframes clickWave{

    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(5);
    }
}


/* =========================================================
   页面转场
========================================================= */

.transition{

    position:fixed;

    inset:0;

    background:var(--red);

    z-index:1000;

    pointer-events:none;

    opacity:0;

    clip-path:
        polygon(
            0 100%,
            100% 100%,
            100% 100%,
            0 100%
        );

    transition:
        opacity .15s,
        clip-path .5s cubic-bezier(.77,0,.18,1);
}

body.leaving .transition{

    opacity:1;

    clip-path:
        polygon(
            0 0,
            100% 7%,
            100% 100%,
            0 93%
        );
}


/* =========================================================
   小屏幕
========================================================= */

@media(max-width:900px){

    .card-zone{

        left:43%;
        top:43%;

        transform:
            translate(-50%,-50%)
            scale(.82);
    }

    .top{

        top:15px;
        right:15px;
    }

}


@media(max-width:650px){

    body{
        overflow:auto;
    }

    .top{

        right:10px;

        gap:7px;
    }

    .top a{

        padding:7px 10px;

        font-size:11px;
    }

    .card-zone{

        left:50%;
        top:47%;

        transform:
            translate(-50%,-50%)
            scale(.72);
    }

}


/* =========================================================
   减少动画
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none !important;

        transition:none !important;
    }
}

</style>
</head>


<body>

<!-- =====================================================
     背景
===================================================== -->

<div class="bg"></div>


<!-- =====================================================
     页面转场
===================================================== -->

<div class="transition"></div>


<!-- =====================================================
     顶部导航
===================================================== -->

<header class="top">

    <a href="index.html" data-transition>
        返回搜索
    </a>

    <a href="feedback.html" data-transition>
        反馈
    </a>

</header>


<!-- =====================================================
     主要内容
===================================================== -->

<main class="content">


    <!-- =================================================
         卡片区域
    ================================================== -->

    <div class="card-zone">

        <!-- 波状光圈 -->

        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>


        <!-- 中心光 -->

        <div class="card-glow"></div>


        <!-- 真正可以点击翻转的卡片 -->

        <div
            class="card-wrap"
            id="cardWrap"
            aria-label="点击翻转创作者卡片"
        >

            <div
                class="card"
                id="card"
            >


                <!-- =====================================
                     正面
                ====================================== -->

                <div class="face front">

                    <img
                        src="assets/creator-photo.png"
                        alt="陈植轩"
                    >

                    <div class="card-name">
                        CREATOR / 陈植轩
                    </div>

                </div>


                <!-- =====================================
                     背面
                ====================================== -->

                <div class="face back">

                    <div class="tarot-number">
                        XIII
                    </div>

                    <div class="tarot-symbol">

                        <div class="tarot-star">
                            ✦
                        </div>

                    </div>

                </div>

            </div>


            <!-- 点击提示 -->

            <div class="flip-hint">
                CLICK TO FLIP ↻
            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     鼠标
===================================================== -->

<div
    class="cursor-ring"
    id="cursorRing"
></div>

<div
    class="cursor-dot"
    id="cursorDot"
></div>


<script>

/* =========================================================
   卡片翻转
========================================================= */

const cardWrap =
    document.getElementById("cardWrap");

const card =
    document.getElementById("card");


cardWrap.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        card.classList.toggle("flipped");

        createWave(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================================================
   卡片鼠标悬停
========================================================= */

cardWrap.addEventListener(
    "mouseenter",
    function(){

        cardWrap.classList.add("hovering");

        cursorRing.style.width="60px";
        cursorRing.style.height="60px";

    }
);


cardWrap.addEventListener(
    "mouseleave",
    function(){

        cardWrap.classList.remove("hovering");

        cursorRing.style.width="42px";
        cursorRing.style.height="42px";

        cardWrap.style.transform=
            "translate(-50%,-50%)";

    }
);


/* =========================================================
   卡片 3D 跟随鼠标
========================================================= */

cardWrap.addEventListener(
    "mousemove",
    function(e){

        const rect =
            cardWrap.getBoundingClientRect();

        const x =
            (e.clientX - rect.left)
            / rect.width
            - .5;

        const y =
            (e.clientY - rect.top)
            / rect.height
            - .5;

        const rotateX =
            y * -10;

        const rotateY =
            x * 12;


        /*
           注意：
           这里只让整个卡片轻微倾斜，
           不会破坏翻牌的 rotateY。
        */

        if(!card.classList.contains("flipped")){

            cardWrap.style.transform =
                `translate(-50%,-50%)
                 rotateX(${rotateX}deg)
                 rotateY(${rotateY}deg)`;

        }

    }
);


/* =========================================================
   鼠标
========================================================= */

const cursorDot =
    document.getElementById("cursorDot");

const cursorRing =
    document.getElementById("cursorRing");


let mouseX=0;
let mouseY=0;

let ringX=0;
let ringY=0;


document.addEventListener(
    "mousemove",
    function(e){

        mouseX=e.clientX;
        mouseY=e.clientY;

        cursorDot.style.left=
            mouseX+"px";

        cursorDot.style.top=
            mouseY+"px";

    }
);


/* 外圈平滑跟随 */

function animateCursor(){

    ringX +=
        (mouseX-ringX)*.12;

    ringY +=
        (mouseY-ringY)*.12;


    cursorRing.style.left=
        ringX+"px";

    cursorRing.style.top=
        ringY+"px";


    requestAnimationFrame(
        animateCursor
    );
}

animateCursor();


/* =========================================================
   点击鼠标冲击波
========================================================= */

document.addEventListener(
    "click",
    function(e){

        const wave =
            document.createElement("div");

        wave.className=
            "click-wave";

        wave.style.left=
            e.clientX+"px";

        wave.style.top=
            e.clientY+"px";

        document.body.appendChild(wave);


        setTimeout(
            ()=>{
                wave.remove();
            },
            600
        );

    }
);


/* =========================================================
   创建卡片点击波纹
========================================================= */

function createWave(x,y){

    const wave =
        document.createElement("div");

    wave.className=
        "click-wave";

    wave.style.left=
        x+"px";

    wave.style.top=
        y+"px";

    document.body.appendChild(wave);


    setTimeout(
        ()=>{
            wave.remove();
        },
        600
    );

}


/* =========================================================
   页面转场
========================================================= */

document
.querySelectorAll("[data-transition]")
.forEach(
    link=>{

        link.addEventListener(
            "click",
            function(e){

                e.preventDefault();

                const target=
                    this.href;

                document.body
                    .classList
                    .add("leaving");


                setTimeout(
                    ()=>{
                        window.location.href=
                            target;
                    },
                    500
                );

            }
        );

    }
);

</script>

</body>
</html>
