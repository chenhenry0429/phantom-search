<!doctype html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CREATOR | PHANTOM SEARCH</title>

<style>

:root{
    --red:#ef1023;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffc928;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;
}

/* =========================================================
   BACKGROUND
========================================================= */

.creator-bg{
    position:fixed;
    inset:-2%;

    background:
        url("assets/creator-bg.png?v=8")
        center / cover
        no-repeat;

    transform:scale(1.025);
}

.creator-bg::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 43%,
            rgba(0,0,0,.22) 100%
        );
}

/* =========================================================
   ENTRY
========================================================= */

.page-content{
    opacity:0;

    transform:
        translateX(25px);

    animation:
        pageEnter
        .6s .1s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes pageEnter{

    to{
        opacity:1;
        transform:none;
    }

}

.entry-flash{
    position:fixed;
    inset:0;

    z-index:500;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle at 38% 47%,
            rgba(255,230,0,.45),
            transparent 16%
        );
}

body.from-home .entry-flash{
    animation:
        entryFlash
        .65s ease-out;
}

@keyframes entryFlash{

    0%{
        opacity:.75;
    }

    100%{
        opacity:0;
    }

}

/* =========================================================
   TOP NAV
========================================================= */

.top-nav{
    position:fixed;

    top:22px;
    right:30px;

    z-index:100;

    display:flex;
    gap:10px;
}

.top-nav a{
    padding:9px 15px;

    color:#050505;
    background:#fff;

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px
        #050505;

    text-decoration:none;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;
    font-weight:900;

    transform:
        skew(-7deg);

    transition:.15s ease;
}

.top-nav a:first-child{
    background:
        var(--yellow);
}

.top-nav a:hover{
    transform:
        skew(-7deg)
        translate(-3px,-3px);
}
