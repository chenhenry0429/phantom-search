<!doctype html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CREATOR | PHANTOM SEARCH</title>

<style>

:root{
    --red:#ef1023;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffc928;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;
}

/* =========================================================
   BACKGROUND
========================================================= */

.creator-bg{
    position:fixed;
    inset:-2%;

    background:
        url("assets/creator-bg.png?v=8")
        center / cover
        no-repeat;

    transform:scale(1.025);
}

.creator-bg::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 43%,
            rgba(0,0,0,.22) 100%
        );
}

/* =========================================================
   ENTRY
========================================================= */

.page-content{
    opacity:0;

    transform:
        translateX(25px);

    animation:
        pageEnter
        .6s .1s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes pageEnter{

    to{
        opacity:1;
        transform:none;
    }

}

.entry-flash{
    position:fixed;
    inset:0;

    z-index:500;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle at 38% 47%,
            rgba(255,230,0,.45),
            transparent 16%
        );
}

body.from-home .entry-flash{
    animation:
        entryFlash
        .65s ease-out;
}

@keyframes entryFlash{

    0%{
        opacity:.75;
    }

    100%{
        opacity:0;
    }

}

/* =========================================================
   TOP NAV
========================================================= */

.top-nav{
    position:fixed;

    top:22px;
    right:30px;

    z-index:100;

    display:flex;
    gap:10px;
}

.top-nav a{
    padding:9px 15px;

    color:#050505;
    background:#fff;

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px
        #050505;

    text-decoration:none;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;
    font-weight:900;

    transform:
        skew(-7deg);

    transition:.15s ease;
}

.top-nav a:first-child{
    background:
        var(--yellow);
}

.top-nav a:hover{
    transform:
        skew(-7deg)
        translate(-3px,-3px);
}

/* =========================================================
   CREATOR INFO
========================================================= */

.creator-info{
    position:fixed;

    right:5%;
    top:20%;

    z-index:30;

    width:
        min(
            520px,
            38vw
        );
}

.creator-tag{
    display:inline-block;

    padding:
        6px 12px;

    color:#050505;
    background:
        var(--yellow);

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px
        #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;
    font-weight:900;

    transform:
        rotate(-2deg);
}

.creator-info h1{
    margin:
        18px 0 8px;

    font-size:
        clamp(
            58px,
            6vw,
            105px
        );

    line-height:.8;

    color:#fff;

    -webkit-text-stroke:
        3px #050505;

    text-shadow:
        8px 8px #050505;

    transform:
        rotate(-2deg);
}

.creator-info h1 span{
    color:
        var(--red);
}

.creator-name{
    display:inline-block;

    margin:
        7px 0 15px;

    padding:
        7px 13px;

    color:#050505;
    background:#fff;

    border:
        3px solid
        #050505;

    box-shadow:
        5px 5px
        var(--red);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:
        clamp(
            18px,
            1.7vw,
            27px
        );

    font-weight:900;

    transform:
        rotate(1deg);
}

.creator-desc{
    max-width:500px;

    margin-top:13px;

    padding:
        16px 19px;

    color:#fff;

    background:
        rgba(0,0,0,.88);

    border-left:
        6px solid
        var(--red);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;
    line-height:1.8;
}

.skills{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    margin-top:18px;
}

.skill{
    padding:
        9px 11px;

    color:#050505;
    background:
        var(--white);

    border:
        3px solid
        #050505;

    box-shadow:
        4px 4px
        #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:11px;
    font-weight:900;
}

.skill:nth-child(even){
    background:
        var(--yellow);
}

/* =========================================================
   CARD POSITION
========================================================= */

.card-stage{
    position:fixed;

    left:38.2%;
    top:47%;

    width:
        clamp(
            180px,
            15vw,
            250px
        );

    aspect-ratio:
        2 / 3;

    z-index:45;

    perspective:
        1300px;

    transform:
        translate(-50%,-50%);
}

/* =========================================================
   FLOAT
========================================================= */

.card-float{
    width:100%;
    height:100%;

    animation:
        cardFloat
        3.2s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 16px 14px
            rgba(0,0,0,.55)
        );
}

@keyframes cardFloat{

    0%,
    100%{
        transform:
            translateY(0);
    }

    50%{
        transform:
            translateY(-12px);
    }

}

/* =========================================================
   CARD
========================================================= */

.card{
    --tilt-x:0deg;
    --tilt-y:0deg;

    position:relative;

    width:100%;
    height:100%;

    cursor:pointer;

    transform-style:
        preserve-3d;

    transform:
        rotateX(
            var(--tilt-x)
        )
        rotateY(
            var(--tilt-y)
        );

    transition:
        transform
        .55s
        cubic-bezier(.2,.8,.2,1);
}

.card.flipped{
    transform:
        rotateX(
            var(--tilt-x)
        )
        rotateY(
            calc(
                180deg
                +
                var(--tilt-y)
            )
        );
}

/* =========================================================
   CARD FACE
========================================================= */

.card-face{
    position:absolute;
    inset:0;

    overflow:hidden;

    border:
        5px solid
        var(--gold);

    outline:
        4px solid
        #050505;

    background:#080808;

    backface-visibility:
        hidden;
}

/* =========================================================
   FRONT
========================================================= */

.card-front{
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #191919,
            #050505
        );
}

/* =========================================================
   CREATOR PHOTO
   已调整：整体向下移动
========================================================= */

.creator-photo{
    position:absolute;

    inset:8px;

    overflow:hidden;

    background:#111;
}

.creator-photo img{
    position:absolute;

    left:0;
    top:0;

    width:108%;
    height:108%;

    display:block;

    object-fit:cover;

    object-position:
        center 34%;

    transform:
        translate(-4%,1%)
        rotate(1.6deg);

    transform-origin:
        center center;
}

.creator-photo::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.72),
            transparent 43%
        );
}

/* =========================================================
   CARD LABEL
========================================================= */

.card-label{
    position:absolute;

    left:12px;
    right:12px;
    bottom:14px;

    z-index:5;

    color:#fff;

    font-size:
        clamp(
            13px,
            1.2vw,
            19px
        );

    text-shadow:
        3px 3px #000;
}

.card-label span{
    display:block;

    margin-top:4px;

    color:
        var(--yellow);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:9px;
}

/* =========================================================
   TAROT BACK
========================================================= */

.card-back{
    transform:
        rotateY(180deg);

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle at center,
            #40090d,
            #090909 64%
        );
}

.tarot-symbol{
    position:relative;

    display:grid;
    place-items:center;

    width:68%;
    aspect-ratio:1;

    border:
        3px solid
        var(--gold);

    border-radius:50%;

    color:
        var(--gold);

    font-size:
        clamp(
            38px,
            4vw,
            72px
        );

    box-shadow:
        0 0 25px
        rgba(255,201,40,.25);
}

.tarot-symbol::before{
    content:"";

    position:absolute;

    inset:14%;

    border:
        1px solid
        rgba(255,201,40,.7);

    border-radius:50%;
}

.tarot-symbol::after{
    content:"";

    position:absolute;

    inset:-18px;

    border:
        1px solid
        rgba(255,201,40,.55);

    transform:
        rotate(45deg);
}

/* =========================================================
   CLICK HINT
========================================================= */

.card-hint{
    position:absolute;

    left:50%;
    bottom:-42px;

    white-space:nowrap;

    transform:
        translateX(-50%)
        rotate(-2deg);

    padding:
        5px 11px;

    color:#050505;

    background:
        var(--yellow);

    border:
        2px solid
        #050505;

    box-shadow:
        4px 4px
        #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:10px;
    font-weight:900;
}

/* =========================================================
   CARD ENERGY
========================================================= */

.card-energy{
    position:absolute;

    left:50%;
    top:50%;

    width:145%;

    aspect-ratio:1;

    z-index:-1;

    border:
        2px solid
        rgba(255,211,40,.5);

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    animation:
        cardEnergy
        3s ease-in-out
        infinite;
}

.card-energy::before,
.card-energy::after{
    content:"";

    position:absolute;

    border-radius:50%;
}

.card-energy::before{
    inset:15%;

    border:
        1px solid
        rgba(239,16,35,.65);
}

.card-energy::after{
    inset:30%;

    border:
        1px solid
        rgba(255,211,40,.5);
}

@keyframes cardEnergy{

    0%,
    100%{
        opacity:.18;

        transform:
            translate(-50%,-50%)
            scale(.82)
            rotate(0deg);
    }

    50%{
        opacity:.62;

        transform:
            translate(-50%,-50%)
            scale(1.06)
            rotate(100deg);
    }

}

/* =========================================================
   SPARKS
========================================================= */

.spark{
    position:absolute;

    width:8px;
    height:8px;

    pointer-events:none;

    background:
        var(--yellow);

    clip-path:
        polygon(
            50% 0,
            64% 36%,
            100% 50%,
            64% 64%,
            50% 100%,
            36% 64%,
            0 50%,
            36% 36%
        );

    filter:
        drop-shadow(
            0 0 5px
            var(--yellow)
        );

    animation:
        sparkle
        2s ease-in-out
        infinite;
}

.spark.one{
    left:-18%;
    top:20%;
}

.spark.two{
    right:-20%;
    top:38%;

    animation-delay:
        -.7s;
}

.spark.three{
    left:12%;
    bottom:-10%;

    animation-delay:
        -1.2s;
}

@keyframes sparkle{

    0%,
    100%{
        opacity:.1;

        transform:
            scale(.5)
            rotate(0deg);
    }

    50%{
        opacity:1;

        transform:
            scale(1.5)
            rotate(90deg);
    }

}

/* =========================================================
   EXIT
========================================================= */

.exit{
    position:fixed;
    inset:0;

    z-index:5000;

    pointer-events:none;

    visibility:hidden;
}

.exit::before{
    content:"";

    position:absolute;
    inset:-20%;

    background:
        var(--red);

    transform:
        translateX(-130%)
        rotate(-7deg);
}

.exit::after{
    content:"";

    position:absolute;
    inset:-20%;

    background:#000;

    transform:
        translateX(130%)
        rotate(6deg);
}

body.leaving .exit{
    visibility:visible;
}

body.leaving .exit::before{
    animation:
        leaveRed
        .42s forwards;
}

body.leaving .exit::after{
    animation:
        leaveBlack
        .42s .1s forwards;
}

@keyframes leaveRed{

    to{
        transform:
            translateX(-20%)
            rotate(-7deg);
    }

}

@keyframes leaveBlack{

    to{
        transform:
            translateX(20%)
            rotate(6deg);
    }

}

/* =========================================================
   CURSOR
========================================================= */

.cursor{
    position:fixed;

    left:-100px;
    top:-100px;

    width:28px;
    height:28px;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);
}

.cursor::before{
    content:"";

    position:absolute;

    inset:2px;

    border:
        2px solid
        var(--yellow);

    border-radius:50%;

    box-shadow:
        0 0 8px
        var(--yellow);
}

.cursor::after{
    content:"✦";

    position:absolute;
    inset:0;

    display:grid;
    place-items:center;

    color:
        var(--red);

    font-size:14px;
}

.trail{
    position:fixed;

    width:6px;
    height:6px;

    z-index:9998;

    pointer-events:none;

    background:
        var(--yellow);

    clip-path:
        polygon(
            50% 0,
            65% 35%,
            100% 50%,
            65% 65%,
            50% 100%,
            35% 65%,
            0 50%,
            35% 35%
        );

    animation:
        trailFade
        .5s forwards;
}

.trail.red{
    background:
        var(--red);
}

@keyframes trailFade{

    to{
        opacity:0;

        transform:
            rotate(160deg)
            scale(.1);
    }

}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    .creator-bg{
        background-position:
            40% center;

        filter:
            brightness(.55);
    }

    .creator-info{
        position:relative;

        right:auto;
        top:auto;

        width:90%;

        margin:
            110px auto 70px;
    }

    .card-stage{
        position:relative;

        left:auto;
        top:auto;

        width:200px;

        margin:
            35px auto 80px;

        transform:none;
    }

    .top-nav{
        top:10px;
        right:10px;
    }

}

@media(pointer:fine){

    body,
    a,
    .card{
        cursor:none;
    }

}

@media(pointer:coarse){

    .cursor{
        display:none;
    }

}

</style>
</head>


<body>


<div class="creator-bg"></div>

<div class="entry-flash"></div>


<div class="page-content">


    <!-- NAV -->

    <nav class="top-nav">

        <a
            href="index.html"
            data-page>
            返回搜索
        </a>

        <a
            href="feedback.html"
            data-page>
            意见反馈
        </a>

    </nav>


    <!-- FLOATING CARD -->

    <div class="card-stage">


        <div class="card-energy"></div>


        <div class="spark one"></div>

        <div class="spark two"></div>

        <div class="spark three"></div>


        <div class="card-float">


            <div
                class="card"
                id="creatorCard">


                <!-- FRONT -->

                <div
                    class="card-face
                           card-front">


                    <div class="creator-photo">

                        <img
                            src="assets/creator-photo.png?v=8"
                            alt="创作者照片">

                    </div>


                    <div class="card-label">

                        PHANTOM CREATOR

                        <span>
                            PROFILE 01
                        </span>

                    </div>

                </div>


                <!-- BACK -->

                <div
                    class="card-face
                           card-back">


                    <div class="tarot-symbol">
                        ✦
                    </div>

                </div>


            </div>

        </div>


        <div class="card-hint">
            CLICK TO FLIP ↻
        </div>


    </div>


    <!-- CREATOR INFORMATION -->

    <section class="creator-info">


        <div class="creator-tag">
            PHANTOM CREATOR / PROFILE 01
        </div>


        <h1>
            CREA<span>TOR</span>
        </h1>


        <div class="creator-name">
            我是陈植轩
        </div>


        <div class="creator-desc">

            欢迎来到我的创作者页面。

            <br><br>

            我喜欢探索技术、设计与创意之间的可能性，
            也希望通过自己的作品，将想法变成真正能够体验的东西。

        </div>


        <div class="skills">

            <div class="skill">
                WEB DESIGN
            </div>

            <div class="skill">
                AI EXPLORATION
            </div>

            <div class="skill">
                CREATIVE CODING
            </div>

            <div class="skill">
                VISUAL DESIGN
            </div>

        </div>


    </section>


</div>


<div class="exit"></div>


<div
    class="cursor"
    id="cursor">
</div>


<script>

/* =========================================================
   ENTRY FROM HOME
========================================================= */

if(
    sessionStorage.getItem(
        "phantomTransition"
    )
    ===
    "creator"
){

    document.body
        .classList
        .add(
            "from-home"
        );


    sessionStorage.removeItem(
        "phantomTransition"
    );

}


/* =========================================================
   CARD FLIP
========================================================= */

const card =
    document.getElementById(
        "creatorCard"
    );


card.addEventListener(
    "click",
    function(){

        card.classList.toggle(
            "flipped"
        );

    }
);


/* =========================================================
   CARD TILT
========================================================= */

const cardStage =
    document.querySelector(
        ".card-stage"
    );


cardStage.addEventListener(
    "mousemove",
    function(event){

        const rect =
            cardStage
            .getBoundingClientRect();


        const x =
            (
                event.clientX
                -
                rect.left
            )
            /
            rect.width
            -
            .5;


        const y =
            (
                event.clientY
                -
                rect.top
            )
            /
            rect.height
            -
            .5;


        card.style.setProperty(
            "--tilt-y",
            (x * 11)
            +
            "deg"
        );


        card.style.setProperty(
            "--tilt-x",
            (y * -9)
            +
            "deg"
        );

    }
);


cardStage.addEventListener(
    "mouseleave",
    function(){

        card.style.setProperty(
            "--tilt-x",
            "0deg"
        );


        card.style.setProperty(
            "--tilt-y",
            "0deg"
        );

    }
);


/* =========================================================
   PAGE EXIT
========================================================= */

let leaving =
    false;


document
.querySelectorAll(
    "[data-page]"
)
.forEach(
    function(link){

        link.addEventListener(
            "click",
            function(event){

                event.preventDefault();


                if(leaving){
                    return;
                }


                leaving =
                    true;


                document.body
                    .classList
                    .add(
                        "leaving"
                    );


                const target =
                    link.href;


                setTimeout(
                    function(){

                        location.href =
                            target;

                    },
                    480
                );

            }
        );

    }
);


/* =========================================================
   CURSOR
========================================================= */

const cursor =
    document.getElementById(
        "cursor"
    );


let mouseX = -100;
let mouseY = -100;

let cursorX = -100;
let cursorY = -100;

let lastTrail = 0;


document.addEventListener(
    "mousemove",
    function(event){

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;


        const now =
            performance.now();


        if(
            now - lastTrail > 46
            &&
            matchMedia(
                "(pointer:fine)"
            ).matches
        ){

            lastTrail =
                now;


            const particle =
                document.createElement(
                    "span"
                );


            particle.className =
                Math.random() > .6
                ?
                "trail red"
                :
                "trail";


            particle.style.left =
                mouseX
                +
                (
                    Math.random()
                    -
                    .5
                )
                *
                8
                +
                "px";


            particle.style.top =
                mouseY
                +
                (
                    Math.random()
                    -
                    .5
                )
                *
                8
                +
                "px";


            document.body.appendChild(
                particle
            );


            setTimeout(
                function(){

                    particle.remove();

                },
                520
            );

        }

    }
);


function cursorLoop(){

    cursorX +=
        (
            mouseX
            -
            cursorX
        )
        *
        .3;


    cursorY +=
        (
            mouseY
            -
            cursorY
        )
        *
        .3;


    cursor.style.left =
        cursorX
        +
        "px";


    cursor.style.top =
        cursorY
        +
        "px";


    requestAnimationFrame(
        cursorLoop
    );

}


cursorLoop();

</script>

</body>
</html>
