<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
    FEEDBACK | PHANTOM SEARCH
</title>


<style>

/* =========================================================
   PHANTOM SEARCH
   FEEDBACK PAGE
========================================================= */

:root{

    --red:#ef1023;
    --dark-red:#860711;

    --black:#050505;
    --black2:#0d0d0d;

    --white:#fffdf2;

    --yellow:#ffe600;
    --gold:#ffc928;

}


/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    width:100%;
    min-height:100%;

}


body{

    overflow:hidden;

    background:#050505;

    color:var(--white);

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;

    cursor:none;

}


/* =========================================================
   背景
========================================================= */

.feedback-bg{

    position:fixed;

    inset:0;

    z-index:0;

    background-image:
        url("assets/feedback-bg.png");

    background-size:cover;

    background-position:center center;

    background-repeat:no-repeat;

}


/*
    给左边表单区域稍微压暗
    防止背景太亮导致文字看不清
*/

.feedback-bg::after{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            90deg,

            rgba(0,0,0,.30) 0%,

            rgba(0,0,0,.12) 40%,

            transparent 62%
        );

    pointer-events:none;

}


/* =========================================================
   顶部导航
========================================================= */

.top-nav{

    position:fixed;

    top:24px;
    right:3vw;

    z-index:200;

    display:flex;

    gap:12px;

}


.top-nav a{

    text-decoration:none;

    color:#050505;

    background:#fffdf2;

    border:
        3px solid #050505;

    padding:
        9px 16px;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;

    font-weight:900;

    box-shadow:
        5px 5px 0 #050505;

    transform:
        skew(-7deg);

    transition:
        transform .18s ease,
        background .18s ease;

}


.top-nav a:first-child{

    background:
        var(--yellow);

}


.top-nav a:hover{

    background:
        var(--yellow);

    transform:
        skew(-7deg)
        translate(-3px,-3px);

}


/* =========================================================
   左侧 Feedback 主区域
========================================================= */

.feedback-panel{

    position:relative;

    z-index:20;

    width:min(
        760px,
        48vw
    );

    margin-left:5vw;

    padding-top:5.2vh;

}


/* =========================================================
   标题
========================================================= */

.feedback-title{

    position:relative;

    display:inline-block;

    margin-bottom:8px;

}


.feedback-title h1{

    margin:0;

    font-size:
        clamp(
            54px,
            5.5vw,
            92px
        );

    line-height:.8;

    letter-spacing:-.04em;

    color:var(--white);

    -webkit-text-stroke:
        3px #050505;

    text-shadow:
        7px 7px 0 #050505;

    transform:
        rotate(-2deg);

}


.feedback-title h1 span{

    color:var(--red);

}


.feedback-title .english{

    display:inline-block;

    margin-left:120px;

    margin-top:-5px;

    padding:
        4px 14px;

    background:
        var(--yellow);

    color:#050505;

    border:
        3px solid #050505;

    box-shadow:
        5px 5px 0 #050505;

    font-size:
        clamp(
            22px,
            2.2vw,
            38px
        );

    transform:
        rotate(-3deg);

}


/* =========================================================
   slogan
========================================================= */

.slogan{

    display:inline-block;

    margin:

        6px 0
        15px 100px;

    padding:
        7px 17px;

    background:
        var(--yellow);

    color:#050505;

    border:
        3px solid #050505;

    box-shadow:
        5px 5px 0 #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:14px;

    font-weight:900;

    transform:
        rotate(-1deg);

}


/* =========================================================
   表单大框
========================================================= */

.feedback-form{

    position:relative;

    padding:
        19px 22px 22px;

    background:
        rgba(3,3,3,.90);

    border:
        4px solid var(--red);

    box-shadow:

        9px 9px 0
        rgba(0,0,0,.78),

        inset
        0 0 0
        2px
        rgba(255,255,255,.05);

    clip-path:
        polygon(
            1% 0,
            98% 2%,
            100% 95%,
            96% 100%,
            2% 98%,
            0 5%
        );

}


/* 红色装饰角 */

.feedback-form::before{

    content:"";

    position:absolute;

    left:-18px;
    top:25%;

    width:7px;
    height:40%;

    background:
        var(--yellow);

    transform:
        rotate(2deg);

}


/* =========================================================
   表单标签
========================================================= */

.field{

    position:relative;

    margin-bottom:14px;

}


.field-label{

    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:8px;

}


.cn-label{

    display:inline-block;

    padding:
        5px 11px;

    background:
        var(--white);

    color:#050505;

    border:
        2px solid #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;

    font-weight:900;

    transform:
        rotate(-1deg);

}


.en-label{

    color:
        var(--red);

    font-size:11px;

    letter-spacing:.08em;

}


/* =========================================================
   反馈类型
========================================================= */

.type-options{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

}


.type-option{

    position:relative;

}


.type-option input{

    position:absolute;

    opacity:0;

    pointer-events:none;

}


.type-option label{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    min-height:46px;

    padding:
        8px 10px;

    background:
        #111;

    color:white;

    border:
        3px solid #fff;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;

    font-weight:900;

    cursor:none;

    transition:
        transform .15s ease,
        background .15s ease,
        color .15s ease,
        box-shadow .15s ease;

}


.type-option label:hover{

    transform:
        translateY(-3px)
        rotate(-1deg);

    border-color:
        var(--yellow);

}


.type-option input:checked + label{

    background:
        var(--yellow);

    color:#050505;

    border-color:
        var(--red);

    box-shadow:
        5px 5px 0
        var(--red);

    transform:
        translate(-2px,-2px)
        rotate(-1deg);

}


.type-icon{

    font-size:19px;

}


/* =========================================================
   Textarea
========================================================= */

.textarea-wrap{

    position:relative;

    overflow:hidden;

}


textarea{

    display:block;

    width:100%;

    height:118px;

    resize:none;

    padding:
        14px 15px
        28px;

    outline:none;

    border:
        3px solid #fff;

    background:
        rgba(15,15,15,.96);

    color:white;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:13px;

    line-height:1.65;

    cursor:text;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;

}


textarea:focus{

    border-color:
        var(--yellow);

    box-shadow:

        0 0 0 3px
        var(--red),

        0 0 20px
        rgba(255,230,0,.20);

}


/* 扫描光 */

.scan-line{

    position:absolute;

    left:-100%;

    top:0;

    width:60%;
    height:100%;

    pointer-events:none;

    background:

        linear-gradient(
            90deg,

            transparent,

            rgba(255,230,0,.08),

            rgba(255,255,255,.13),

            transparent
        );

    transform:
        skewX(-20deg);

}


.textarea-wrap.focused
.scan-line{

    animation:
        scanInput
        1.2s
        ease-out;

}


@keyframes scanInput{

    from{
        left:-100%;
    }

    to{
        left:160%;
    }

}


/* =========================================================
   字数
========================================================= */

.char-count{

    position:absolute;

    right:10px;
    bottom:7px;

    color:
        rgba(255,255,255,.55);

    font-family:
        Arial,
        sans-serif;

    font-size:10px;

}


/* =========================================================
   星级
========================================================= */

.rating-row{

    display:flex;

    align-items:center;

    gap:7px;

    min-height:48px;

}


.star{

    position:relative;

    padding:0;

    border:0;

    outline:none;

    background:none;

    color:white;

    font-size:
        39px;

    line-height:1;

    cursor:none;

    -webkit-text-stroke:
        2px #050505;

    text-shadow:
        2px 2px 0 #050505;

    transition:
        transform .15s ease,
        color .15s ease;

}


.star:hover{

    transform:
        scale(1.22)
        rotate(-10deg);

}


.star.active{

    color:
        var(--yellow);

    transform:
        scale(1.12);

    text-shadow:

        2px 2px 0 #050505,

        0 0 13px
        rgba(255,230,0,.7);

}


.rating-text{

    margin-left:8px;

    color:
        rgba(255,255,255,.65);

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:11px;

    font-weight:700;

}


/* =========================================================
   联系方式
========================================================= */

.contact-wrap{

    position:relative;

}


.contact-input{

    width:100%;

    height:43px;

    padding:
        0 13px;

    outline:none;

    background:
        #101010;

    color:white;

    border:
        3px solid white;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:12px;

    cursor:text;

    transition:
        border .2s ease,
        box-shadow .2s ease;

}


.contact-input:focus{

    border-color:
        var(--yellow);

    box-shadow:
        0 0 0 3px
        var(--red);

}


/* =========================================================
   提交按钮
========================================================= */

.submit-wrap{

    display:flex;

    justify-content:center;

    margin-top:17px;

}


.submit-button{

    position:relative;

    min-width:310px;

    padding:
        14px 42px;

    border:
        4px solid #050505;

    outline:none;

    background:
        var(--yellow);

    color:#050505;

    font-family:
        Impact,
        "Arial Black",
        "Microsoft YaHei",
        sans-serif;

    font-size:25px;

    font-weight:900;

    letter-spacing:.03em;

    box-shadow:

        8px 8px 0
        var(--red),

        12px 12px 0
        #050505;

    transform:
        skew(-8deg);

    cursor:none;

    transition:
        transform .16s ease,
        box-shadow .16s ease;

}


.submit-button span{

    display:inline-block;

    transform:
        skew(8deg);

}


.submit-button:hover{

    transform:
        skew(-8deg)
        translate(-4px,-4px);

    box-shadow:

        12px 12px 0
        var(--red),

        16px 16px 0
        #050505;

}


.submit-button:active{

    transform:
        skew(-8deg)
        translate(3px,3px);

}


.submit-button:disabled{

    opacity:.65;

}


/* =========================================================
   表单状态
========================================================= */

.form-status{

    min-height:20px;

    margin-top:15px;

    text-align:center;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:11px;

    font-weight:900;

}


.form-status.error{

    color:
        #ff5362;

}


.form-status.sending{

    color:
        var(--yellow);

}


/* =========================================================
   背景动态星芒
========================================================= */

.spark{

    position:fixed;

    z-index:8;

    width:15px;
    height:15px;

    pointer-events:none;

    background:
        var(--yellow);

    clip-path:

        polygon(
            50% 0,
            61% 39%,
            100% 50%,
            61% 61%,
            50% 100%,
            39% 61%,
            0 50%,
            39% 39%
        );

    filter:
        drop-shadow(
            0 0 6px
            var(--yellow)
        );

    animation:
        sparkPulse
        2.4s
        ease-in-out
        infinite;

}


.spark.s1{

    left:52%;
    top:27%;

}


.spark.s2{

    left:88%;
    top:42%;

    animation-delay:
        .7s;

}


.spark.s3{

    left:58%;
    top:67%;

    animation-delay:
        1.4s;

}


.spark.s4{

    left:94%;
    top:70%;

    animation-delay:
        .35s;

}


@keyframes sparkPulse{

    0%,
    100%{

        opacity:.2;

        transform:
            scale(.5)
            rotate(0deg);

    }

    50%{

        opacity:1;

        transform:
            scale(1.8)
            rotate(90deg);

    }

}


/* =========================================================
   漂浮碎片
========================================================= */

.shard{

    position:fixed;

    z-index:7;

    pointer-events:none;

    width:90px;
    height:14px;

    background:
        var(--red);

    opacity:.4;

    clip-path:
        polygon(
            0 40%,
            100% 0,
            84% 100%,
            8% 75%
        );

    animation:
        shardFloat
        6s
        ease-in-out
        infinite;

}


.shard.a{

    left:45%;
    top:14%;

    transform:
        rotate(-25deg);

}


.shard.b{

    right:3%;
    bottom:15%;

    animation-delay:
        2s;

}


.shard.c{

    left:55%;
    bottom:6%;

    width:130px;

    animation-delay:
        3.5s;

}


@keyframes shardFloat{

    0%,
    100%{

        opacity:.2;

        translate:
            0 0;

    }

    50%{

        opacity:.65;

        translate:
            10px -12px;

    }

}


/* =========================================================
   鼠标
========================================================= */

.cursor{

    position:fixed;

    left:0;
    top:0;

    width:30px;
    height:30px;

    z-index:9999;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    transition:
        width .16s ease,
        height .16s ease;

}


.cursor::before{

    content:"";

    position:absolute;

    inset:3px;

    border:
        2px solid
        var(--yellow);

    border-radius:50%;

    box-shadow:
        0 0 8px
        rgba(255,230,0,.8);

    animation:
        cursorSpin
        2.2s
        linear
        infinite;

}


.cursor::after{

    content:"✦";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-53%);

    color:
        var(--yellow);

    font-size:16px;

    text-shadow:
        0 0 7px red;

}


@keyframes cursorSpin{

    to{

        transform:
            rotate(360deg);

    }

}


body.interactive
.cursor{

    width:48px;
    height:48px;

}


body.interactive
.cursor::before{

    border-color:
        var(--red);

    box-shadow:

        0 0 0 3px
        rgba(255,230,0,.25),

        0 0 15px
        rgba(239,16,35,.8);

}


/* =========================================================
   鼠标粒子
========================================================= */

.trail{

    position:fixed;

    width:8px;
    height:8px;

    z-index:9998;

    pointer-events:none;

    background:
        var(--yellow);

    clip-path:

        polygon(
            50% 0,
            65% 35%,
            100% 50%,
            65% 65%,
            50% 100%,
            35% 65%,
            0 50%,
            35% 35%
        );

    animation:
        trailFade
        .52s
        linear
        forwards;

}


.trail.red{

    background:
        var(--red);

}


@keyframes trailFade{

    0%{

        opacity:.95;

        transform:

            translate(-50%,-50%)
            scale(1)
            rotate(0deg);

    }


    100%{

        opacity:0;

        transform:

            translate(-50%,-50%)
            scale(.1)
            rotate(150deg);

    }

}


/* =========================================================
   星级点击粒子
========================================================= */

.rating-particle{

    position:fixed;

    z-index:9990;

    width:8px;
    height:8px;

    pointer-events:none;

    background:
        var(--yellow);

    clip-path:

        polygon(
            50% 0,
            62% 38%,
            100% 50%,
            62% 62%,
            50% 100%,
            38% 62%,
            0 50%,
            38% 38%
        );

    animation:
        ratingParticle
        .65s
        ease-out
        forwards;

}


@keyframes ratingParticle{

    from{

        opacity:1;

        transform:

            translate(
                0,
                0
            )
            scale(1);

    }


    to{

        opacity:0;

        transform:

            translate(
                var(--dx),
                var(--dy)
            )
            scale(.1)
            rotate(180deg);

    }

}


/* =========================================================
   提交冲击波
========================================================= */

.submit-wave{

    position:fixed;

    left:50%;
    top:50%;

    width:100px;
    height:100px;

    z-index:10001;

    pointer-events:none;

    border:
        8px solid
        var(--yellow);

    border-radius:50%;

    transform:

        translate(-50%,-50%)
        scale(.1);

    animation:
        submitWave
        .7s
        ease-out
        forwards;

}


@keyframes submitWave{

    0%{

        opacity:1;

        transform:

            translate(-50%,-50%)
            scale(.1);

    }


    100%{

        opacity:0;

        transform:

            translate(-50%,-50%)
            scale(18);

    }

}


/* =========================================================
   THANKS 成功画面
========================================================= */

.success-screen{

    position:fixed;

    inset:0;

    z-index:9000;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;

    opacity:0;

    visibility:hidden;

    background:
        rgba(0,0,0,.70);

    transition:
        opacity .25s ease;

}


.success-screen.show{

    opacity:1;

    visibility:visible;

    pointer-events:auto;

}


.success-content{

    position:relative;

    text-align:center;

    padding:
        50px 70px;

    background:
        var(--red);

    border:
        6px solid #050505;

    box-shadow:

        15px 15px 0
        var(--yellow),

        23px 23px 0
        #050505;

    transform:
        rotate(-3deg)
        scale(.7);

}


.success-screen.show
.success-content{

    animation:
        successPop
        .55s
        cubic-bezier(.2,1.5,.3,1)
        forwards;

}


@keyframes successPop{

    to{

        transform:
            rotate(-3deg)
            scale(1);

    }

}


.success-content::before{

    content:"MISSION COMPLETE";

    position:absolute;

    top:-25px;
    left:30px;

    padding:
        6px 14px;

    background:
        var(--yellow);

    color:#050505;

    border:
        3px solid #050505;

    font-size:13px;

    transform:
        rotate(3deg);

}


.success-content h2{

    margin:0;

    color:white;

    font-size:
        clamp(
            45px,
            6vw,
            95px
        );

    line-height:.83;

    -webkit-text-stroke:
        3px #050505;

    text-shadow:
        7px 7px 0 #050505;

}


.success-content h2 span{

    color:
        var(--yellow);

}


.success-content p{

    margin:
        25px 0 0;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-size:15px;

    font-weight:900;

}


.success-close{

    margin-top:24px;

    padding:
        10px 25px;

    border:
        3px solid #050505;

    background:
        var(--yellow);

    color:#050505;

    box-shadow:
        5px 5px 0 #050505;

    font-family:
        "Microsoft YaHei",
        sans-serif;

    font-weight:900;

    cursor:none;

}


/* =========================================================
   页面切换动画
========================================================= */

.transition{

    position:fixed;

    inset:0;

    z-index:10000;

    background:
        var(--red);

    pointer-events:none;

    opacity:0;

    clip-path:

        polygon(
            0 100%,
            100% 100%,
            100% 100%,
            0 100%
        );

    transition:

        opacity .12s,

        clip-path
        .48s
        cubic-bezier(
            .77,
            0,
            .18,
            1
        );

}


body.leaving
.transition{

    opacity:1;

    clip-path:

        polygon(
            0 0,
            100% 7%,
            100% 100%,
            0 93%
        );

}


/* =========================================================
   小屏幕
========================================================= */

@media(
    max-width:1100px
){

    .feedback-panel{

        width:
            52vw;

        margin-left:
            3vw;

    }


    .feedback-title h1{

        font-size:
            60px;

    }


    .submit-button{

        min-width:
            250px;

    }

}


@media(
    max-width:760px
){

    body{

        overflow:auto;

        cursor:auto;

    }


    .feedback-bg{

        background-position:
            63% center;

    }


    .feedback-bg::after{

        background:
            rgba(0,0,0,.68);

    }


    .feedback-panel{

        width:92%;

        margin:
            0 auto;

        padding:

            100px
            0
            60px;

    }


    .feedback-title h1{

        font-size:
            58px;

    }


    .feedback-title
    .english{

        margin-left:
            30px;

    }


    .slogan{

        margin-left:
            20px;

    }


    .type-options{

        grid-template-columns:
            1fr;

    }


    .cursor{

        display:none;

    }


    .top-nav{

        top:12px;
        right:12px;

    }


    .top-nav a{

        padding:
            7px 10px;

        font-size:
            11px;

    }


    .success-content{

        width:86%;

        padding:
            40px 20px;

    }

}


/* =========================================================
   减少动画
========================================================= */

@media(
    prefers-reduced-motion:reduce
){

    *,
    *::before,
    *::after{

        animation:none!important;

        transition:none!important;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     背景
===================================================== -->

<div class="feedback-bg"></div>


<!-- 背景动态装饰 -->

<div class="spark s1"></div>
<div class="spark s2"></div>
<div class="spark s3"></div>
<div class="spark s4"></div>

<div class="shard a"></div>
<div class="shard b"></div>
<div class="shard c"></div>


<!-- 页面转场 -->

<div class="transition"></div>


<!-- =====================================================
     顶部导航
===================================================== -->

<nav class="top-nav">

    <a
        href="index.html"
        data-transition
        class="interactive"
    >
        返回搜索
    </a>


    <a
        href="creator.html"
        data-transition
        class="interactive"
    >
        创作者信息
    </a>

</nav>


<!-- =====================================================
     Feedback 主区域
===================================================== -->

<main class="feedback-panel">


    <!-- 标题 -->

    <header class="feedback-title">

        <h1>

            意见<span>反馈</span>

        </h1>


        <div class="english">

            FEEDBACK

        </div>

    </header>


    <div class="slogan">

        你的反馈，是我们的行动力！

    </div>


    <!-- =================================================
         真正反馈表单
    ================================================== -->

    <form
        class="feedback-form"
        id="feedbackForm"
    >


        <!-- ============================
             Feedback 类型
        ============================= -->

        <div class="field">


            <div class="field-label">

                <span class="cn-label">

                    反馈类型

                </span>

                <span class="en-label">

                    TYPE

                </span>

            </div>


            <div class="type-options">


                <div class="type-option">

                    <input
                        type="radio"
                        id="typeFeature"
                        name="feedback_type"
                        value="功能建议"
                        checked
                    >

                    <label
                        for="typeFeature"
                        class="interactive"
                    >

                        <span class="type-icon">
                            ✦
                        </span>

                        功能建议

                    </label>

                </div>


                <div class="type-option">

                    <input
                        type="radio"
                        id="typeBug"
                        name="feedback_type"
                        value="问题反馈"
                    >

                    <label
                        for="typeBug"
                        class="interactive"
                    >

                        <span class="type-icon">
                            ⚠
                        </span>

                        问题反馈

                    </label>

                </div>


                <div class="type-option">

                    <input
                        type="radio"
                        id="typeOther"
                        name="feedback_type"
                        value="其他"
                    >

                    <label
                        for="typeOther"
                        class="interactive"
                    >

                        <span class="type-icon">
                            ◆
                        </span>

                        其他

                    </label>

                </div>


            </div>

        </div>


        <!-- ============================
             详细描述
        ============================= -->

        <div class="field">


            <div class="field-label">

                <span class="cn-label">

                    详细描述

                </span>

                <span class="en-label">

                    DETAIL

                </span>

            </div>


            <div
                class="textarea-wrap"
                id="textareaWrap"
            >

                <textarea
                    id="message"
                    name="message"
                    maxlength="500"
                    required
                    placeholder="告诉我你对 PHANTOM SEARCH 的想法……"
                ></textarea>


                <div class="scan-line"></div>


                <div class="char-count">

                    <span id="charCount">
                        0
                    </span>

                    / 500

                </div>

            </div>

        </div>


        <!-- ============================
             满意度
        ============================= -->

        <div class="field">


            <div class="field-label">

                <span class="cn-label">

                    满意度

                </span>

                <span class="en-label">

                    RATING

                </span>

            </div>


            <div class="rating-row">


                <button
                    type="button"
                    class="star interactive"
                    data-value="1"
                >
                    ★
                </button>


                <button
                    type="button"
                    class="star interactive"
                    data-value="2"
                >
                    ★
                </button>


                <button
                    type="button"
                    class="star interactive"
                    data-value="3"
                >
                    ★
                </button>


                <button
                    type="button"
                    class="star interactive"
                    data-value="4"
                >
                    ★
                </button>


                <button
                    type="button"
                    class="star interactive"
                    data-value="5"
                >
                    ★
                </button>


                <span
                    class="rating-text"
                    id="ratingText"
                >

                    点击星星进行评分

                </span>


                <input
                    type="hidden"
                    name="rating"
                    id="ratingInput"
                    value=""
                >


            </div>

        </div>


        <!-- ============================
             联系方式
        ============================= -->

        <div class="field">


            <div class="field-label">

                <span class="cn-label">

                    联系方式

                </span>

                <span class="en-label">

                    CONTACT（可选）

                </span>

            </div>


            <div class="contact-wrap">

                <input
                    type="text"
                    class="contact-input"
                    name="contact"
                    maxlength="120"
                    placeholder="例如：邮箱 / 社交账号（可选）"
                >

            </div>

        </div>


        <!-- ============================
             提交
        ============================= -->

        <div class="submit-wrap">

            <button
                type="submit"
                class="submit-button interactive"
                id="submitButton"
            >

                <span>

                    提交反馈 ➤

                </span>

            </button>

        </div>


        <div
            class="form-status"
            id="formStatus"
        ></div>


    </form>


</main>


<!-- =====================================================
     成功页面
===================================================== -->

<div
    class="success-screen"
    id="successScreen"
>


    <div class="success-content">


        <h2>

            THANKS
            <br>

            <span>
                FOR YOUR
            </span>

            <br>

            FEEDBACK!

        </h2>


        <p>

            反馈已成功送达。
            <br>
            感谢你帮助 PHANTOM SEARCH 变得更好。

        </p>


        <button
            class="success-close interactive"
            id="successClose"
            type="button"
        >

            RETURN ↩

        </button>


    </div>


</div>


<!-- 自定义鼠标 -->

<div
    class="cursor"
    id="cursor"
></div>



<script>

/* =========================================================
   DOM
========================================================= */

const form =
    document.getElementById(
        "feedbackForm"
    );


const message =
    document.getElementById(
        "message"
    );


const charCount =
    document.getElementById(
        "charCount"
    );


const textareaWrap =
    document.getElementById(
        "textareaWrap"
    );


const stars =
    document.querySelectorAll(
        ".star"
    );


const ratingInput =
    document.getElementById(
        "ratingInput"
    );


const ratingText =
    document.getElementById(
        "ratingText"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const formStatus =
    document.getElementById(
        "formStatus"
    );


const successScreen =
    document.getElementById(
        "successScreen"
    );


const successClose =
    document.getElementById(
        "successClose"
    );


const cursor =
    document.getElementById(
        "cursor"
    );


/* =========================================================
   500 字计数
========================================================= */

message.addEventListener(
    "input",
    function(){

        charCount.textContent =
            message.value.length;

    }
);


/* =========================================================
   输入框扫描光
========================================================= */

message.addEventListener(
    "focus",
    function(){

        textareaWrap
            .classList
            .remove(
                "focused"
            );


        void textareaWrap.offsetWidth;


        textareaWrap
            .classList
            .add(
                "focused"
            );

    }
);


/* =========================================================
   五星评分
========================================================= */

let currentRating = 0;


stars.forEach(

    star => {

        star.addEventListener(
            "mouseenter",
            function(){

                const value =
                    Number(
                        this.dataset.value
                    );


                previewRating(
                    value
                );

            }
        );


        star.addEventListener(
            "mouseleave",
            function(){

                updateRatingDisplay(
                    currentRating
                );

            }
        );


        star.addEventListener(
            "click",
            function(e){

                currentRating =
                    Number(
                        this.dataset.value
                    );


                ratingInput.value =
                    currentRating;


                updateRatingDisplay(
                    currentRating
                );


                createRatingBurst(
                    e.clientX,
                    e.clientY
                );

            }
        );

    }

);


/* =========================================================
   预览星级
========================================================= */

function previewRating(value){

    stars.forEach(

        star => {

            const starValue =
                Number(
                    star.dataset.value
                );


            star.classList.toggle(
                "active",
                starValue <= value
            );

        }

    );

}


/* =========================================================
   正式星级显示
========================================================= */

function updateRatingDisplay(value){

    stars.forEach(

        star => {

            const starValue =
                Number(
                    star.dataset.value
                );


            star.classList.toggle(
                "active",
                starValue <= value
            );

        }

    );


    if(value === 0){

        ratingText.textContent =
            "点击星星进行评分";

    }else{

        ratingText.textContent =
            value + " / 5";

    }

}


/* =========================================================
   星星爆炸粒子
========================================================= */

function createRatingBurst(x,y){

    for(
        let i = 0;
        i < 12;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "rating-particle";


        particle.style.left =
            x + "px";


        particle.style.top =
            y + "px";


        const angle =
            Math.random()
            *
            Math.PI
            *
            2;


        const distance =
            25
            +
            Math.random()
            *
            55;


        const dx =
            Math.cos(angle)
            *
            distance;


        const dy =
            Math.sin(angle)
            *
            distance;


        particle.style.setProperty(
            "--dx",
            dx + "px"
        );


        particle.style.setProperty(
            "--dy",
            dy + "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            () => {

                particle.remove();

            },
            700
        );

    }

}


/* =========================================================
   表单提交
========================================================= */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        /* -----------------------------
           检查反馈内容
        ----------------------------- */

        if(
            message.value.trim().length < 3
        ){

            showError(
                "请先写下你的反馈内容。"
            );

            message.focus();

            return;

        }


        /* -----------------------------
           检查评分
        ----------------------------- */

        if(
            currentRating === 0
        ){

            showError(
                "请先选择 1–5 星满意度。"
            );

            return;

        }


        /* -----------------------------
           开始发送
        ----------------------------- */

        submitButton.disabled =
            true;


        submitButton
            .querySelector("span")
            .textContent =
                "正在发送……";


        formStatus.className =
            "form-status sending";


        formStatus.textContent =
            "正在把反馈发送给 PHANTOM SEARCH……";


        const formData =
            new FormData(form);


        /*
            邮件主题
        */

        formData.append(
            "_subject",
            "PHANTOM SEARCH - New Feedback"
        );


        /*
            表格形式邮件
        */

        formData.append(
            "_template",
            "table"
        );


        /*
            防止机器人常见字段
        */

        formData.append(
            "_captcha",
            "true"
        );


        try{


            const response =
                await fetch(

                    "https://formsubmit.co/ajax/Henrychen2008@hotmail.com",

                    {

                        method:"POST",

                        headers:{

                            "Accept":
                                "application/json"

                        },

                        body:
                            formData

                    }

                );


            if(
                !response.ok
            ){

                throw new Error(
                    "HTTP "
                    +
                    response.status
                );

            }


            const result =
                await response.json();


            /*
                FormSubmit 返回 success
            */

            if(
                result.success === true
                ||
                result.success === "true"
            ){

                submitSuccess();

            }else{

                throw new Error(
                    "Submit failed"
                );

            }


        }catch(error){


            console.error(
                error
            );


            showError(
                "暂时没有发送成功，请稍后再试。"
            );


            submitButton.disabled =
                false;


            submitButton
                .querySelector("span")
                .textContent =
                    "提交反馈 ➤";

        }

    }
);


/* =========================================================
   提交成功
========================================================= */

function submitSuccess(){

    createSubmitWave();


    setTimeout(
        () => {

            successScreen
                .classList
                .add(
                    "show"
                );

        },
        180
    );


    /*
        清空表单
    */

    form.reset();


    currentRating = 0;


    ratingInput.value =
        "";


    updateRatingDisplay(
        0
    );


    charCount.textContent =
        "0";


    formStatus.textContent =
        "";


    formStatus.className =
        "form-status";


    submitButton.disabled =
        false;


    submitButton
        .querySelector("span")
        .textContent =
            "提交反馈 ➤";

}


/* =========================================================
   错误提示
========================================================= */

function showError(text){

    formStatus.className =
        "form-status error";


    formStatus.textContent =
        text;

}


/* =========================================================
   成功冲击波
========================================================= */

function createSubmitWave(){

    const wave =
        document.createElement(
            "div"
        );


    wave.className =
        "submit-wave";


    document.body.appendChild(
        wave
    );


    setTimeout(
        () => {

            wave.remove();

        },
        800
    );

}


/* =========================================================
   关闭成功画面
========================================================= */

successClose.addEventListener(
    "click",
    function(){

        successScreen
            .classList
            .remove(
                "show"
            );

    }
);


/* =========================================================
   自定义鼠标
========================================================= */

let mouseX = -100;
let mouseY = -100;

let cursorX = -100;
let cursorY = -100;


document.addEventListener(
    "mousemove",
    function(e){

        mouseX =
            e.clientX;


        mouseY =
            e.clientY;


        createTrail(
            mouseX,
            mouseY
        );

    }
);


/* =========================================================
   鼠标惯性
========================================================= */

function animateCursor(){

    cursorX +=
        (
            mouseX
            -
            cursorX
        )
        *
        .32;


    cursorY +=
        (
            mouseY
            -
            cursorY
        )
        *
        .32;


    cursor.style.left =
        cursorX
        +
        "px";


    cursor.style.top =
        cursorY
        +
        "px";


    requestAnimationFrame(
        animateCursor
    );

}


animateCursor();


/* =========================================================
   鼠标拖尾
========================================================= */

let lastTrail = 0;


function createTrail(x,y){

    const now =
        performance.now();


    if(
        now
        -
        lastTrail
        <
        38
    ){

        return;

    }


    lastTrail =
        now;


    const particle =
        document.createElement(
            "div"
        );


    particle.className =
        Math.random() > .55
        ?
        "trail red"
        :
        "trail";


    const offsetX =
        (
            Math.random()
            -
            .5
        )
        *
        12;


    const offsetY =
        (
            Math.random()
            -
            .5
        )
        *
        12;


    particle.style.left =
        x
        +
        offsetX
        +
        "px";


    particle.style.top =
        y
        +
        offsetY
        +
        "px";


    const size =
        5
        +
        Math.random()
        *
        6;


    particle.style.width =
        size
        +
        "px";


    particle.style.height =
        size
        +
        "px";


    document.body.appendChild(
        particle
    );


    setTimeout(
        () => {

            particle.remove();

        },
        550
    );

}


/* =========================================================
   Interactive Hover
========================================================= */

document
.querySelectorAll(
    ".interactive"
)
.forEach(

    element => {

        element.addEventListener(
            "mouseenter",
            function(){

                document.body
                    .classList
                    .add(
                        "interactive"
                    );

            }
        );


        element.addEventListener(
            "mouseleave",
            function(){

                document.body
                    .classList
                    .remove(
                        "interactive"
                    );

            }
        );

    }

);


/* =========================================================
   页面转场
========================================================= */

document
.querySelectorAll(
    "[data-transition]"
)
.forEach(

    link => {

        link.addEventListener(
            "click",
            function(e){

                e.preventDefault();


                const target =
                    this.href;


                document.body
                    .classList
                    .add(
                        "leaving"
                    );


                setTimeout(
                    () => {

                        window.location.href =
                            target;

                    },
                    480
                );

            }
        );

    }

);

</script>


</body>

</html>
