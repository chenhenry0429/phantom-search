<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PHANTOM FEEDBACK</title>


<style>

:root{
--r:#ef1023;
--b:#070707;
--w:#fffdf2;
--y:#ffe600;
}


*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

color:var(--w);

font-family:
Impact,
"Arial Black",
"Microsoft YaHei",
sans-serif;


background:

radial-gradient(circle,
rgba(0,0,0,.7)
0 1.3px,
transparent 1.5px)
0 0/10px 10px,

var(--r);


overflow:hidden;

}



body:before{

content:"";

position:fixed;

inset:0;

opacity:.18;

background:

repeating-linear-gradient(
105deg,
transparent 0 34px,
#fff 35px 37px,
transparent 38px 72px
);

}



/* 顶部按钮 */


.top{

position:absolute;

top:25px;

right:4vw;

display:flex;

gap:14px;

}



.top a{

color:var(--b);

background:var(--w);

border:3px solid var(--b);

padding:9px 16px;

box-shadow:4px 4px 0 var(--b);

text-decoration:none;

}



/* 主体 */


main{

min-height:100vh;

display:grid;

place-items:center;

padding:80px 20px;

}



.stage{

width:min(700px,100%);

text-align:center;

}



.stamp{

display:inline-block;

background:var(--y);

color:var(--b);

border:4px solid var(--b);

padding:8px 15px;

box-shadow:5px 5px 0 var(--b);

transform:rotate(-2deg);

}



h1{

font-size:80px;

line-height:.85;

margin:30px 0;

text-shadow:8px 8px 0 var(--b);

}



h1 span{

color:var(--r);

background:var(--w);

}



.card{

background:rgba(0,0,0,.75);

border:5px solid var(--b);

padding:25px;

box-shadow:8px 8px 0 var(--b);

}



input,
textarea,
select{

width:100%;

padding:14px;

margin:8px 0;

font-family:"Microsoft YaHei";

border:4px solid var(--b);

}



textarea{

height:120px;

}



button{

background:var(--y);

border:4px solid var(--b);

padding:12px 35px;

font-size:18px;

font-weight:bold;

cursor:pointer;

box-shadow:4px 4px 0 var(--b);

}



/* 人影 */


.phantom{

position:fixed;

left:30px;

bottom:40px;

animation:f 3s infinite;

}



.head{

width:35px;

height:35px;

background:white;

border-radius:50%;

border:5px solid black;

}



.body{

width:45px;

height:70px;

background:black;

clip-path:polygon(
30% 0,
70% 0,
100% 100%,
0 100%
);

}



@keyframes f{

50%{

transform:translateY(-10px);

}

}



.feedback{

margin-top:30px;

font-family:"Microsoft YaHei";

}



.item{

background:black;

padding:15px;

margin:10px;

border:3px solid white;

text-align:left;

}



</style>


</head>



<body>



<header class="top">

<a href="index.html">
返回搜索
</a>


<a href="creator.html">
创作者信息
</a>

</header>



<div class="phantom">

<div class="head"></div>

<div class="body"></div>

</div>




<main>


<div class="stage">


<div class="stamp">
FEEDBACK CENTER
</div>



<h1>

PHANTOM

<br>

<span>
FEEDBACK
</span>

</h1>



<div class="card">


<input id="name"
placeholder="你的昵称">


<select id="type">

<option>
功能建议
</option>

<option>
Bug反馈
</option>

<option>
设计建议
</option>

<option>
其他
</option>

</select>



<textarea
id="msg"
placeholder="告诉创造者你的想法">
</textarea>



<button onclick="send()">

提交反馈

</button>


</div>



<div class="feedback" id="list">

<h2>
最新反馈
</h2>

</div>



</div>


</main>



<script>


function send(){


let name=
document.getElementById("name").value
||
"匿名用户";


let msg=
document.getElementById("msg").value;



if(!msg){

alert("请输入反馈内容");

return;

}



let box=
document.getElementById("list");



box.innerHTML+=`

<div class="item">

👤 ${name}

<br><br>

${msg}

<br><br>

🟡 等待查看

</div>

`;


document.getElementById("msg").value="";


}



</script>


</body>

</html>
