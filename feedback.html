<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEEDBACK | PHANTOM SEARCH</title>

<style>
:root{
    --red:#ef1023;
    --darkred:#8d0711;
    --black:#050505;
    --white:#fffdf2;
    --yellow:#ffe600;
    --gold:#ffc928;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    overflow:hidden;
    background:#050505;
    color:var(--white);
    font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;
    cursor:none;
}

/* =========================================================
   BACKGROUND
========================================================= */

.feedback-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:url("assets/feedback-bg.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
}

.feedback-bg::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.15) 0%,
            rgba(0,0,0,.08) 40%,
            transparent 60%
        );
}

/* =========================================================
   NAVIGATION
========================================================= */

.top-nav{
    position:fixed;
    top:24px;
    right:3vw;
    z-index:200;
    display:flex;
    gap:12px;
}

.top-nav a{
    padding:9px 16px;
    text-decoration:none;
    color:#050505;
    background:#fffdf2;
    border:3px solid #050505;
    box-shadow:5px 5px 0 #050505;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:13px;
    font-weight:900;
    transform:skew(-7deg);
    transition:.18s ease;
}

.top-nav a:first-child{
    background:var(--yellow);
}

.top-nav a:hover{
    background:var(--yellow);
    transform:skew(-7deg) translate(-3px,-3px);
}

/* =========================================================
   LEFT CONTENT
========================================================= */

.feedback-panel{
    position:relative;
    z-index:20;
    width:min(720px,46vw);
    margin-left:4.5vw;
    padding-top:4.2vh;
}

/* =========================================================
   TITLE
========================================================= */

.feedback-title{
    position:relative;
    display:inline-block;
    margin-bottom:2px;
}

.feedback-title h1{
    margin:0;
    font-size:clamp(52px,5vw,88px);
    line-height:.82;
    letter-spacing:-.05em;
    color:var(--white);
    -webkit-text-stroke:3px #050505;
    text-shadow:7px 7px 0 #050505;
    transform:rotate(-2deg);
}

.feedback-title h1 span{
    color:var(--red);
}

.feedback-title .english{
    display:inline-block;
    margin-left:115px;
    margin-top:-5px;
    padding:3px 14px;
    background:var(--yellow);
    color:#050505;
    border:3px solid #050505;
    box-shadow:5px 5px 0 #050505;
    font-size:clamp(20px,2vw,34px);
    transform:rotate(-3deg);
}

.slogan{
    display:inline-block;
    margin:5px 0 12px 90px;
    padding:6px 15px;
    color:#050505;
    background:var(--yellow);
    border:3px solid #050505;
    box-shadow:5px 5px 0 #050505;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:13px;
    font-weight:900;
    transform:rotate(-1deg);
}

/* =========================================================
   FORM
========================================================= */

.feedback-form{
    position:relative;
    padding:16px 20px 18px;
    background:rgba(3,3,3,.91);
    border:4px solid var(--red);
    box-shadow:
        9px 9px 0 rgba(0,0,0,.8),
        inset 0 0 0 2px rgba(255,255,255,.04);

    clip-path:polygon(
        1% 0,
        98% 2%,
        100% 95%,
        96% 100%,
        2% 98%,
        0 5%
    );
}

.feedback-form::before{
    content:"";
    position:absolute;
    left:-16px;
    top:24%;
    width:7px;
    height:45%;
    background:var(--yellow);
    transform:rotate(2deg);
}

.field{
    position:relative;
    margin-bottom:12px;
}

.field-label{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
}

.cn-label{
    display:inline-block;
    padding:4px 10px;
    color:#050505;
    background:var(--white);
    border:2px solid #050505;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:11px;
    font-weight:900;
    transform:rotate(-1deg);
}

.en-label{
    color:var(--red);
    font-size:10px;
    letter-spacing:.08em;
}

/* =========================================================
   TYPE
========================================================= */

.type-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.type-option{
    position:relative;
}

.type-option input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.type-option label{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    min-height:42px;
    padding:7px 9px;
    color:white;
    background:#111;
    border:3px solid white;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:12px;
    font-weight:900;
    cursor:none;
    transition:.15s ease;
}

.type-option label:hover{
    border-color:var(--yellow);
    transform:translateY(-3px) rotate(-1deg);
}

.type-option input:checked + label{
    color:#050505;
    background:var(--yellow);
    border-color:var(--red);
    box-shadow:5px 5px 0 var(--red);
    transform:translate(-2px,-2px) rotate(-1deg);
}

.type-icon{
    font-size:17px;
}

/* =========================================================
   TEXTAREA
========================================================= */

.textarea-wrap{
    position:relative;
    overflow:hidden;
}

textarea{
    display:block;
    width:100%;
    height:105px;
    resize:none;
    padding:12px 14px 26px;
    outline:none;
    color:white;
    background:rgba(15,15,15,.96);
    border:3px solid white;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:12px;
    line-height:1.6;
    cursor:text;
    transition:.2s ease;
}

textarea:focus{
    border-color:var(--yellow);
    box-shadow:
        0 0 0 3px var(--red),
        0 0 20px rgba(255,230,0,.2);
}

.scan-line{
    position:absolute;
    left:-100%;
    top:0;
    width:55%;
    height:100%;
    pointer-events:none;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,230,0,.08),
        rgba(255,255,255,.14),
        transparent
    );
    transform:skewX(-20deg);
}

.textarea-wrap.focused .scan-line{
    animation:scanInput 1.15s ease-out;
}

@keyframes scanInput{
    from{left:-100%}
    to{left:160%}
}

.char-count{
    position:absolute;
    right:9px;
    bottom:6px;
    color:rgba(255,255,255,.55);
    font-family:Arial,sans-serif;
    font-size:10px;
}

/* =========================================================
   RATING
========================================================= */

.rating-row{
    display:flex;
    align-items:center;
    gap:5px;
    min-height:42px;
}

.star{
    padding:0;
    border:0;
    outline:none;
    background:none;
    color:white;
    font-size:35px;
    line-height:1;
    cursor:none;
    -webkit-text-stroke:2px #050505;
    text-shadow:2px 2px 0 #050505;
    transition:.15s ease;
}

.star:hover{
    transform:scale(1.22) rotate(-10deg);
}

.star.active{
    color:var(--yellow);
    transform:scale(1.1);
    text-shadow:
        2px 2px 0 #050505,
        0 0 13px rgba(255,230,0,.8);
}

.rating-text{
    margin-left:8px;
    color:rgba(255,255,255,.65);
    font-family:"Microsoft YaHei",sans-serif;
    font-size:10px;
    font-weight:700;
}

/* =========================================================
   CONTACT
========================================================= */

.contact-input{
    width:100%;
    height:39px;
    padding:0 12px;
    outline:none;
    color:white;
    background:#101010;
    border:3px solid white;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:11px;
    cursor:text;
    transition:.2s ease;
}

.contact-input:focus{
    border-color:var(--yellow);
    box-shadow:0 0 0 3px var(--red);
}

/* =========================================================
   SUBMIT BUTTON
========================================================= */

.submit-wrap{
    display:flex;
    justify-content:center;
    margin-top:14px;
}

.submit-button{
    min-width:290px;
    padding:12px 38px;
    border:4px solid #050505;
    outline:none;
    color:#050505;
    background:var(--yellow);
    box-shadow:
        8px 8px 0 var(--red),
        12px 12px 0 #050505;
    font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;
    font-size:23px;
    font-weight:900;
    transform:skew(-8deg);
    cursor:none;
    transition:.16s ease;
}

.submit-button span{
    display:inline-block;
    transform:skew(8deg);
}

.submit-button:hover{
    transform:skew(-8deg) translate(-4px,-4px);
    box-shadow:
        12px 12px 0 var(--red),
        16px 16px 0 #050505;
}

.submit-button:active{
    transform:skew(-8deg) translate(3px,3px);
}

.submit-button:disabled{
    opacity:.65;
}

.form-status{
    min-height:17px;
    margin-top:12px;
    text-align:center;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:10px;
    font-weight:900;
}

.form-status.error{
    color:#ff5362;
}

.form-status.sending{
    color:var(--yellow);
}

/* =========================================================
   BACKGROUND EFFECTS
========================================================= */

.spark{
    position:fixed;
    z-index:8;
    width:14px;
    height:14px;
    pointer-events:none;
    background:var(--yellow);
    clip-path:polygon(
        50% 0,
        61% 39%,
        100% 50%,
        61% 61%,
        50% 100%,
        39% 61%,
        0 50%,
        39% 39%
    );
    filter:drop-shadow(0 0 6px var(--yellow));
    animation:sparkPulse 2.4s ease-in-out infinite;
}

.spark.s1{left:52%;top:27%}
.spark.s2{left:88%;top:42%;animation-delay:.7s}
.spark.s3{left:57%;top:68%;animation-delay:1.4s}
.spark.s4{left:94%;top:71%;animation-delay:.35s}

@keyframes sparkPulse{
    0%,100%{
        opacity:.2;
        transform:scale(.5) rotate(0deg);
    }
    50%{
        opacity:1;
        transform:scale(1.8) rotate(90deg);
    }
}

.shard{
    position:fixed;
    z-index:7;
    width:90px;
    height:14px;
    pointer-events:none;
    opacity:.4;
    background:var(--red);
    clip-path:polygon(0 40%,100% 0,84% 100%,8% 75%);
    animation:shardFloat 6s ease-in-out infinite;
}

.shard.a{
    left:47%;
    top:14%;
    transform:rotate(-25deg);
}

.shard.b{
    right:3%;
    bottom:15%;
    animation-delay:2s;
}

.shard.c{
    left:54%;
    bottom:6%;
    width:130px;
    animation-delay:3.5s;
}

@keyframes shardFloat{
    0%,100%{
        opacity:.2;
        translate:0 0;
    }
    50%{
        opacity:.65;
        translate:10px -12px;
    }
}

/* =========================================================
   CURSOR
========================================================= */

.cursor{
    position:fixed;
    left:0;
    top:0;
    width:30px;
    height:30px;
    z-index:9999;
    pointer-events:none;
    transform:translate(-50%,-50%);
    transition:width .16s ease,height .16s ease;
}

.cursor::before{
    content:"";
    position:absolute;
    inset:3px;
    border:2px solid var(--yellow);
    border-radius:50%;
    box-shadow:0 0 8px rgba(255,230,0,.8);
    animation:cursorSpin 2.2s linear infinite;
}

.cursor::after{
    content:"✦";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-53%);
    color:var(--yellow);
    font-size:16px;
    text-shadow:0 0 7px red;
}

@keyframes cursorSpin{
    to{transform:rotate(360deg)}
}

body.interactive .cursor{
    width:48px;
    height:48px;
}

body.interactive .cursor::before{
    border-color:var(--red);
    box-shadow:
        0 0 0 3px rgba(255,230,0,.25),
        0 0 15px rgba(239,16,35,.8);
}

/* =========================================================
   CURSOR TRAIL
========================================================= */

.trail{
    position:fixed;
    width:8px;
    height:8px;
    z-index:9998;
    pointer-events:none;
    background:var(--yellow);
    clip-path:polygon(
        50% 0,
        65% 35%,
        100% 50%,
        65% 65%,
        50% 100%,
        35% 65%,
        0 50%,
        35% 35%
    );
    animation:trailFade .52s linear forwards;
}

.trail.red{
    background:var(--red);
}

@keyframes trailFade{
    0%{
        opacity:.95;
        transform:translate(-50%,-50%) scale(1) rotate(0deg);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.1) rotate(150deg);
    }
}

/* =========================================================
   RATING PARTICLES
========================================================= */

.rating-particle{
    position:fixed;
    z-index:9990;
    width:8px;
    height:8px;
    pointer-events:none;
    background:var(--yellow);
    clip-path:polygon(
        50% 0,
        62% 38%,
        100% 50%,
        62% 62%,
        50% 100%,
        38% 62%,
        0 50%,
        38% 38%
    );
    animation:ratingParticle .65s ease-out forwards;
}

@keyframes ratingParticle{
    from{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
    to{
        opacity:0;
        transform:
            translate(var(--dx),var(--dy))
            scale(.1)
            rotate(180deg);
    }
}

/* =========================================================
   SUBMIT SHOCKWAVE
========================================================= */

.submit-wave{
    position:fixed;
    left:50%;
    top:50%;
    width:100px;
    height:100px;
    z-index:10001;
    pointer-events:none;
    border:8px solid var(--yellow);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(.1);
    animation:submitWave .7s ease-out forwards;
}

.submit-wave.red{
    border-color:var(--red);
    animation-delay:.06s;
}

@keyframes submitWave{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.1);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(18);
    }
}

/* =========================================================
   SUCCESS SCREEN
========================================================= */

.success-screen{
    position:fixed;
    inset:0;
    z-index:9000;
    display:flex;
    justify-content:center;
    align-items:center;
    visibility:hidden;
    opacity:0;
    pointer-events:none;
    background:rgba(0,0,0,.74);
    transition:opacity .25s ease;
}

.success-screen.show{
    visibility:visible;
    opacity:1;
    pointer-events:auto;
}

.success-content{
    position:relative;
    padding:50px 70px;
    text-align:center;
    background:var(--red);
    border:6px solid #050505;
    box-shadow:
        15px 15px 0 var(--yellow),
        23px 23px 0 #050505;
    transform:rotate(-3deg) scale(.7);
}

.success-screen.show .success-content{
    animation:successPop .55s cubic-bezier(.2,1.5,.3,1) forwards;
}

@keyframes successPop{
    to{
        transform:rotate(-3deg) scale(1);
    }
}

.success-content::before{
    content:"MISSION COMPLETE";
    position:absolute;
    top:-25px;
    left:30px;
    padding:6px 14px;
    color:#050505;
    background:var(--yellow);
    border:3px solid #050505;
    font-size:13px;
    transform:rotate(3deg);
}

.success-content h2{
    margin:0;
    color:white;
    font-size:clamp(45px,6vw,95px);
    line-height:.83;
    -webkit-text-stroke:3px #050505;
    text-shadow:7px 7px 0 #050505;
}

.success-content h2 span{
    color:var(--yellow);
}

.success-content p{
    margin:25px 0 0;
    font-family:"Microsoft YaHei",sans-serif;
    font-size:14px;
    font-weight:900;
}

.success-close{
    margin-top:24px;
    padding:10px 25px;
    color:#050505;
    background:var(--yellow);
    border:3px solid #050505;
    box-shadow:5px 5px 0 #050505;
    font-family:"Microsoft YaHei",sans-serif;
    font-weight:900;
    cursor:none;
}

/* =========================================================
   PAGE TRANSITION
========================================================= */

.transition{
    position:fixed;
    inset:0;
    z-index:10000;
    opacity:0;
    pointer-events:none;
    background:var(--red);
    clip-path:polygon(
        0 100%,
        100% 100%,
        100% 100%,
        0 100%
    );
    transition:
        opacity .12s,
        clip-path .48s cubic-bezier(.77,0,.18,1);
}

body.leaving .transition{
    opacity:1;
    clip-path:polygon(
        0 0,
        100% 7%,
        100% 100%,
        0 93%
    );
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){
    .feedback-panel{
        width:50vw;
        margin-left:3vw;
    }

    .feedback-title h1{
        font-size:58px;
    }
}

@media(max-height:800px) and (min-width:761px){
    .feedback-panel{
        padding-top:2.5vh;
        transform:scale(.91);
        transform-origin:top left;
    }
}

@media(max-width:760px){
    body{
        overflow:auto;
        cursor:auto;
    }

    .feedback-bg{
        background-position:65% center;
    }

    .feedback-bg::after{
        background:rgba(0,0,0,.7);
    }

    .feedback-panel{
        width:92%;
        margin:0 auto;
        padding:100px 0 60px;
    }

    .feedback-title h1{
        font-size:58px;
    }

    .feedback-title .english{
        margin-left:30px;
    }

    .slogan{
        margin-left:20px;
    }

    .type-options{
        grid-template-columns:1fr;
    }

    .cursor{
        display:none;
    }

    .top-nav{
        top:12px;
        right:12px;
    }

    .top-nav a{
        padding:7px 10px;
        font-size:11px;
    }

    .success-content{
        width:86%;
        padding:40px 20px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<div class="feedback-bg"></div>

<!-- 动态装饰 -->
<div class="spark s1"></div>
<div class="spark s2"></div>
<div class="spark s3"></div>
<div class="spark s4"></div>

<div class="shard a"></div>
<div class="shard b"></div>
<div class="shard c"></div>

<div class="transition"></div>

<!-- =====================================================
     NAV
===================================================== -->

<nav class="top-nav">
    <a href="index.html"
       data-transition
       class="interactive">
        返回搜索
    </a>

    <a href="creator.html"
       data-transition
       class="interactive">
        创作者信息
    </a>
</nav>

<!-- =====================================================
     FEEDBACK
===================================================== -->

<main class="feedback-panel">

    <header class="feedback-title">
        <h1>
            意见<span>反馈</span>
        </h1>

        <div class="english">
            FEEDBACK
        </div>
    </header>

    <div class="slogan">
        你的反馈，是我们的行动力！
    </div>

    <form class="feedback-form"
          id="feedbackForm">

        <!-- TYPE -->
        <div class="field">

            <div class="field-label">
                <span class="cn-label">
                    反馈类型
                </span>

                <span class="en-label">
                    TYPE
                </span>
            </div>

            <div class="type-options">

                <div class="type-option">
                    <input
                        type="radio"
                        id="typeFeature"
                        name="feedback_type"
                        value="功能建议"
                        checked
                    >

                    <label
                        for="typeFeature"
                        class="interactive">
                        <span class="type-icon">✦</span>
                        功能建议
                    </label>
                </div>

                <div class="type-option">
                    <input
                        type="radio"
                        id="typeBug"
                        name="feedback_type"
                        value="问题反馈"
                    >

                    <label
                        for="typeBug"
                        class="interactive">
                        <span class="type-icon">⚠</span>
                        问题反馈
                    </label>
                </div>

                <div class="type-option">
                    <input
                        type="radio"
                        id="typeOther"
                        name="feedback_type"
                        value="其他"
                    >

                    <label
                        for="typeOther"
                        class="interactive">
                        <span class="type-icon">◆</span>
                        其他
                    </label>
                </div>

            </div>
        </div>

        <!-- DETAIL -->
        <div class="field">

            <div class="field-label">
                <span class="cn-label">
                    详细描述
                </span>

                <span class="en-label">
                    DETAIL
                </span>
            </div>

            <div class="textarea-wrap"
                 id="textareaWrap">

                <textarea
                    id="message"
                    name="message"
                    maxlength="500"
                    required
                    placeholder="告诉我你对 PHANTOM SEARCH 的想法……"
                ></textarea>

                <div class="scan-line"></div>

                <div class="char-count">
                    <span id="charCount">0</span>
                    / 500
                </div>

            </div>
        </div>

        <!-- RATING -->
        <div class="field">

            <div class="field-label">
                <span class="cn-label">
                    满意度
                </span>

                <span class="en-label">
                    RATING
                </span>
            </div>

            <div class="rating-row">

                <button type="button"
                        class="star interactive"
                        data-value="1">★</button>

                <button type="button"
                        class="star interactive"
                        data-value="2">★</button>

                <button type="button"
                        class="star interactive"
                        data-value="3">★</button>

                <button type="button"
                        class="star interactive"
                        data-value="4">★</button>

                <button type="button"
                        class="star interactive"
                        data-value="5">★</button>

                <span class="rating-text"
                      id="ratingText">
                    点击星星进行评分
                </span>

                <input
                    type="hidden"
                    name="rating"
                    id="ratingInput"
                    value=""
                >

            </div>
        </div>

        <!-- CONTACT -->
        <div class="field">

            <div class="field-label">
                <span class="cn-label">
                    联系方式
                </span>

                <span class="en-label">
                    CONTACT（可选）
                </span>
            </div>

            <input
                type="text"
                class="contact-input"
                name="contact"
                maxlength="120"
                placeholder="例如：邮箱 / 社交账号（可选）"
            >

        </div>

        <!-- SUBMIT -->
        <div class="submit-wrap">

            <button
                type="submit"
                class="submit-button interactive"
                id="submitButton">

                <span>
                    提交反馈 ➤
                </span>

            </button>

        </div>

        <div
            class="form-status"
            id="formStatus">
        </div>

    </form>

</main>

<!-- =====================================================
     SUCCESS
===================================================== -->

<div class="success-screen"
     id="successScreen">

    <div class="success-content">

        <h2>
            THANKS
            <br>
            <span>FOR YOUR</span>
            <br>
            FEEDBACK!
        </h2>

        <p>
            反馈已成功送达。
            <br>
            感谢你帮助 PHANTOM SEARCH 变得更好。
        </p>

        <button
            type="button"
            class="success-close interactive"
            id="successClose">
            RETURN ↩
        </button>

    </div>

</div>

<div class="cursor"
     id="cursor"></div>

<script>

/* =========================================================
   DOM
========================================================= */

const form =
    document.getElementById("feedbackForm");

const message =
    document.getElementById("message");

const charCount =
    document.getElementById("charCount");

const textareaWrap =
    document.getElementById("textareaWrap");

const stars =
    document.querySelectorAll(".star");

const ratingInput =
    document.getElementById("ratingInput");

const ratingText =
    document.getElementById("ratingText");

const submitButton =
    document.getElementById("submitButton");

const formStatus =
    document.getElementById("formStatus");

const successScreen =
    document.getElementById("successScreen");

const successClose =
    document.getElementById("successClose");

const cursor =
    document.getElementById("cursor");


/* =========================================================
   CHARACTER COUNTER
========================================================= */

message.addEventListener("input",function(){

    charCount.textContent =
        message.value.length;

});


/* =========================================================
   TEXTAREA SCAN
========================================================= */

message.addEventListener("focus",function(){

    textareaWrap.classList.remove("focused");

    void textareaWrap.offsetWidth;

    textareaWrap.classList.add("focused");

});


/* =========================================================
   RATING
========================================================= */

let currentRating = 0;

stars.forEach(star=>{

    star.addEventListener("mouseenter",function(){

        previewRating(
            Number(this.dataset.value)
        );

    });

    star.addEventListener("mouseleave",function(){

        updateRatingDisplay(
            currentRating
        );

    });

    star.addEventListener("click",function(e){

        currentRating =
            Number(this.dataset.value);

        ratingInput.value =
            currentRating;

        updateRatingDisplay(
            currentRating
        );

        createRatingBurst(
            e.clientX,
            e.clientY
        );

    });

});


function previewRating(value){

    stars.forEach(star=>{

        const starValue =
            Number(star.dataset.value);

        star.classList.toggle(
            "active",
            starValue <= value
        );

    });

}


function updateRatingDisplay(value){

    stars.forEach(star=>{

        const starValue =
            Number(star.dataset.value);

        star.classList.toggle(
            "active",
            starValue <= value
        );

    });

    if(value === 0){

        ratingText.textContent =
            "点击星星进行评分";

    }else{

        ratingText.textContent =
            value + " / 5";

    }

}


/* =========================================================
   STAR PARTICLES
========================================================= */

function createRatingBurst(x,y){

    for(let i=0;i<12;i++){

        const particle =
            document.createElement("div");

        particle.className =
            "rating-particle";

        particle.style.left =
            x + "px";

        particle.style.top =
            y + "px";

        const angle =
            Math.random()
            *
            Math.PI
            *
            2;

        const distance =
            25
            +
            Math.random()
            *
            55;

        const dx =
            Math.cos(angle)
            *
            distance;

        const dy =
            Math.sin(angle)
            *
            distance;

        particle.style.setProperty(
            "--dx",
            dx + "px"
        );

        particle.style.setProperty(
            "--dy",
            dy + "px"
        );

        document.body.appendChild(
            particle
        );

        setTimeout(
            ()=>particle.remove(),
            700
        );

    }

}


/* =========================================================
   SUBMIT
========================================================= */

form.addEventListener("submit",async function(e){

    e.preventDefault();


    /* 检查反馈文字 */

    if(message.value.trim().length < 3){

        showError(
            "请至少写下几个字的反馈内容。"
        );

        message.focus();

        return;

    }


    /* 检查评分 */

    if(currentRating === 0){

        showError(
            "请先选择 1–5 星满意度。"
        );

        return;

    }


    submitButton.disabled = true;

    submitButton
        .querySelector("span")
        .textContent =
        "正在发送……";

    formStatus.className =
        "form-status sending";

    formStatus.textContent =
        "正在发送反馈……";


    const formData =
        new FormData(form);


    /*
       FormSubmit 邮件设置
    */

    formData.append(
        "_subject",
        "PHANTOM SEARCH - New Feedback"
    );

    formData.append(
        "_template",
        "table"
    );


    try{

        const response =
            await fetch(
                "https://formsubmit.co/ajax/Henrychen2008@hotmail.com",
                {
                    method:"POST",

                    headers:{
                        "Accept":
                        "application/json"
                    },

                    body:formData
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if(
            result.success === true
            ||
            result.success === "true"
        ){

            submitSuccess();

        }else{

            throw new Error(
                "Submit failed"
            );

        }


    }catch(error){

        console.error(error);

        showError(
            "暂时没有发送成功，请稍后再试。"
        );

        submitButton.disabled =
            false;

        submitButton
            .querySelector("span")
            .textContent =
            "提交反馈 ➤";

    }

});


/* =========================================================
   SUCCESS
========================================================= */

function submitSuccess(){

    createSubmitWave();

    setTimeout(()=>{

        successScreen
            .classList
            .add("show");

    },180);


    form.reset();

    currentRating = 0;

    ratingInput.value = "";

    updateRatingDisplay(0);

    charCount.textContent = "0";

    formStatus.textContent = "";

    formStatus.className =
        "form-status";

    submitButton.disabled = false;

    submitButton
        .querySelector("span")
        .textContent =
        "提交反馈 ➤";

}


/* =========================================================
   ERROR
========================================================= */

function showError(text){

    formStatus.className =
        "form-status error";

    formStatus.textContent =
        text;

}


/* =========================================================
   SUBMIT WAVE
========================================================= */

function createSubmitWave(){

    const yellow =
        document.createElement("div");

    const red =
        document.createElement("div");

    yellow.className =
        "submit-wave";

    red.className =
        "submit-wave red";

    document.body.appendChild(
        yellow
    );

    document.body.appendChild(
        red
    );

    setTimeout(()=>{

        yellow.remove();
        red.remove();

    },850);

}


/* =========================================================
   CLOSE SUCCESS
========================================================= */

successClose.addEventListener(
    "click",
    function(){

        successScreen
            .classList
            .remove("show");

    }
);


/* =========================================================
   CURSOR
========================================================= */

let mouseX = -100;
let mouseY = -100;

let cursorX = -100;
let cursorY = -100;

document.addEventListener(
    "mousemove",
    function(e){

        mouseX =
            e.clientX;

        mouseY =
            e.clientY;

        createTrail(
            mouseX,
            mouseY
        );

    }
);


function animateCursor(){

    cursorX +=
        (mouseX-cursorX)
        *
        .32;

    cursorY +=
        (mouseY-cursorY)
        *
        .32;

    cursor.style.left =
        cursorX + "px";

    cursor.style.top =
        cursorY + "px";

    requestAnimationFrame(
        animateCursor
    );

}

animateCursor();


/* =========================================================
   CURSOR TRAIL
========================================================= */

let lastTrail = 0;

function createTrail(x,y){

    const now =
        performance.now();

    if(now-lastTrail < 38){
        return;
    }

    lastTrail = now;

    const particle =
        document.createElement("div");

    particle.className =
        Math.random()>.55
        ?
        "trail red"
        :
        "trail";

    const offsetX =
        (Math.random()-.5)
        *
        12;

    const offsetY =
        (Math.random()-.5)
        *
        12;

    particle.style.left =
        x + offsetX + "px";

    particle.style.top =
        y + offsetY + "px";

    const size =
        5 +
        Math.random()*6;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    document.body.appendChild(
        particle
    );

    setTimeout(
        ()=>particle.remove(),
        550
    );

}


/* =========================================================
   INTERACTIVE CURSOR
========================================================= */

document
.querySelectorAll(".interactive")
.forEach(element=>{

    element.addEventListener(
        "mouseenter",
        function(){

            document.body
                .classList
                .add("interactive");

        }
    );

    element.addEventListener(
        "mouseleave",
        function(){

            document.body
                .classList
                .remove("interactive");

        }
    );

});


/* =========================================================
   PAGE TRANSITION
========================================================= */

document
.querySelectorAll("[data-transition]")
.forEach(link=>{

    link.addEventListener(
        "click",
        function(e){

            e.preventDefault();

            const target =
                this.href;

            document.body
                .classList
                .add("leaving");

            setTimeout(()=>{

                window.location.href =
                    target;

            },480);

        }
    );

});

</script>

</body>
</html>
